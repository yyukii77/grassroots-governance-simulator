// ---------- 企业Agent ----------
var _businessId = 0;
function createBusiness(industry, size) {

function genCompanyName(industry) {

// ---------- 社会引擎初始化 ----------
function initSociety() {
  if (!G) return;
  _citizenId = 0;
  _householdId = 0;
  _businessId = 0;

  // 初始化市民（抽样2000人代表全市人口）
  G.citizens = [];
  var sampleSize = 2000;
  var basePop = G.population > 1000 ? G.population : 10000;
  var popScale = basePop / sampleSize; // 每个市民代表的人数
  G.popScale = popScale;

  for (var i = 0; i < sampleSize; i++) {
    var age = weightedPick([
      { v: randInt(0, 5), w: 8 }, { v: randInt(6, 12), w: 10 },
      { v: randInt(13, 18), w: 9 }, { v: randInt(19, 29), w: 15 },
      { v: randInt(30, 44), w: 22 }, { v: randInt(45, 59), w: 18 },
      { v: randInt(60, 74), w: 12 }, { v: randInt(75, 90), w: 6 }
    ]);
    G.citizens.push(createCitizen(age));
  }

  // 初始化家庭
  G.households = [];
  var unmarried = G.citizens.filter(function(c) { return c.maritalStatus === '未婚' && c.age >= 18 && c.age < 60; });
  var married = G.citizens.filter(function(c) { return c.maritalStatus === '已婚'; });
  // 配对已婚
  for (var i = 0; i < married.length - 1; i += 2) {
    if (married[i].gender === married[i + 1].gender) continue;
    married[i].spouse = married[i + 1].id;
    married[i + 1].spouse = married[i].id;
    var hh = createHousehold([married[i].id, married[i + 1].id]);
    // 可能有孩子
    if (Math.random() < 0.6) {
      var childCount = randInt(1, 3);
      for (var j = 0; j < childCount; j++) {
        var child = createCitizen(randInt(0, 18));
        child.parents = [married[i].id, married[i + 1].id];
        G.citizens.push(child);
        married[i].children.push(child.id);
        married[i + 1].children.push(child.id);
        hh.members.push(child.id);
      }
    }
    G.households.push(hh);
  }
  // 单身家庭
  for (var i = 0; i < unmarried.length; i += 2) {
    if (Math.random() < 0.3) {
      G.households.push(createHousehold([unmarried[i].id]));
    }
  }
  // 老年家庭
  var elderly = G.citizens.filter(function(c) { return c.age >= 60 && !c.spouse; });
  elderly.forEach(function(c) { if (Math.random() < 0.5) G.households.push(createHousehold([c.id])); });

  // 初始化企业
  G.businesses = [];
  var industryKeys = Object.keys(INDUSTRIES);
  var businessCount = 80 + Math.floor(G.population / 5000);
  for (var i = 0; i < businessCount; i++) {
    var ind = weightedPick(industryKeys.map(function(k) {
      var w = { agriculture: 8, food: 6, textile: 5, chemical: 4, steel: 3, machine: 5, electronic: 4, auto: 2, newEnergy: 1, construction: 6, wholesale: 8, transport: 5, hotel: 6, finance: 3, realestate: 3, it: 3, education: 4, medical: 4, culture: 3, public: 5, service: 7, mining: 2 };
      return { v: k, w: w[k] || 3 };
    }));
    G.businesses.push(createBusiness(ind));
  }

  // 社会指标（必须在assignJobs之前初始化，因为收入计算依赖averageWage）
  G.society = {
    birthRate: 0.018,
    deathRate: 0.007,
    naturalGrowth: 0.011,
    urbanizationRate: 0.35,
    giniCoefficient: 0.35,
    laborParticipation: 0.75,
    averageWage: 45,
    medianIncome: 38,
    povertyRate: 0.08,
    homeOwnership: 0.6,
    averageHousingPrice: 800,
    crimeRate: 0.02,
    divorceRate: 0.05,
    educationAttainment: { 文盲: 0.15, 小学: 0.25, 初中: 0.3, 高中: 0.15, 大专: 0.08, 本科: 0.05, 硕士: 0.015, 博士: 0.005 },
    ageStructure: { '0-14': 0.28, '15-59': 0.62, '60+': 0.10 },
    industryEmployment: { primary: 0.5, secondary: 0.25, tertiary: 0.25 },
    socialSecurityCoverage: 0.4,
    medicalInsuranceCoverage: 0.5,
    pensionCoverage: 0.35
  };

  // 分配工作
  assignJobs();

  G.socialLogs = [];
}

// ---------- 工作分配 ----------
function assignJobs() {
  if (!G || !G.citizens || !G.businesses) return;
  var workers = G.citizens.filter(function(c) { return c.age >= 18 && c.age < 60 && c.isAlive; });
  var totalJobs = G.businesses.reduce(function(s, b) { return s + b.employees; }, 0);
  var employed = 0;
  workers.forEach(function(w) {
    if (employed < totalJobs && Math.random() < 0.92) {
      var b = pick(G.businesses);
      w.occupation = b.industryName + '员工';
      w.workplace = b.id;
      w.industry = b.industry;
      w.income = Math.round((G.society.averageWage||45) * (b.wageLevel/4000) * EDU_INCOME[w.education] * rand(0.8, 1.2));
      w.unemployed = false;
      w.monthsUnemployed = 0;
      employed++;
    } else {
      w.unemployed = true;
      w.occupation = '无业';
      w.workplace = null;
      w.income = 0;
    }
  });
  // 退休人员养老金
  G.citizens.filter(function(c) { return c.age >= 60 && c.isAlive; }).forEach(function(c) {
    c.income = Math.round((G.society.averageWage||45) * EDU_INCOME[c.education] * 0.8);
    c.retired = true;
  });
}

// ---------- 月度社会更新 ----------
// ========== 第一批：市民需求驱动系统 ==========
function updateCitizenNeeds(citizen){
  if(!citizen.isAlive)return;
  var avgWage=(G.society&&G.society.averageWage)||45;
  // 生存需求
  var survivalBase=0.7;
  if(citizen.income<1000)survivalBase-=0.2;
  if(citizen.income<500)survivalBase-=0.3;
  if(citizen.health<30)survivalBase-=0.2;
  if(citizen.unemployed)survivalBase-=0.15;
  if(G.housing&&G.housing.priceIncomeRatio>8)survivalBase-=0.1;
  citizen.needs.survival=clamp(survivalBase+Math.random()*0.1,0,1);
  // 经济需求
  var economicBase=0.5;
  if(citizen.income>avgWage*1.2)economicBase+=0.3;
  else if(citizen.income>avgWage)economicBase+=0.1;
  else if(citizen.income<avgWage*0.7)economicBase-=0.2;
  if(citizen.unemployed)economicBase-=0.3;
  citizen.needs.economic=clamp(economicBase+Math.random()*0.1,0,1);
  // 社交需求
  var socialBase=0.3;
  if(citizen.maritalStatus==='已婚')socialBase+=0.2;
  if(citizen.children&&citizen.children.length>0)socialBase+=0.1;
  if(citizen.age>60&&(!citizen.children||citizen.children.length===0))socialBase-=0.15;
  if(G.socialTension>0.6)socialBase-=0.1;
  citizen.needs.social=clamp(socialBase+Math.random()*0.1,0,1);
  // 尊重需求
  var esteemBase=0.2;
  var eduIdx=EDU_LEVELS.indexOf(citizen.education);
  esteemBase+=(eduIdx/7)*0.3;
  if(citizen.occupation&&['公务员','教师','医生','工程师','管理者'].indexOf(citizen.occupation)>=0)esteemBase+=0.2;
  if(citizen.income>avgWage*2)esteemBase+=0.2;
  citizen.needs.esteem=clamp(esteemBase+Math.random()*0.08,0,1);
  // 自我实现
  var selfBase=0.1;
  if(citizen.age>25&&citizen.age<45)selfBase+=0.1;
  if(citizen.education==='硕士'||citizen.education==='博士')selfBase+=0.2;
  if(citizen.skills&&citizen.skills.技术>3)selfBase+=0.1;
  citizen.needs.selfActual=clamp(selfBase+Math.random()*0.06,0,1);
}

function executeCitizenAction(citizen,action){
  var log=citizen.name+'执行了'+action.type;
  var avgWage=(G.society&&G.society.averageWage)||45;
  switch(action.type){
    case 'job_search':
      var jobProb=(G.livelihood.employment/100)*(0.5+EDU_LEVELS.indexOf(citizen.education)/14);
      if(Math.random()<jobProb){
        citizen.unemployed=false;
        citizen.income=Math.round((G.society.averageWage||45)*(0.6+Math.random()*0.4));
        citizen.monthsUnemployed=0;
        citizen.happiness=clamp(citizen.happiness+10,0,100);
        log+='→找到工作，月收入'+citizen.income;
      }else{
        citizen.monthsUnemployed=(citizen.monthsUnemployed||0)+1;
        citizen.stress=clamp(citizen.stress+3,0,100);
        log+='→未找到工作';
      }
      break;
    case 'apply_subsidy':
      if(G.finance>100){
        var amt=Math.min(2,G.finance*0.001);
        G.finance-=amt;
        citizen.savings+=amt*10000;
        citizen.happiness=clamp(citizen.happiness+5,0,100);
        log+='→获得补贴'+Math.round(amt*10000)+'元';
      }
      break;
    case 'skill_upgrade':
      if(citizen.savings>5000){
        citizen.savings-=5000;
        var gain=Math.floor(Math.random()*3)+1;
        citizen.skills.技术=(citizen.skills.技术||0)+gain;
        citizen.income=Math.round(citizen.income*(1+0.05*gain));
        log+='→技能提升';
      }
      break;
    case 'find_partner':
      if(citizen.age>=22&&citizen.maritalStatus==='未婚'){
        citizen.maritalStatus='已婚';
        citizen.happiness=clamp(citizen.happiness+15,0,100);
        citizen.needs.social=0.1;
        log+='→结婚';
      }
      break;
    case 'have_child':
      if(citizen.gender==='女'&&citizen.age>=20&&citizen.age<=40&&citizen.maritalStatus==='已婚'){
        var bp=0.3;
        if(G.year<2016)bp*=0.4;
        if(G.year>=2016)bp*=1.2;
        if(Math.random()<bp){
          citizen.children.push('child_'+Date.now());
          citizen.happiness=clamp(citizen.happiness+10,0,100);
          citizen.stress=clamp(citizen.stress+8,0,100);
          log+='→生育一个孩子';
        }
      }
      break;
    case 'start_business':
      if(citizen.savings>20000){
        var invest=Math.min(citizen.savings*0.5,50000);
        citizen.savings-=invest;
        if(Math.random()<0.3+(citizen.skills.管理||0)/20){
          citizen.income=Math.round(citizen.income*1.5+invest*0.02);
          citizen.happiness=clamp(citizen.happiness+20,0,100);
          log+='→创业成功';
          if(G.businesses&&G.businesses.length<200){
            var nb=createBusiness('service','小微');
            nb.name=citizen.name+'的企业';
            G.businesses.push(nb);
          }
        }else{
          citizen.savings=Math.max(0,citizen.savings-invest*0.3);
          citizen.happiness=clamp(citizen.happiness-15,0,100);
          citizen.stress=clamp(citizen.stress+20,0,100);
          log+='→创业失败';
        }
      }
      break;
    case 'consume':
      if(citizen.savings>1000){
        var spend=Math.min(citizen.savings*0.1,5000);
        citizen.savings-=spend;
        citizen.happiness=clamp(citizen.happiness+3,0,100);
        G.gdp+=spend/10000;
        log+='→消费'+Math.round(spend)+'元';
      }
      break;
  }
  if(!citizen.behaviorLog)citizen.behaviorLog=[];
  citizen.behaviorLog.push({year:G.year,month:G.month,action:log});
  if(citizen.behaviorLog.length>20)citizen.behaviorLog.shift();
  if(G.citizenBehaviorLog){
    G.citizenBehaviorLog.push({year:G.year,month:G.month,citizen:citizen.name,log:log});
    if(G.citizenBehaviorLog.length>100)G.citizenBehaviorLog.shift();
  }
}

function citizenAct(citizen){
  if(!citizen.isAlive||citizen.age<18)return;
  var n=citizen.needs;
  var action=null;
  if(n.survival<0.35){
    if(citizen.unemployed)action={type:'job_search',intensity:1-n.survival};
    else if(citizen.income<500)action={type:'apply_subsidy',intensity:0.8};
  }else if(n.economic<0.4){
    if(citizen.unemployed)action={type:'job_search',intensity:0.6};
    else if(citizen.income<((G.society&&G.society.averageWage)||45)*0.8)action={type:'skill_upgrade',intensity:0.5};
  }else if(n.social<0.3&&citizen.age>=22&&citizen.age<=40){
    if(citizen.maritalStatus==='未婚')action={type:'find_partner',intensity:0.7};
    else if(citizen.gender==='女'&&citizen.children.length<2)action={type:'have_child',intensity:0.5};
  }else if(n.esteem>0.6||n.selfActual>0.5){
    if(citizen.savings>20000&&citizen.age<45)action={type:'start_business',intensity:n.selfActual*0.8};
    else action={type:'consume',intensity:0.3};
  }else if(Math.random()<0.05){
    action={type:'consume',intensity:0.1};
  }
  if(action)executeCitizenAction(citizen,action);
}

// ========== 第一批：住房市场动态模型 ==========
function updateHousingMarket(){
  if(!G.housing)return;
  // 需求
  var baseDemand=G.population*0.001;
  var investDemand=G.housing.speculationIndex*500;
  G.housing.demand=baseDemand+investDemand;
  // 供给（最低100套防止除零）
  var resBuild=0;try{resBuild=(countBuildingType(3)||0)+(countBuildingType(36)||0);}catch(e){resBuild=100;}
  G.housing.supply=Math.max(100,resBuild*120*(1-G.housing.vacancyRate));
  // 价格 = 年代基准 × 供需因子 × 投机因子
  var basePrice=getHousePrice(G.year);
  var sdRatio=G.housing.supply/Math.max(1,G.housing.demand);
  var supplyFactor=clamp(1/Math.max(0.3,sdRatio),0.5,2.0);  // 供需因子0.5~2.0
  var specFactor=1+G.housing.speculationIndex*0.5;  // 投机加成
  if(G.year>=2016){specFactor*=0.85;G.housing.speculationIndex=Math.max(0,G.housing.speculationIndex-0.01);}
  var targetPrice=basePrice*supplyFactor*specFactor;
  // 平滑过渡到目标价格（每月调整10%）
  if(!G.housing.averagePrice||isNaN(G.housing.averagePrice))G.housing.averagePrice=basePrice;
  G.housing.averagePrice=G.housing.averagePrice*0.9+targetPrice*0.1;
  G.housing.averagePrice=Math.max(100,Math.min(200000,G.housing.averagePrice));
  // 房价收入比
  var medianIncome=(G.society&&G.society.medianIncome)||((G.society&&G.society.averageWage)||45)||3000;
  G.housing.priceIncomeRatio=G.housing.averagePrice/Math.max(1,medianIncome*12)*100;
  G.housing.priceIncomeRatio=clamp(G.housing.priceIncomeRatio,1,50);
  // 租售比
  G.housing.rentPriceRatio=3.6;
  // 空置率
  var targetVac=0.06+G.housing.speculationIndex*0.15;
  G.housing.vacancyRate+=(targetVac-G.housing.vacancyRate)*0.05;
  G.housing.vacancyRate=clamp(G.housing.vacancyRate,0.01,0.5);
  // 高房价影响
  if(G.housing.priceIncomeRatio>10){
    G.satisfaction=clamp(G.satisfaction-0.002,0,1);
    var outflow=Math.floor(G.population*0.0003*(G.housing.priceIncomeRatio-10));
    G.population=Math.max(1000,G.population-outflow);
  }
  if(G.housing.priceIncomeRatio<5){
    var inflow=Math.floor(G.population*0.0002*(5-G.housing.priceIncomeRatio));
    G.population+=inflow;
  }
}

function buildSubsidizedHousing(count){
  var cost=count*50;
  if(cost>G.finance)return{success:false,msg:'财政不足'};
  G.finance-=cost;
  G.housing.supply+=count*80;
  G.housing.demand-=count*0.5;
  G.livelihood.housing=clamp(G.livelihood.housing+count*0.5,0,100);
  G.satisfaction=clamp(G.satisfaction+0.005*count,0,1);
  addLog('住房','建设'+count+'套保障房，支出'+cost+'万元','success');
  return{success:true};
}

// ========== 第一批：产业链投入产出模型 ==========
var INDUSTRY_IO_MATRIX={
  agriculture:{inputs:{chemical:0.06,machine:0.03,service:0.02},outputs:{food:0.12,textile:0.06}},
  food:{inputs:{agriculture:0.18,chemical:0.04,transport:0.06},outputs:{wholesale:0.15,hotel:0.08}},
  textile:{inputs:{agriculture:0.10,chemical:0.12,machine:0.05},outputs:{wholesale:0.20}},
  chemical:{inputs:{agriculture:0.02,service:0.04},outputs:{food:0.02,textile:0.05,machine:0.04}},
  steel:{inputs:{chemical:0.05,transport:0.06},outputs:{machine:0.12,construction:0.18,auto:0.08}},
  machine:{inputs:{steel:0.20,chemical:0.04},outputs:{construction:0.08,auto:0.10}},
  electronic:{inputs:{machine:0.06,chemical:0.06,service:0.03},outputs:{machine:0.05,it:0.20}},
  auto:{inputs:{steel:0.25,machine:0.10,electronic:0.06},outputs:{transport:0.12,wholesale:0.06}},
  construction:{inputs:{steel:0.25,machine:0.08,transport:0.04},outputs:{realestate:0.20,service:0.05}},

  it:{inputs:{electronic:0.10,service:0.06},outputs:{finance:0.04,service:0.08}},
  service:{inputs:{finance:0.03,it:0.02,transport:0.02},outputs:{}}
};

function updateIndustryPrices(){
  for(var industry in INDUSTRY_IO_MATRIX){
    var io=INDUSTRY_IO_MATRIX[industry];
    var costIndex=1.0;
    for(var input in io.inputs){
      var inputPrice=G.industryPrices[input]||1.0;
      costIndex+=io.inputs[input]*(inputPrice-1.0);
    }
    G.industryPrices[industry]=costIndex*(1+(Math.random()-0.5)*0.02);
  }
  var totalIO=0;
  for(var ind in INDUSTRY_IO_MATRIX){
    var i2=INDUSTRY_IO_MATRIX[ind];
    for(var inp in i2.inputs)totalIO+=i2.inputs[inp];
  }
  G.ioMultiplier=1+totalIO*0.02;
}

// ========== 经济闭环：市民消费模块 ==========
function updateCitizenConsumption(){
  if(!G.citizens||!G.economic)return;
  // 消费倾向：受收入阶层、消费信心影响
  var totalConsume=0;
  var demand={};
  var alive=G.citizens.filter(function(c){return c.isAlive&&c.income>0;});
  alive.forEach(function(c){
    // 可支配收入（简化：不扣税，后续可加）
    var disposable=c.income;
    // 边际消费倾向：低收入0.8，中收入0.6，高收入0.4
    var avgW=G.society.averageWage||45;
    var mpc=0.7;
    if(c.income>avgW*2)mpc=0.4;
    else if(c.income>avgW*1.2)mpc=0.6;
    else if(c.income<avgW*0.7)mpc=0.85;
    // 消费信心调整
    mpc*=(0.7+0.6*G.economic.consumerConfidence);
    mpc=Math.min(0.95,mpc);
    var consume=disposable*mpc;
    var save=disposable-consume;
    c.savings=(c.savings||0)+save;
    c.monthlyConsumption=consume;
    totalConsume+=consume;
    // 消费结构（恩格尔系数）
    var foodRatio=Math.max(0.15,0.45-c.income/5000);
    var housingRatio=Math.min(0.35,0.15+c.income/20000);
    var eduRatio=(c.children&&c.children.length>0)?0.1:0.03;
    var medRatio=c.age>55?0.1:0.04;
    var entRatio=Math.min(0.15,0.03+c.income/15000);
    var otherRatio=Math.max(0.05,1-foodRatio-housingRatio-eduRatio-medRatio-entRatio);
    // 映射到行业需求
    demand['food']=(demand['food']||0)+consume*foodRatio;
    demand['realestate']=(demand['realestate']||0)+consume*housingRatio;
    demand['education']=(demand['education']||0)+consume*eduRatio;
    demand['medical']=(demand['medical']||0)+consume*medRatio;
    demand['hotel']=(demand['hotel']||0)+consume*entRatio;
    demand['culture']=(demand['culture']||0)+consume*entRatio*0.5;
    demand['wholesale']=(demand['wholesale']||0)+consume*otherRatio;
    demand['transport']=(demand['transport']||0)+consume*otherRatio*0.3;
  });
  G.economic.marketDemand=demand;
  G.economic.totalConsumption=totalConsume;
  // 消费信心：受满意度和就业影响
  var empRate=G.livelihood.employment/100||0.9;
  G.economic.consumerConfidence=clamp(G.economic.consumerConfidence*0.9+(G.satisfaction*0.5+empRate*0.5)*0.1,0.2,1.0);
  // 乘数效应 = 1/(1-mpc*0.7)
  var avgMpc=totalConsume>0?totalConsume/(alive.reduce(function(s,c){return s+c.income;},0)||1):0.6;
  G.economic.multiplier=Math.min(2.5,1/(1-avgMpc*0.7));
}

function updateBusinessWithIO(){
  if(!G.businesses)return;
  G.industryClusters={};
  G.businesses.forEach(function(b){G.industryClusters[b.industry]=(G.industryClusters[b.industry]||0)+1;});
  G.businesses.forEach(function(b){
    var io=INDUSTRY_IO_MATRIX[b.industry];
    if(!io)return;
    var upstreamCost=0;
    for(var input in io.inputs){
      var priceIdx=G.industryPrices[input]||1.0;
      upstreamCost+=io.inputs[input]*priceIdx*b.revenue*0.15;
    }
    var downstreamDemand=1.0;
    for(var output in io.outputs){
      var demand=G.industryPrices[output]||1.0;
      downstreamDemand+=io.outputs[output]*(demand-1.0)*0.5;
    }
    var clusterCount=G.industryClusters[b.industry]||1;
    var clusterBonus=1+Math.min(0.15,Math.log(clusterCount)*0.05);
    var wageCost=b.employees*b.wageLevel;
    b.profit=b.revenue*downstreamDemand*clusterBonus-wageCost-upstreamCost;
    // 需求驱动：市场需求影响营收增长
    var marketDem=G.economic&&G.economic.marketDemand?G.economic.marketDemand[b.industry]||0:0;
    var demandFactor=1.0;
    if(marketDem>0&&b.revenue>0){
      var demandRatio=marketDem/(b.revenue*b.employees/100||1);
      demandFactor=1+Math.min(0.05,Math.max(-0.03,(demandRatio-1)*0.02));
    }
    var tax=Math.max(0,b.profit*b.taxRate+b.revenue*0.04);
    G.finance+=tax/12;
    if(b.profit>0){
      b.revenue*=(1+b.growthRate/12*(1+G.ioMultiplier*0.1))*demandFactor;
      b.financialHealth=clamp(b.financialHealth+1,0,100);
      // 工资反馈：利润好时涨薪
      if(b.profit>b.revenue*0.1&&Math.random()<0.15){
        b.wageLevel*=1.02;
      }
    }else{
      b.financialHealth=clamp(b.financialHealth-2,0,100);
      // 利润差时降薪或裁员
      if(b.profit<-b.revenue*0.05&&Math.random()<0.1){
        b.wageLevel*=0.98;
        if(b.employees>10&&Math.random()<0.2){
          b.employees=Math.max(5,Math.floor(b.employees*0.95));
        }
      }
    }
  });
}

function triggerEventChain(chainId){
  var chain=EVENT_CHAINS[chainId];
  if(!chain)return;
  if(chain.trigger.condition&&!chain.trigger.condition())return;
  if(G.activeEventChains&&G.activeEventChains.some(function(c){return c.chainId===chainId;}))return;
  var chainInstance={chainId:chainId,name:chain.name,startedAt:G.month,startedYear:G.year,events:chain.chain.map(function(e){return {id:e.id,delay:e.delay,prob:e.prob,severity:e.severity,condition:e.condition,effect:e.effect,triggered:false,scheduledAt:e.delay};}),completed:false};
  if(!G.activeEventChains)G.activeEventChains=[];
  G.activeEventChains.push(chainInstance);
  addLog('事件链','事件链启动：'+chain.name,'danger');
}

function updateEventChains(){
  if(!G.activeEventChains||G.activeEventChains.length===0)return;
  G.activeEventChains.forEach(function(chain){
    if(chain.completed)return;
    var elapsed=(G.year-chain.startedYear)*12+(G.month-chain.startedAt);
    chain.events.forEach(function(e){
      if(e.triggered)return;
      if(elapsed<e.scheduledAt)return;
      if(e.condition&&!e.condition())return;
      if(Math.random()>e.prob)return;
      try{e.effect();e.triggered=true;}catch(err){console.log('事件链执行错误',err);}
    });
    var allTriggered=chain.events.every(function(e){return e.triggered;});
    if(allTriggered||elapsed>60){chain.completed=true;addLog('事件链','事件链 '+chain.name+' 结束','info');}
  });
  G.activeEventChains=G.activeEventChains.filter(function(c){return !c.completed;});
}

// ========== 第二批：土地价值评估 ==========
function evaluateLandValue(x,y){
  var locationScore=0;
  var centerDist=Math.sqrt(Math.pow(x-25,2)+Math.pow(y-25,2));
  locationScore+=Math.max(0,1-centerDist/35)*0.4;
  var nearbyScore=0;
  for(var dy=-3;dy<=3;dy++){
    for(var dx=-3;dx<=3;dx++){
      var nx=x+dx,ny=y+dy;
      if(nx<0||nx>=50||ny<0||ny>=50)continue;
      var type=G.grid[ny]?G.grid[ny][nx]:0;
      if(type===4||type===37)nearbyScore+=0.02;
      if(type===22||type===27)nearbyScore+=0.03;
      if(type===3||type===36)nearbyScore+=0.01;
      if(type===2)nearbyScore+=0.01;
    }
  }
  locationScore+=Math.min(0.3,nearbyScore);
  var roadCount=0;
  for(var dy2=-1;dy2<=1;dy2++){
    for(var dx2=-1;dx2<=1;dx2++){
      var nx2=x+dx2,ny2=y+dy2;
      if(nx2<0||nx2>=50||ny2<0||ny2>=50)continue;
      var t2=G.grid[ny2]?G.grid[ny2][nx2]:0;
      if(t2===2)roadCount++;
    }
  }
  locationScore+=roadCount*0.03;
  var marketFactor=1+(G.housing?G.housing.speculationIndex*0.5:0);
  var basePrice=50+locationScore*150;
  return {price:Math.round(basePrice*marketFactor),locationScore:locationScore,marketFactor:marketFactor};
}

// 土地出让（增强版，与现有startLandAuction共存）
function auctionLand(x,y,usage,far){
  var valuation=evaluateLandValue(x,y);
  var basePrice=valuation.price;
  var farBonus=1+(far-1.5)*0.15;
  var startPrice=Math.round(basePrice*farBonus);
  var numBidders=3+Math.floor(Math.random()*5);
  var bidders=[];
  for(var i=0;i<numBidders;i++){
    var bidderName=REAL_ESTATE_COMPANIES[i%REAL_ESTATE_COMPANIES.length];
    var bidFactor=1+Math.random()*0.6;
    bidders.push({name:bidderName,bid:Math.round(startPrice*bidFactor),quality:Math.random()});
  }
  bidders.sort(function(a,b){return b.bid-a.bid;});
  var winner=bidders[0];
  var finalPrice=winner.bid;
  G.finance+=finalPrice;
  G.housing.landRevenue=(G.housing.landRevenue||0)+finalPrice;
  if(!G.housing.auctionHistory)G.housing.auctionHistory=[];
  G.housing.auctionHistory.push({year:G.year,month:G.month,x:x,y:y,usage:usage,far:far,startPrice:startPrice,finalPrice:finalPrice,winner:winner.name});
  if(finalPrice>startPrice*1.3){G.housing.speculationIndex=Math.min(1,G.housing.speculationIndex+0.02);}
  addLog('土地','地块('+x+','+y+')出让，'+winner.name+'以'+finalPrice+'万竞得','success');
  return {winner:winner,price:finalPrice,bidders:bidders};
}

// ========== 第二批：地方债务管理 ==========
function updateDebt(){
  if(!G.debt)G.debt={balance:0,creditRating:'AA',interestRate:0.04,repaymentCapacity:0.8};
  // 月度利息
  var monthlyInterest=G.debt.balance*G.debt.interestRate/12;
  G.finance-=monthlyInterest;
  // 偿债能力
  var annualRevenue=G.finance*12;
  G.debt.repaymentCapacity=(annualRevenue-1000)/Math.max(1,G.debt.balance*0.1);
  // 信用评级
  var ratingMap={'AAA':100,'AA':85,'A':70,'BBB':55,'BB':40,'B':25,'C':10};
  var currentScore=ratingMap[G.debt.creditRating]||50;
  var ratio=G.debt.balance/Math.max(1,annualRevenue);
  if(ratio<0.5)currentScore=Math.min(100,currentScore+1);
  else if(ratio<0.8)currentScore=Math.min(100,currentScore+0.5);
  else if(ratio<1.0)currentScore=Math.max(0,currentScore-0.5);
  else if(ratio<1.2)currentScore=Math.max(0,currentScore-1);
  else if(ratio<1.5)currentScore=Math.max(0,currentScore-2);
  else currentScore=Math.max(0,currentScore-3);
  var newRating='C';
  if(currentScore>90)newRating='AAA';
  else if(currentScore>75)newRating='AA';
  else if(currentScore>60)newRating='A';
  else if(currentScore>45)newRating='BBB';
  else if(currentScore>30)newRating='BB';
  else if(currentScore>15)newRating='B';
  if(newRating!==G.debt.creditRating){
    addLog('财政','信用评级由 '+G.debt.creditRating+' 调整为 '+newRating,newRating==='AAA'||newRating==='AA'?'success':'warn');
    G.debt.creditRating=newRating;
  }
  var ratingRates={'AAA':0.03,'AA':0.035,'A':0.045,'BBB':0.055,'BB':0.07,'B':0.09,'C':0.12};
  G.debt.interestRate=ratingRates[G.debt.creditRating]||0.06;
  // 债务危机
  if(ratio>1.5&&G.debt.creditRating==='C'){
    G.finance*=0.9;
    G.superiorEval=clamp(G.superiorEval-0.05,0,1);
    addLog('财政','债务危机！财政缩减10%，上级评价下降','danger');
    if(ratio>2.0){
      G.gameOver=true;
      G.gameOverReason='地方债务违约，被上级接管！';
      addLog('财政',G.gameOverReason,'danger');
      if(typeof showGameOver==='function')showGameOver();
    }
  }
}

// 发行地方债
function issueDebt(amount,term){
  if(!G.debt)G.debt={balance:0,creditRating:'AA',interestRate:0.04,repaymentCapacity:0.8};
  if(G.debt.creditRating==='C'){
    addLog('财政','信用评级C级，无法发债','warn');
    return false;
  }
  var maxDebt=G.finance*12*1.5;
  if(G.debt.balance+amount>maxDebt){
    addLog('财政','发债规模超出偿债能力上限','warn');
    return false;
  }
  G.debt.balance+=amount;
  G.finance+=amount;
  if(!G.debts)G.debts=[];
  G.debts.push({amount:amount,remaining:amount,monthly:amount/term,term:term,rate:G.debt.interestRate,year:G.year,month:G.month});
  addLog('财政','发行地方债 '+amount+' 万元，期限'+term+'个月，利率'+(G.debt.interestRate*100).toFixed(1)+'%','success');
  return true;
}

// ========== 第三批：派系博弈系统 ==========
function initFactions(){
  if(!G.factions){
    G.factions={
      '本土派':{power:0.35,departments:['住建局','交通局','水利局','农业局'],leader:null,relations:{}},
      '外来派':{power:0.25,departments:['发改委','商务局','科技局'],leader:null,relations:{}},
      '学院派':{power:0.20,departments:['教育局','卫生局','人社局'],leader:null,relations:{}},
      '军旅派':{power:0.15,departments:['公安局','应急局','武装部'],leader:null,relations:{}},
      '秘书帮':{power:0.05,departments:['党委办','政府办','组织部'],leader:null,relations:{}}
    };
  }
  if(!G.factionTension)G.factionTension=0.2;
  if(!G.factionBalance)G.factionBalance=0.6;
  // 补全干部派系字段
  if(G.cadres){
    G.cadres.forEach(function(c){
      if(!c.faction||c.faction==='无派系')c.faction=['本土派','外来派','学院派','军旅派','秘书帮'][Math.floor(Math.random()*5)];
      if(c.factionLoyalty===undefined)c.factionLoyalty=0.5+Math.random()*0.3;
      if(!c.allies)c.allies=[];
      if(!c.rivals)c.rivals=[];
    });
  }
  // 分配派系领袖
  for(var fname in G.factions){
    var leaders=G.cadres?G.cadres.filter(function(c){return c.faction===fname&&c.rank>=3;}):[];
    if(leaders.length>0){
      leaders.sort(function(a,b){return b.rank-a.rank;});
      G.factions[fname].leader=leaders[0].id;
    }
  }
}

function updateFactionPower(){
  if(!G.factions||!G.cadres)return;
  for(var fname in G.factions){
    var members=G.cadres.filter(function(c){return c.faction===fname;});
    var power=members.length*0.01;
    members.forEach(function(c){
      var r=parseFloat(c.rank)||0;
      var l=parseFloat(c.loyalty)||0;
      power+=r*0.02;
      power+=l*0.005;
    });
    if(isNaN(power)||!isFinite(power))power=0.1;
    G.factions[fname].power=Math.min(1,Math.max(0.01,power));
  }
  // 派系关系演变
  var fnames=Object.keys(G.factions);
  for(var i=0;i<fnames.length;i++){
    for(var j=i+1;j<fnames.length;j++){
      var f1=fnames[i],f2=fnames[j];
      if(!G.factions[f1].relations)G.factions[f1].relations={};
      if(!G.factions[f2].relations)G.factions[f2].relations={};
      var current=G.factions[f1].relations[f2]||0;
      var powerDiff=G.factions[f1].power-G.factions[f2].power;
      var tension=(1-Math.abs(powerDiff))*0.5;
      current+=(tension*0.02-0.01);
      current=clamp(current,-1,1);
      G.factions[f1].relations[f2]=current;
      G.factions[f2].relations[f1]=current;
    }
  }
  // 派系紧张度
  var totalTension=0,pairCount=0;
  for(var fn in G.factions){
    for(var other in G.factions[fn].relations){
      totalTension+=Math.abs(G.factions[fn].relations[other]);
      pairCount++;
    }
  }
  G.factionTension=(pairCount>0&&!isNaN(totalTension/pairCount))?totalTension/pairCount:0.2;
  // 派系平衡度
  var powers=Object.values(G.factions).map(function(f){return f.power;});
  var avg=powers.reduce(function(a,b){return a+b;},0)/powers.length;
  var variance=powers.reduce(function(a,b){return a+Math.pow(b-avg,2);},0)/powers.length;
  G.factionBalance=(!isNaN(variance))?Math.max(0,1-Math.sqrt(variance)*3):0.6;
}

function getFactionSupport(cadreId,position){
  var cadre=G.cadres?G.cadres.find(function(c){return c.id===cadreId;}):null;
  if(!cadre)return 0;
  var faction=G.factions?G.factions[cadre.faction]:null;
  if(!faction)return 0;
  var support=faction.power*(cadre.factionLoyalty||0.5);
  // 跨派系任命
  var deptFaction=null;
  for(var fname in G.factions){
    if(G.factions[fname].departments.indexOf(position)>=0){
      deptFaction=fname;break;
    }
  }
  if(deptFaction&&deptFaction!==cadre.faction){
    var relation=G.factions[deptFaction].relations[cadre.faction]||0;
    support*=(1+relation*0.3);
  }
  return clamp(support,0,1);
}

// 增强版人事任命（带派系支持度检查）
function appointCadreWithFaction(cadreId,newPosition,newRank){
  var c=G.cadres?G.cadres.find(function(x){return x.id===cadreId;}):null;
  if(!c)return{success:false,msg:'干部不存在'};
  var support=getFactionSupport(cadreId,newPosition);
  if(support<0.3){
    return{success:false,msg:'派系支持不足（需要30%，当前'+Math.round(support*100)+'%）'};
  }
  // 执行任命
  if(newRank>c.rank){
    c.rank=newRank;
    c.factionLoyalty=clamp((c.factionLoyalty||0.5)+0.1,0,1);
    c.achievements.push(G.year+'年提拔为'+newPosition);
    addLog('人事',c.name+'提拔为'+newPosition+'（派系支持'+Math.round(support*100)+'%）','success');
  }else if(newRank<c.rank){
    c.rank=newRank;
    c.factionLoyalty=clamp((c.factionLoyalty||0.5)-0.15,0,1);
    c.disciplineRecord.push(G.year+'年降职为'+newPosition);
    addLog('人事',c.name+'降职为'+newPosition,'warn');
  }else{
    c.factionLoyalty=clamp((c.factionLoyalty||0.5)+0.05,0,1);
    addLog('人事',c.name+'平调至'+newPosition,'info');
  }
  c.position=newPosition;
  c.department=newPosition.replace('局长','').replace('主任','');
  c.yearsInPosition=0;
  updateFactionPower();
  return{success:true,support:support};
}

// ========== 第三批：央地关系与年度考核 ==========
function getAssessmentTarget(key){
  var baseTargets={
    gdp:50000+G.rank*20000,
    environment:50+G.rank*5,
    livelihood:40+G.rank*4,
    stability:70,
    innovation:20+G.rank*5
  };
  var focus=G.centralPolicy?G.centralPolicy.focus:'gdp';
  if(focus===key)return baseTargets[key]*1.2;
  return baseTargets[key];
}

function getActualValue(key){
  switch(key){
    case 'gdp':return G.gdp;
    case 'environment':return 100-G.pollution;
    case 'livelihood':return G.satisfaction*100;
    case 'stability':return 100-(G.socialTension||0.2)*100;
    case 'innovation':return G.educationIndex*0.5+(G.techIndex||0)*0.5;
    default:return 50;
  }
}

function runAnnualAssessment(){
  if(!G.centralPolicy)G.centralPolicy={focus:'gdp',assessmentWeights:{gdp:0.35,environment:0.15,livelihood:0.20,stability:0.15,innovation:0.15}};
  var weights=G.centralPolicy.assessmentWeights;
  var totalScore=0;
  var details=[];
  for(var key in weights){
    var target=getAssessmentTarget(key);
    var actual=getActualValue(key);
    var ratio=Math.min(1.2,actual/Math.max(1,target));
    var score=weights[key]*ratio*100;
    totalScore+=score;
    details.push({key:key,target:target,actual:actual,ratio:ratio,score:score});
  }
  G.annualAssessment={score:totalScore,grade:'合格',feedback:'',details:details};
  if(totalScore>=80){
    G.annualAssessment.grade='优秀';
    G.superiorEval=clamp(G.superiorEval+0.05,0,1);
    addLog('考核','年度考核优秀！得分'+Math.round(totalScore)+'，上级评价+5%','success');
  }else if(totalScore>=60){
    G.annualAssessment.grade='良好';
    G.superiorEval=clamp(G.superiorEval+0.02,0,1);
    addLog('考核','年度考核良好，得分'+Math.round(totalScore),'info');
  }else if(totalScore>=40){
    G.annualAssessment.grade='合格';
    G.superiorEval=clamp(G.superiorEval-0.02,0,1);
    addLog('考核','年度考核合格，得分'+Math.round(totalScore)+'，上级评价-2%','warn');
  }else{
    G.annualAssessment.grade='不合格';
    G.superiorEval=clamp(G.superiorEval-0.08,0,1);
    addLog('考核','年度考核不合格！得分'+Math.round(totalScore)+'，上级评价-8%','danger');
    if(G.superiorEval<0.2){
      G.gameOver=true;
      G.gameOverReason='连续年度考核不合格，被调离岗位！';
      addLog('考核',G.gameOverReason,'danger');
      if(typeof showGameOver==='function')showGameOver();
    }
  }
  // 中央政策焦点年度调整
  var focuses=['gdp','environment','livelihood','stability','innovation'];
  G.centralPolicy.focus=focuses[Math.floor(Math.random()*focuses.length)];
  // 权重微调
  var wKeys=Object.keys(G.centralPolicy.assessmentWeights);
  var rk=wKeys[Math.floor(Math.random()*wKeys.length)];
  G.centralPolicy.assessmentWeights[rk]=clamp(G.centralPolicy.assessmentWeights[rk]+(Math.random()-0.5)*0.05,0.05,0.5);
  var totalW=0;
  for(var k in G.centralPolicy.assessmentWeights)totalW+=G.centralPolicy.assessmentWeights[k];
  for(var k2 in G.centralPolicy.assessmentWeights)G.centralPolicy.assessmentWeights[k2]/=totalW;
  addLog('央地','中央政策焦点调整为：'+({gdp:'经济发展',environment:'环境保护',livelihood:'民生改善',stability:'社会稳定',innovation:'科技创新'}[G.centralPolicy.focus]),'info');
}

function applyForSpecialFund(project){
  var successProb=0.3+G.superiorEval*0.3+(G.annualAssessment&&G.annualAssessment.grade==='优秀'?0.2:0);
  var amount=50+Math.floor(Math.random()*200);
  if(Math.random()<successProb){
    G.finance+=amount;
    if(!G.centralPolicy.specialFunds)G.centralPolicy.specialFunds=[];
    G.centralPolicy.specialFunds.push({project:project,amount:amount,year:G.year});
    addLog('央地','向上争取到专项资金'+amount+'万元用于'+project,'success');
    return{success:true,amount:amount};
  }else{
    addLog('央地','向上争取'+project+'专项资金未获批','warn');
    return{success:false};
  }
}

function updateSocietyMonthly() {
  if (!G || !G.citizens) return;
  // 更新人口缩放系数
  if (G.population > 1000) {
    G.popScale = G.population / G.citizens.filter(function(c) { return c.isAlive; }).length;
  }
  var year = G.year, month = G.month;
  var eraFactor = getEraFactor(year);

  // 1. 年龄增长（每年1月）
  if (month === 1) {
    G.citizens.forEach(function(c) {
      if (c.isAlive) {
        c.age++;
        // 教育进度
        if (c.age < 22 && c.educationProgress < 1) {
          c.educationProgress = clamp(c.educationProgress + 0.08 + G.educationIndex / 500, 0, 1);
          if (c.educationProgress >= 1) {
            var idx = EDU_LEVELS.indexOf(c.education);
            if (idx < EDU_LEVELS.length - 1 && Math.random() < 0.4 + G.educationIndex / 200) {
              c.education = EDU_LEVELS[idx + 1];
              c.educationProgress = 0;
            }
          }
        }
        // 退休
        if (c.age === 60 && !c.retired) {
          c.retired = true;
          c.occupation = '退休';
          c.lifeEvents.push(year + '年退休');
        }
        // 健康随年龄下降
        if (c.age > 50) c.health = clamp(c.health - rand(0.5, 2), 0, 100);
        if (c.age > 70) c.health = clamp(c.health - rand(1, 3), 0, 100);
      }
    });
  }

  // 2. 出生与死亡
  var births = 0, deaths = 0;
  G.citizens.forEach(function(c) {
    if (!c.isAlive) return;
    // 死亡概率
    var deathProb = 0.001;
    if (c.age > 60) deathProb += (c.age - 60) * 0.002;
    if (c.age > 80) deathProb += (c.age - 80) * 0.005;
    if (c.health < 30) deathProb += 0.02;
    if (G.pollution > 60) deathProb += (G.pollution - 60) / 5000;
    if (Math.random() < deathProb / 12) {
      c.isAlive = false;
      deaths++;
      c.lifeEvents.push(year + '年' + month + '月去世，享年' + c.age + '岁');
    }
    // 生育
    if (c.gender === '女' && c.age >= 20 && c.age <= 40 && c.maritalStatus === '已婚' && !c.unemployed) {
      var birthProb = 0.25 * eraFactor.fertility;
      birthProb *= (1 - G.livelihood.housing / 300);
      birthProb *= (1 - c.stress / 300);
      if (year < 2000) birthProb *= 0.8; // 计划生育
      if (year >= 2016) birthProb *= 1.3; // 全面二孩
      if (year >= 2021) birthProb *= 1.1; // 三孩
      if (Math.random() < birthProb / 12) {
        var baby = createCitizen(0, Math.random() < 0.51 ? '男' : '女', '文盲');
        baby.parents = [c.id, c.spouse];
        G.citizens.push(baby);
        c.children.push(baby.id);
        if (c.spouse) {
          var spouse = G.citizens.find(function(x) { return x.id === c.spouse; });
          if (spouse) spouse.children.push(baby.id);
        }
        births++;
        c.lifeEvents.push(year + '年生育');
      }
    }
  });

  // 更新人口
  var scale = G.popScale || 250;
  G.population += Math.round((births - deaths) * scale);
  G.population = Math.max(1000, G.population);
  // 第一批新系统调用见下方
  G.society.birthRate = births / G.citizens.filter(function(c) { return c.isAlive; }).length * 12;
  G.society.deathRate = deaths / G.citizens.filter(function(c) { return c.isAlive; }).length * 12;

  // 3. 企业月度经营
  var totalWages = 0, totalProfit = 0, totalTax = 0, totalPollution = 0;
  G.businesses.forEach(function(b) {
    // 营收增长
    b.revenue *= (1 + b.growthRate / 12 + rand(-0.02, 0.02));
    b.revenue = Math.max(10, b.revenue);
    // 利润
    b.profit = b.revenue * rand(0.03, 0.18);
    // 工资支出
    var wageCost = b.employees * b.wageLevel;
    totalWages += wageCost;
    // 税收
    var tax = Math.max(0, b.profit * b.taxRate + b.revenue * 0.06);
    totalTax += tax;
    // 污染
    totalPollution += b.pollution * b.employees / 100;
    // 招聘/裁员
    if (b.hiring && b.employees < b.maxEmployees && Math.random() < 0.1) {
      b.employees += randInt(1, Math.max(1, Math.floor(b.employees * 0.05)));
    }
    if (b.profit < 0 && Math.random() < 0.05) {
      b.employees = Math.max(1, b.employees - randInt(1, 5));
      b.layoff = true;
    }
    // 企业破产
    if (b.financialHealth < 20 && Math.random() < 0.02) {
      b.bankrupt = true;
    }
    b.financialHealth = clamp(b.financialHealth + (b.profit > 0 ? 1 : -2), 0, 100);
  });
  // 移除破产企业，新增企业
  G.businesses = G.businesses.filter(function(b) { return !b.bankrupt; });
  if (Math.random() < 0.3 && G.businesses.length < 200) {
    G.businesses.push(createBusiness(pick(Object.keys(INDUSTRIES))));
  }

  // 4. 就业市场调整
  var totalJobs = G.businesses.reduce(function(s, b) { return s + b.employees; }, 0);
  var laborForce = G.citizens.filter(function(c) { return c.age >= 18 && c.age < 60 && c.isAlive; }).length;
  var unemploymentRate = clamp(1 - totalJobs / (laborForce * 0.9), 0.02, 0.3);
  G.livelihood.employment = clamp(100 - unemploymentRate * 100, 20, 100);

  // 失业者找工作
  G.citizens.filter(function(c) { return c.unemployed && c.age >= 18 && c.age < 60 && c.isAlive; }).forEach(function(c) {
    c.monthsUnemployed++;
    if (Math.random() < (1 - unemploymentRate) * 0.15) {
      var b = pick(G.businesses);
      c.occupation = b.industryName + '员工';
      c.workplace = b.id;
      c.industry = b.industry;
      c.income = Math.round((G.society.averageWage||45) * (b.wageLevel/4000) * EDU_INCOME[c.education] * rand(0.8, 1.2));
      c.unemployed = false;
      c.monthsUnemployed = 0;
      c.stress = clamp(c.stress - 10, 0, 100);
    } else {
      c.stress = clamp(c.stress + 2, 0, 100);
      c.happiness = clamp(c.happiness - 1, 0, 100);
    }
  });

  // 5. 工资与收入更新
  var incomes = [];
  G.citizens.filter(function(c) { return c.isAlive && c.income > 0; }).forEach(function(c) {
    if (!c.unemployed && !c.retired) {
      c.income = Math.round(c.income * (1 + rand(-0.01, 0.02)));
    }
    incomes.push(c.income);
  });
  incomes.sort(function(a, b) { return a - b; });
  G.society.averageWage = Math.round(incomes.reduce(function(s, v) { return s + v; }, 0) / Math.max(1, incomes.length));
  G.society.medianIncome = incomes[Math.floor(incomes.length / 2)] || 3000;

  // 6. 健康与医疗
  var totalMedical = 0;
  G.citizens.forEach(function(c) {
    if (!c.isAlive) return;
    // 疾病概率
    var sickProb = 0.02;
    if (c.age > 50) sickProb += (c.age - 50) * 0.003;
    if (G.pollution > 40) sickProb += G.pollution / 1000;
    if (Math.random() < sickProb / 12) {
      var cost = rand(200, c.age > 60 ? 5000 : 1000);
      c.medicalExpense = cost;
      totalMedical += cost;
      c.health = clamp(c.health - rand(2, 10), 0, 100);
      c.stress = clamp(c.stress + 5, 0, 100);
      // 医保报销
      if (Math.random() < G.society.medicalInsuranceCoverage) {
        cost *= 0.3;
      }
      c.savings -= cost;
      if (c.savings < -10000) c.debt += Math.abs(c.savings);
    }
    // 健康恢复
    if (c.health < 100 && Math.random() < 0.1) c.health = clamp(c.health + rand(1, 5), 0, 100);
  });

  // 7. 幸福感更新
  G.citizens.forEach(function(c) {
    if (!c.isAlive) return;
    var h = 50;
    h += (c.income / G.society.averageWage - 1) * 20;
    h += (c.health - 50) * 0.3;
    h -= c.stress * 0.2;
    h += G.livelihood.employment * 0.2;
    h += G.educationIndex * 0.1;
    h += G.medicalIndex * 0.1;
    h -= G.pollution * 0.15;
    h += (c.maritalStatus === '已婚' ? 5 : -3);
    h += c.children.length > 0 ? 3 : 0;
    if (c.unemployed) h -= 15;
    c.happiness = clamp(c.happiness * 0.9 + h * 0.1, 0, 100);
  });

  // 8. 宏观社会指标
  var alive = G.citizens.filter(function(c) { return c.isAlive; });
  G.society.ageStructure = {
    '0-14': alive.filter(function(c) { return c.age <= 14; }).length / alive.length,
    '15-59': alive.filter(function(c) { return c.age >= 15 && c.age <= 59; }).length / alive.length,
    '60+': alive.filter(function(c) { return c.age >= 60; }).length / alive.length
  };
  var eduCount = {};
  alive.filter(function(c) { return c.age >= 25; }).forEach(function(c) { eduCount[c.education] = (eduCount[c.education] || 0) + 1; });
  var eduTotal = alive.filter(function(c) { return c.age >= 25; }).length || 1;
  G.society.educationAttainment = {};
  EDU_LEVELS.forEach(function(e) { G.society.educationAttainment[e] = (eduCount[e] || 0) / eduTotal; });

  // 基尼系数
  var sorted = incomes.slice();
  var n = sorted.length;
  if (n > 10) {
    var mean = sorted.reduce(function(s, v) { return s + v; }, 0) / n;
    var absSum = 0;
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) absSum += Math.abs(sorted[i] - sorted[j]);
    G.society.giniCoefficient = clamp(absSum / (2 * n * n * mean), 0.2, 0.6);
  }

  // 三产就业结构
  var primary = ['agriculture'], secondary = ['mining','food','textile','chemical','steel','machine','electronic','auto','newEnergy','construction'];
  var empCount = { primary: 0, secondary: 0, tertiary: 0 };
  alive.filter(function(c) { return c.industry; }).forEach(function(c) {
    if (primary.indexOf(c.industry) >= 0) empCount.primary++;
    else if (secondary.indexOf(c.industry) >= 0) empCount.secondary++;
    else empCount.tertiary++;
  });
  var empTotal = empCount.primary + empCount.secondary + empCount.tertiary || 1;
  G.society.industryEmployment = {
    primary: empCount.primary / empTotal,
    secondary: empCount.secondary / empTotal,
    tertiary: empCount.tertiary / empTotal
  };

  // 社保覆盖率随年代提升
  G.society.socialSecurityCoverage = clamp(0.3 + (year - 1980) * 0.015, 0.3, 0.95);
  G.society.medicalInsuranceCoverage = clamp(0.4 + (year - 1980) * 0.018, 0.4, 0.98);
  G.society.pensionCoverage = clamp(0.25 + (year - 1980) * 0.016, 0.25, 0.95);
  G.society.urbanizationRate = clamp(0.2 + (year - 1980) * 0.012, 0.2, 0.85);
  G.society.homeOwnership = clamp(0.5 + (year - 1990) * 0.008, 0.5, 0.85);

  // 房价
  G.society.averageHousingPrice = Math.round(500 * Math.pow(1.08, year - 1980) * (1 + G.gdp / 100000));

  // 犯罪率
  G.society.crimeRate = clamp(0.01 + unemploymentRate * 0.1 + G.society.giniCoefficient * 0.05 - G.livelihood.employment / 500, 0.005, 0.08);

  // 全局满意度（市民幸福感均值）
  var avgHappiness = alive.reduce(function(s, c) { return s + c.happiness; }, 0) / alive.length;
  G.satisfaction = clamp(avgHappiness / 100, 0, 1);

  // 记录社会日志
  if (month === 1 || month === 7) {
    G.socialLogs.push({
      year: year, month: month,
      population: G.population,
      gdp: G.gdp,
      happiness: Math.round(avgHappiness),
      unemployment: Math.round(unemploymentRate * 1000) / 10,
      avgWage: G.society.averageWage,
      gini: Math.round(G.society.giniCoefficient * 100) / 100,
      pollution: Math.round(G.pollution)
    });
  }

  // 平均工资随年代增长（1980年45元→2020年约12000元，年增长15%）
  var targetWage = Math.round(45 * Math.pow(1.15, G.year - 1980));
  G.society.averageWage = targetWage;
  G.society.medianIncome = Math.round(targetWage * 0.85);

  // ===== 第三批：派系与央地关系 =====
  try{if(!G.factions||!G.factions['本土派']||!G.factions['本土派'].departments)initFactions();updateFactionPower();}catch(e){}
  if(G.month===1){try{runAnnualAssessment();}catch(e){}}

  // ===== 第二批：事件链与外部冲击 =====
  try{checkExternalShocks();}catch(e){}
  if(Math.random()<0.01){
    var chainIds=Object.keys(EVENT_CHAINS);
    var selectedChain=chainIds[Math.floor(Math.random()*chainIds.length)];
    try{triggerEventChain(selectedChain);}catch(e){}
  }
  try{updateEventChains();}catch(e){}
  // ===== 第二批：地方债务 =====
  try{updateDebt();}catch(e){}

  // ===== 第一批：市民需求驱动（30%采样）=====
  var _aliveC=G.citizens.filter(function(c){return c.isAlive;});
  var _sampleN=Math.floor(_aliveC.length*0.3);
  for(var _si=0;_si<_sampleN;_si++){
    var _sc=_aliveC[Math.floor(Math.random()*_aliveC.length)];
    if(_sc){try{updateCitizenNeeds(_sc);if(Math.random()<0.3)citizenAct(_sc);}catch(e){}}
  }
  // ===== 第一批：住房市场 =====
  try{updateHousingMarket();}catch(e){}
  // ===== 第一批：产业链 =====
  try{updateIndustryPrices();updateBusinessWithIO();}catch(e){}

  return { births: births, deaths: deaths, unemploymentRate: unemploymentRate, avgHappiness: avgHappiness };
}

// ---------- 年代系数 ----------
function getEraFactor(year) {
  if (year < 1990) return { fertility: 1.2, growth: 0.08, wageMult: 0.4, tech: 0.3 };
  if (year < 2000) return { fertility: 0.9, growth: 0.1, wageMult: 0.6, tech: 0.5 };
  if (year < 2010) return { fertility: 0.7, growth: 0.12, wageMult: 0.85, tech: 0.7 };
  if (year < 2020) return { fertility: 0.6, growth: 0.08, wageMult: 1.1, tech: 0.9 };
  return { fertility: 0.5, growth: 0.05, wageMult: 1.3, tech: 1.0 };
}

      c.performance = Math.min(100, c.performance + 3);

    } else if (score >= 60) {

      c.stress += 10;

function bidForProject(projectId) {
  var p = G.projects.find(function(x) { return x.id === projectId; });
  if (!p || p.status !== '立项') return { success: false };
  // 模拟招投标
  var bidders = [];
  for (var i = 0; i < 3 + Math.floor(Math.random()*3); i++) {
    bidders.push({
      name: ['中建','中铁','中交','本地建工','民营建筑','省建集团'][Math.floor(Math.random()*6)] + (Math.floor(Math.random()*99)+1) + '公司',
      price: Math.round(p.cost * (0.85 + Math.random()*0.25)),
      techScore: 50 + Math.floor(Math.random()*50)
    });
  }
  // 综合评分法
  var winner = bidders.reduce(function(a, b) {
    var sa = (1 - Math.abs(a.price - p.cost)/p.cost) * 50 + a.techScore * 0.5;
    var sb = (1 - Math.abs(b.price - p.cost)/p.cost) * 50 + b.techScore * 0.5;
    return sa > sb ? a : b;
  });
  p.contractor = winner.name;
  p.status = '施工';
  p.actualCost = winner.price;
  addLog('工程', p.name + '由' + winner.name + '中标，中标价' + p.actualCost + '万元', 'info');
  return { success: true, winner: winner, bidders: bidders };
}

function updateProjects() {
  if (!G.projects) G.projects = [];
  G.projects.forEach(function(p) {
    if (p.status === '施工') {
      p.progress += 100 / p.duration;
      // 每月工程款支出
      var monthlyCost = p.actualCost / p.duration;
      G.finance -= monthlyCost;
      G.gdp += monthlyCost * 0.8; // 建筑业GDP
      // 质量事故
      if (Math.random() < 0.02 && p.quality < 80) {
        p.quality = Math.max(0, p.quality - 10);
        addLog('工程', p.name + '发生质量问题，正在整改', 'warn');
        G.satisfaction = Math.max(0, G.satisfaction - 0.01);
      }
      // 安全事故
      if (Math.random() < 0.01) {
        addLog('工程', p.name + '发生安全事故，正在处理', 'danger');
        G.superiorEval = Math.max(0, G.superiorEval - 0.02);
        G.satisfaction = Math.max(0, G.satisfaction - 0.02);
      }
      if (p.progress >= 100) {
        p.progress = 100;
        p.status = '竣工';
        p.endYear = G.year;
        p.endMonth = G.month;
        // 竣工效果
        G.gdp += p.cost * p.gdpBoost * 10;
        G.population += p.popBoost;
        G.satisfaction = Math.min(1, G.satisfaction + p.satisfaction / 100);
        G.pollution = clamp(G.pollution + p.pollution, 0, 100);
        G.educationIndex = Math.min(100, G.educationIndex + (p.type === '学校医院' ? 5 : 0));
        G.medicalIndex = Math.min(100, G.medicalIndex + (p.type === '学校医院' ? 5 : 0));
        addLog('工程', p.name + '竣工！总投资' + p.actualCost + '万元，质量评级' + (p.quality >= 90 ? '优良' : p.quality >= 75 ? '合格' : '较差'), 'success');
        markPollutionDirty();
      }
    }
  });
}

function registerBusiness(name, type, industry) {
  if (!G.registrations) G.registrations = [];
  var namePrefixes = ['宏达','鑫源','恒泰','昌盛','永兴','通达','汇丰','金泰','德信','博远','创新','卓越','蓝天','绿地','金山','银海','东方','南方','北方','中原','锦绣','鹏程','万达','恒大','碧桂园','联想','华为','中兴','海尔','格力'];
  var nameSuffixes = ['科技','实业','贸易','建设','农业','服务','文化','咨询','物流','餐饮','纺织','机械','电子','化工','建材','食品','医药','能源','环保','教育'];
  var companyTypes = ['有限责任公司','个体工商户','合伙企业','股份有限公司'];
  var generatedName = namePrefixes[Math.floor(Math.random()*namePrefixes.length)] + nameSuffixes[Math.floor(Math.random()*nameSuffixes.length)] + companyTypes[Math.floor(Math.random()*companyTypes.length)];
  var reg = {
    id: 'R' + Date.now() + Math.floor(Math.random()*1000),
    name: name || generatedName,
    type: type || BUSINESS_TYPES[Math.floor(Math.random()*BUSINESS_TYPES.length)],
    industry: industry || (INDUSTRIES ? Object.keys(INDUSTRIES)[Math.floor(Math.random()*Object.keys(INDUSTRIES).length)] : '服务业'),
    status: '待审批',
    applyDate: G.year + '-' + G.month,
    capital: Math.floor(Math.random()*500) + 10,
    approved: false
  };
  G.registrations.push(reg);
  return reg;
}

function approveRegistration(regId, approve) {
  var r = G.registrations.find(function(x) { return x.id === regId; });
  if (!r) return;
  if (approve) {
    r.status = '已批准';
    r.approved = true;
    r.approveDate = G.year + '-' + G.month;
    // 新增企业
    if (G.businesses) {
      var b = createBusiness(r.industry, '小微');
      b.name = r.name;
      G.businesses.push(b);
    }
    G.finance += r.capital * 0.05; // 注册税费
    addLog('工商', r.name + '注册成立，注册资本' + r.capital + '万元', 'success');
  } else {
    r.status = '已驳回';
    addLog('工商', r.name + '注册申请被驳回', 'warn');
  }
}

function autoRegisterBusinesses() {
  if (!G.registrations) G.registrations = [];
  // 每月自动产生注册申请
  var count = 1 + Math.floor(Math.random() * 3) + (G.livelihood.employment > 70 ? 1 : 0);
  for (var i = 0; i < count; i++) {
    registerBusiness();
  }
  // 自动审批（80%通过率）
  G.registrations.filter(function(r) { return r.status === '待审批'; }).forEach(function(r) {
    if (Math.random() < 0.8) approveRegistration(r.id, true);
    else approveRegistration(r.id, false);
  });
}

function marketInspection() {
  // 市场监管：随机检查企业
  if (!G.businesses || G.businesses.length === 0) return;
  if (Math.random() < 0.15) {
    var b = G.businesses[Math.floor(Math.random()*G.businesses.length)];
    var issues = ['无证经营','偷税漏税','质量不合格','虚假宣传','环保不达标','劳动纠纷'];
    var issue = issues[Math.floor(Math.random()*issues.length)];
    var fine = Math.floor(Math.random()*50) + 5;
    b.financialHealth = Math.max(0, b.financialHealth - 10);
    G.finance += fine;
    addLog('工商', b.name + '因' + issue + '被查处，罚款' + fine + '万元', 'warn');
  }
}

];

function createPolicy(templateId) {
  var t = POLICY_TEMPLATES.find(function(x) { return x.id === templateId; });
  if (!t) return null;
  return {
    id: 'POL' + Date.now(),
    templateId: t.id,
    name: t.name,
    desc: t.desc,
    cost: t.cost,
    effect: t.effect,
    status: '起草', // 起草/申报/审批/实施/评估
    progress: 0,
    duration: 6 + Math.floor(Math.random()*6),
    submitDate: null,
    approveDate: null
  };
}

function submitPolicy(policyId) {
  var p = G.policies.find(function(x) { return x.id === policyId; });
  if (!p || p.status !== '起草') return false;
  p.status = '申报';
  p.submitDate = G.year + '-' + G.month;
  addLog('政策', p.name + '已向上级申报', 'info');
  return true;
}

function updatePolicies() {
  if (!G.policies) G.policies = [];
  G.policies.forEach(function(p) {
    if (p.status === '申报') {
      // 上级审批（70%通过率）
      if (Math.random() < 0.7) {
        p.status = '实施';
        p.approveDate = G.year + '-' + G.month;
        G.finance -= p.cost;
        addLog('政策', p.name + '获上级批准，开始实施', 'success');
      } else {
        p.status = '起草';
        addLog('政策', p.name + '被上级退回，需修改', 'warn');
      }
    }
    if (p.status === '实施') {
      p.progress += 100 / p.duration;
      // 政策效果逐步释放
      if (p.effect.gdp) G.gdp += G.gdp * p.effect.gdp / p.duration;
      if (p.effect.satisfaction) G.satisfaction = Math.min(1, G.satisfaction + p.effect.satisfaction / 100 / p.duration);
      if (p.effect.pollution) G.pollution = clamp(G.pollution + p.effect.pollution / p.duration, 0, 100);
      if (p.effect.population) G.population += Math.round(p.effect.population / p.duration);
      if (p.effect.education) G.educationIndex = Math.min(100, G.educationIndex + p.effect.education / p.duration);
      if (p.effect.medical) G.medicalIndex = Math.min(100, G.medicalIndex + p.effect.medical / p.duration);
      if (p.progress >= 100) {
        p.status = '评估';
        p.progress = 100;
        addLog('政策', p.name + '实施完成，进入效果评估阶段', 'info');
      }
    }
  });
  markPollutionDirty();
}

function usePower(action, targetId) {
  if (!G.power) G.power = { corruptionRisk: 0, grayIncome: 0, favors: 0, inspections: 0 };
  var actions = {
    '人事干预': { risk: 15, reward: 'loyalty', desc: '干预人事任免，培植亲信' },
    '项目倾斜': { risk: 20, reward: 'money', desc: '工程项目向特定企业倾斜' },
    '审批加速': { risk: 10, reward: 'favor', desc: '为企业审批开绿灯' },
    '执法宽松': { risk: 12, reward: 'favor', desc: '对违规企业网开一面' },
    '资金挪用': { risk: 30, reward: 'money', desc: '挪用专项资金' },
    '人情往来': { risk: 5, reward: 'network', desc: '婚丧嫁娶收受礼金' }
  };
  var a = actions[action];
  if (!a) return { success: false };
  G.power.corruptionRisk += a.risk;
  G.power.favors++;
  if (a.reward === 'money') {
    var amount = Math.floor(Math.random()*50) + 10;
    G.personal.deposit += amount;
    G.power.grayIncome += amount;
    addLog('权力', '通过' + action + '获得' + amount + '万元', 'warn');
  } else if (a.reward === 'loyalty') {
    if (targetId) {
      var c = G.cadres.find(function(x) { return x.id === targetId; });
      if (c) c.loyalty = Math.min(100, c.loyalty + 20);
    }
    addLog('权力', action + '：培植了政治力量', 'info');
  } else {
    G.personal.ability = Math.min(100, (G.personal.ability||0) + 2);
    addLog('权力', action + '：积累了人脉资源', 'info');
  }
  // 被查处风险
  if (Math.random() * 100 < G.power.corruptionRisk * 0.1) {
    G.power.inspections++;
    G.personal.corruptionRisk = Math.min(100, (G.personal.corruptionRisk||0) + 20);
    addLog('权力', '引起了纪检部门注意！廉政风险上升', 'danger');
    if (G.personal.corruptionRisk > 80 && Math.random() < 0.3) {
      G.gameOver = true;
      G.gameOverReason = '因严重违纪违法被查处，政治生命终结！';
      addLog('权力', '你被双规了！' + G.gameOverReason, 'danger');
    }
  }
  return { success: true };
}

var _triggeredHistoryEvents = {};

function checkHistoricalEvents() {
  if (!G.year) return;
  var year = G.year;
  if (_triggeredHistoryEvents[year]) return;
  var events = HISTORICAL_EVENTS.filter(function(e) { return e.year === year; });
  events.forEach(function(e) {
    _triggeredHistoryEvents[year] = true;
    try { e.effect(); } catch(err) { console.log('历史事件执行错误', err); }
  });
}

function selectAIStrategy(){
  if(AI_STATE.currentStrategy==='learning')return 'learning';
  var scores={};
  for(var sid in AI_STRATEGIES){
    if(sid==='learning')continue;
    var s=AI_STRATEGIES[sid];
    var score=0;
    if(G.gdp<30000)score+=s.weights.gdp*2;
    if(G.satisfaction<0.4)score+=s.weights.livelihood*3;
    if(G.pollution>50)score+=s.weights.environment*3;
    if((G.socialTension||0.2)>0.5)score+=s.weights.stability*3;
    if(G.educationIndex<30)score+=s.weights.innovation*2;
    if(G.rank<=1)score+=s.weights.gdp*1.5;
    if(G.rank>=4)score+=s.weights.innovation*2;
    scores[sid]=score;
  }
  var best=null,bestScore=-Infinity;
  for(var sid2 in scores){
    if(scores[sid2]>bestScore){bestScore=scores[sid2];best=sid2;}
  }
  if(Math.random()<0.2){
    var keys=Object.keys(scores);
    best=keys[Math.floor(Math.random()*keys.length)];
  }
  return best||'balanced';
}

// 执行AI决策
function executeAIAction(action) {
  if (!action || !action.type) return false;
  var log = function(msg) {
    addLog('AI', '[AI决策] ' + msg, 'info');
    AI_STATE.currentGameLog.push({time: G.year+'-'+G.month, action: action.type, detail: msg});
  };

  switch(action.type) {
    case 'advance_month':
      if (typeof advanceMonth === 'function') advanceMonth();
      log('推进一个月');
      return true;

    case 'build':
      var bt = action.building_type || 3;
      // 找一个空地建造
      var built = false;
      for (var y = 10; y < 40 && !built; y++) {
        for (var x = 10; x < 40 && !built; x++) {
          if (G.grid[y] && G.grid[y][x] === 0) {
            if (typeof buildTile === 'function') {
              buildTile(x, y, bt);
              built = true;
              log('建造建筑 type=' + bt + ' at (' + x + ',' + y + ')');
            }
          }
        }
      }
      if (!built) log('建造失败：无空地');
      return built;

    case 'policy':
      var pid = action.policy_id || 'livelihood';
      var p = createPolicy(pid);
      if (p) {
        if (!G.policies) G.policies = [];
        G.policies.push(p);
        submitPolicy(p.id);
        log('申报政策：' + p.name);
      }
      return true;

    case 'project':
      var pt = action.project_type || 0;
      var proj = createProject(pt);
      if (!G.projects) G.projects = [];
      G.projects.push(proj);
      bidForProject(proj.id);
      log('启动工程：' + proj.name);
      return true;

    case 'tax_adjust':
      if (G.policy) {
        G.policy.taxBusiness = action.tax_rate || 0.05;
        log('调整营业税率为' + (action.tax_rate*100).toFixed(1) + '%');
      }
      return true;

    case 'appoint_cadre':
      if (G.cadres && G.cadres.length > 0) {
        var c = G.cadres[Math.floor(Math.random()*G.cadres.length)];
        appointCadre(c.id, '发改委主任', c.rank + 1);
        log('任免干部：' + c.name);
      }
      return true;

    case 'use_power':
      usePower(action.power_action || '审批加速', null);
      log('行使权力：' + (action.power_action || '审批加速'));
      return true;

    case 'take_exam':
      if (G.personal.deposit >= 0.005 && G.personal.education !== getMaxEducationByYear(G.year)) {
        // AI自动参加考试，随机得分60-100
        var examScore = 60 + Math.floor(Math.random() * 41);
        G.personal.deposit -= 0.005;
        if (examScore >= 95) { G.personal.education='博士'; G.personal.ability=25; G.personal.salary=calculateSalary(G.rank,G.year)*1.5/10000; }
        else if (examScore >= 85) { G.personal.education='硕士'; G.personal.ability=15; G.personal.salary=calculateSalary(G.rank,G.year)*1.3/10000; }
        else if (examScore >= 75) { G.personal.education='本科'; G.personal.ability=5; G.personal.salary=calculateSalary(G.rank,G.year)*1.1/10000; }
        else if (examScore >= 60) { G.personal.education='大专'; G.personal.ability=0; G.personal.salary=calculateSalary(G.rank,G.year)/10000; }
        log('参加学历考试，得分'+examScore+'，获得'+G.personal.education+'学历');
        return true;
      } else {
        log('存款不足，无法参加学历考试');
        return false;
      }

    case 'apply_promotion':
      if (G.rank < G.rankNames.length - 1 && (G.promotionCooldown || 0) === 0) {
        var req = getPromotionRequirements(G.rank);
        var termYears = Math.floor(G.termMonths/12);
        var eduLevel = {'大专':0,'本科':1,'硕士':2,'博士':3};
        var currentEdu = eduLevel[G.personal.education] || 0;
        var requiredEdu = eduLevel[req.edu] || 0;
        var canApply = termYears >= req.term && G.gdp >= req.gdp && G.population >= req.pop && G.superiorEval*100 >= req.eval && currentEdu >= requiredEdu;
        if (canApply) {
          submitPromotionApplication();
          log('提交晋升申请');
        } else {
          log('晋升条件未满足，继续努力');
        }
        return true;
      } else {
        log('晋升冷却中或已达最高级');
        return false;
      }

    case 'buy_house':
      initPersonalNeeds();
      if (tryBuyHouse()) {
        log('产生购房想法并购买住房');
        return true;
      } else if (G.personal.needs.housing >= 70) {
        log('有购房想法但存款不足（需首付30%），继续攒钱');
        return true;
      } else {
        log('暂无购房想法（需求强度'+Math.round(G.personal.needs.housing)+'%）');
        return false;
      }

    case 'buy_car':
      initPersonalNeeds();
      if (tryBuyCar()) {
        log('产生购车想法并购买车辆');
        return true;
      } else if (G.personal.needs.vehicle >= 60) {
        log('有购车想法但存款不足，继续攒钱');
        return true;
      } else {
        log('暂无购车想法（需求强度'+Math.round(G.personal.needs.vehicle)+'%）');
        return false;
      }

    case 'marry':
      initPersonalNeeds();
      if (tryMarry()) {
        log('产生结婚想法并结婚');
        return true;
      } else {
        log('暂无结婚想法（需求强度'+Math.round(G.personal.needs.marriage)+'%）');
        return false;
      }

    case 'have_child':
      initPersonalNeeds();
      if (tryHaveChild()) {
        log('生育孩子');
        return true;
      } else {
        log('暂无生育想法');
        return false;
      }

    case 'buy_stock':
      if (G.year >= 1991 && G.personal.deposit >= 0.05 && G.stocks && G.stocks.length > 0) {
        var stock = G.stocks[Math.floor(Math.random()*G.stocks.length)];
        var shares = 100;
        var cost = stock.price * shares / 10000;
        if (G.personal.deposit >= cost) {
          G.personal.deposit -= cost;
          if (!G.personal.stocks) G.personal.stocks = [];
          G.personal.stocks.push({code:stock.code,shares:shares,cost:stock.price});
          log('买入'+stock.name+' '+shares+'股，支出'+(cost*10000).toFixed(0)+'元');
          return true;
        }
      }
      log('不适合买股票（年代/存款/市场）');
      return false;

    case 'handle_government':
      // 随机处理一项政务
      var govActions = [];
      if (G.registrations && G.registrations.filter(function(r){return r.status==='待审批';}).length > 0) {
        govActions.push('审批企业');
      }
      if (G.cadres && G.cadres.length > 0) {
        govActions.push('考核干部');
      }
      if (G.projects && G.projects.filter(function(p){return p.status==='招标中';}).length > 0) {
        govActions.push('工程招投标');
      }
      if (govActions.length > 0) {
        var action = govActions[Math.floor(Math.random()*govActions.length)];
        if (action === '审批企业') {
          var pending = G.registrations.filter(function(r){return r.status==='待审批';});
          if (pending.length > 0) {
            var reg = pending[0];
            if (Math.random() < 0.8) {
              reg.status = '已批准';
              reg.approved = true;
              log('审批通过企业：'+reg.name);
            } else {
              reg.status = '已驳回';
              log('驳回企业：'+reg.name);
            }
          }
        } else if (action === '考核干部') {
          var cadre = G.cadres[Math.floor(Math.random()*G.cadres.length)];
          var basePerf = typeof cadre.performance === 'number' ? cadre.performance : (cadre.ability||50);
          cadre.performance = Math.min(100, Math.max(0, basePerf + Math.floor(Math.random()*20)-5));
          log('考核干部：'+cadre.name+'，评分'+Math.round(cadre.performance));
        } else if (action === '工程招投标') {
          var bidding = G.projects.filter(function(p){return p.status==='招标中';});
          if (bidding.length > 0) {
            bidding[0].status = '建设中';
            log('完成招投标：'+bidding[0].name);
          }
        }
        return true;
      } else {
        log('暂无待处理政务');
        return false;
      }

    case 'handle_event':
      if (G.eventState && G.eventState.activeEvents && G.eventState.activeEvents.length > 0) {
        var evt = G.eventState.activeEvents[0];
        if (evt.choices && evt.choices.length > 0) {
          var choice = evt.choices[0];
          if (choice.effect) choice.effect();
          G.eventState.activeEvents.shift();
          log('处理突发事件：'+evt.name+' - '+choice.text);
          return true;
        }
      }
      log('暂无突发事件');
      return false;

    case 'demolish':
      // 拆除污染建筑
      for (var k in G.buildingData) {
        var coords = k.split(',').map(Number);
        var t = G.grid[coords[1]] ? G.grid[coords[1]][coords[0]] : 0;
        if (t === 5 || t === 8) { // 工厂或电厂
          if (typeof demolishTile === 'function') {
            demolishTile(coords[0], coords[1]);
            log('拆除污染建筑 at (' + coords[0] + ',' + coords[1] + ')');
            return true;
          }
        }
      }
      log('拆除失败：无目标建筑');
      return false;

    default:
      log('未知动作类型：' + action.type);
      return false;
  }
}

// 调用DeepSeek获取决策
function getAIDecision(callback) {
  var key = AI_STATE.apiKey || loadDeepSeekKey();
  if (!key) {
    callback({ error: '未设置API Key' });
    return;
  }
  AI_STATE.thinking = true;
  var prompt = buildAIPrompt();

  var aiTimeout = setTimeout(function(){
    AI_STATE.thinking = false;
    callback({ error: 'API请求超时（30秒），自动推进' });
    if (typeof advanceMonth === 'function') { try{advanceMonth();}catch(e){} }
  }, 30000);
  fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [
        { role: 'system', content: '你是一位极具政治智慧和战略眼光的中国基层干部，深耕基层治理数十年。你不仅懂经济、懂民生、懂政治，更懂得权衡利弊、把握时机、运筹帷幄。你的决策风格：\n1. 深度思考：不急于行动，先分析局势、诊断问题、预判风险\n2. 战略思维：有短期应急、中期发展、长期布局的层次感\n3. 务实平衡：在发展与稳定、经济与民生、政绩与风险之间找平衡点\n4. 政治敏锐：懂得上级意图、群众情绪、舆论导向\n5. 持续学习：从过往决策中总结经验，不断优化策略\n你要像一位真正的治理者那样思考，而不是机械地执行动作。' },
        { role: 'user', content: prompt }
      ],
      max_tokens: 3000,
      temperature: 0.8
    })
  }).then(function(res) { return res.json(); })
  .then(function(data) {
    clearTimeout(aiTimeout);
    AI_STATE.thinking = false;
    if (data.choices && data.choices[0]) {
      var content = data.choices[0].message.content;
      // 提取JSON
      var jsonMatch = content.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        try {
          var decision = JSON.parse(jsonMatch[0]);
          // 保存思考过程到记忆
          if (decision.thinking) {
            AI_STATE.lastThinking = decision.thinking;
            var memEntry = G.year + '年' + G.month + '月: ' + (decision.thinking.diagnosis || '').substring(0, 50) + ' | ' + (decision.thinking.strategy || '').substring(0, 30);
            AI_STATE.memory.push(memEntry);
            if (AI_STATE.memory.length > 20) AI_STATE.memory.shift();
          }
          AI_STATE.decisionCount++;
          if (AI_STATE.decisionCount % 10 === 0 && typeof doAIReflection === 'function') {
            doAIReflection();
          }
          callback({ decision: decision, raw: content });
        } catch(e) {
          callback({ error: 'JSON解析失败: ' + e.message, raw: content });
        }
      } else {
        callback({ error: '未找到JSON', raw: content });
      }
    } else {
      callback({ error: data.error ? data.error.message : 'API返回异常', raw: JSON.stringify(data) });
    }
  }).catch(function(err) {
    clearTimeout(aiTimeout);
    AI_STATE.thinking = false;
    callback({ error: '网络错误: ' + err.message });
  });
}

// AI单步决策
function aiStep() {
  if (!AI_STATE.running || AI_STATE.paused) return;
  // 每12轮选择一次策略
  if(!AI_STATE.decisionCount||AI_STATE.decisionCount%12===0){
    try{
      var newStrategy=selectAIStrategy();
      if(newStrategy!==AI_STATE.currentStrategy){
        AI_STATE.currentStrategy=newStrategy;
        addLog('AI','AI策略切换为：'+(AI_STRATEGIES[newStrategy]?AI_STRATEGIES[newStrategy].name:newStrategy),'info');
      }
    }catch(e){}
  }
  if (G.gameOver) {
    finishAIGame();
    return;
  }
  if (AI_STATE.thinking) return;

  // AI自动处理突发事件弹窗（选择最优方案）
  var overlay = document.getElementById('modalOverlay');
  if (overlay && overlay.classList.contains('active')) {
    var modalTitle = document.getElementById('modalTitle') ? document.getElementById('modalTitle').textContent : '';
    // 突发事件弹窗
    if (modalTitle.indexOf('突发事件') !== -1 && G.currentEvent && G.currentEvent.choices) {
      var bestIdx = 0;
      var bestScore = -999;
      // AI根据当前状态评分选择最优方案
      for (var ei = 0; ei < G.currentEvent.choices.length; ei++) {
        var c = G.currentEvent.choices[ei];
        var score = 50; // 基础分
        var desc = c.desc;
        // 财政紧张时偏好省钱方案
        if (G.finance < 5000) {
          if (desc.indexOf('不花钱') !== -1 || desc.indexOf('不额外支出') !== -1 || desc.indexOf('0万') !== -1) score += 30;
          if (desc.indexOf('3000万') !== -1) score -= 10;
          if (desc.indexOf('5000万') !== -1 || desc.indexOf('8000万') !== -1) score -= 20;
        } else {
          // 财政充足时偏好效果好的方案
          if (desc.indexOf('全力') !== -1 || desc.indexOf('最好') !== -1 || desc.indexOf('亲自') !== -1) score += 20;
        }
        // 满意度低时偏好提升满意度的方案
        if (G.satisfaction < 0.4) {
          if (desc.indexOf('满意度+') !== -1) score += 15;
        }
        // 偏好不增加廉政风险的方案
        if (desc.indexOf('廉政风险') !== -1) score -= 25;
        // 偏好上级评价提升的方案
        if (G.superiorEval < 0.5 && desc.indexOf('评价+') !== -1) score += 10;
        if (score > bestScore) { bestScore = score; bestIdx = ei; }
      }
      addLog('AI', 'AI应对突发事件「' + G.currentEvent.name + '」：选择「' + G.currentEvent.choices[bestIdx].text + '」', 'info');
      handleEventChoice(bestIdx);
      scheduleNextAIStep();
      return;
    }
    // 其他弹窗（晋升/提示/考试结果等）自动点第一个按钮
    if (modalTitle.indexOf('AI 自主治理控制台') === -1 && modalTitle.indexOf('AI 20局') === -1 && modalTitle.indexOf('DeepSeek AI 社会分析') === -1 && modalTitle.indexOf('突发事件') === -1) {
      var footerBtns = document.querySelectorAll('#modalFooter button');
      if (footerBtns.length > 0) {
        var primaryBtn = document.querySelector('#modalFooter button.btn.primary');
        if (primaryBtn) primaryBtn.click();
        else footerBtns[0].click();
        addLog('AI', '自动处理弹窗：' + modalTitle, 'info');
        scheduleNextAIStep();
        return;
      }
    }
  }

  getAIDecision(function(result) {
    if (result.error) {
      addLog('AI', 'AI决策失败: ' + result.error, 'warn');
      // 失败时自动推进一个月
      if (typeof advanceMonth === 'function') advanceMonth();
      scheduleNextAIStep();
      return;
    }
    var decision = result.decision;
    if (decision.analysis) {
      addLog('AI', 'AI分析: ' + decision.analysis.substring(0, 100), 'info');
    }
    if (decision.actions && decision.actions.length > 0) {
      var execCount = 0;
      var hasAdvance = false;
      decision.actions.forEach(function(a) {
        try {
          if (a && a.type === 'advance_month') hasAdvance = true;
          if (executeAIAction(a)) execCount++;
        } catch(e) {
          console.log('AI action error:', e);
          addLog('AI', '动作执行异常: ' + e.message, 'warn');
        }
      });
      // 如果AI没有推进时间，自动推进一个月
      if (!hasAdvance) {
        try { if (typeof advanceMonth === 'function') advanceMonth(); } catch(e) {}
      }
      AI_STATE.totalDecisions++;
      // 刷新AI控制台UI
      if (typeof updateAIConsoleUI === 'function') updateAIConsoleUI();
    } else {
      addLog('AI', 'AI未返回有效动作，推进一个月', 'info');
      if (typeof advanceMonth === 'function') {
        try { advanceMonth(); } catch(e) { console.log('advanceMonth error:', e); }
      }
      AI_STATE.totalDecisions++;
      if (typeof updateAIConsoleUI === 'function') updateAIConsoleUI();
    }
    scheduleNextAIStep();
  });
}

function scheduleNextAIStep() {
  if (!AI_STATE.running) return;
  var delay = AI_STATE.speed === 'fast' ? 500 : AI_STATE.speed === 'slow' ? 5000 : 2000;
  setTimeout(aiStep, delay);
}

// 开始AI游戏
function startAIGame() {
  AI_STATE.running = true;
  AI_STATE.paused = false;
  AI_STATE.currentGameLog = [];
  addLog('AI', '=== AI自主治理模式启动 ===', 'success');
  if (typeof updateAIConsoleUI === 'function') updateAIConsoleUI();
  aiStep();
}

// 暂停/继续
function toggleAIPause() {
  AI_STATE.paused = !AI_STATE.paused;
  if (!AI_STATE.paused) aiStep();
  addLog('AI', AI_STATE.paused ? 'AI已暂停' : 'AI已继续', 'info');
}

// 停止AI
function stopAI() {
  AI_STATE.running = false;
  AI_STATE.paused = false;
  addLog('AI', 'AI自主治理已停止', 'warn');
}

function updateAIConsoleUI() {
  try {
    var statusEl = document.getElementById('ai-status');
    var countEl = document.getElementById('ai-decision-count');
    var gameEl = document.getElementById('ai-game-count');
    if (statusEl) {
      if (AI_STATE.thinking) statusEl.textContent = 'AI思考中...';
      else if (AI_STATE.paused) statusEl.textContent = '已暂停';
      else if (AI_STATE.running) statusEl.textContent = '运行中';
      else statusEl.textContent = '已停止';
    }
    if (countEl) countEl.textContent = AI_STATE.totalDecisions;
    if (gameEl) gameEl.textContent = AI_STATE.gameCount + ' / ' + AI_STATE.maxGames;
  } catch(e) {}
}

// 完成一局游戏
function finishAIGame() {
  AI_STATE.gameCount++;
  var result = {
    game: AI_STATE.gameCount,
    reason: G.gameOverReason || '任期结束',
    finalRank: G.rankNames[G.rank],
    finalYear: G.year,
    finalGDP: G.gdp,
    finalPopulation: G.population,
    finalSatisfaction: G.satisfaction,
    finalEval: G.superiorEval,
    decisions: AI_STATE.currentGameLog.length,
    duration: G.termMonths + '个月'
  };
  AI_STATE.allGameResults.push(result);
  addLog('AI', '=== 第' + AI_STATE.gameCount + '局结束: ' + result.reason + ' ===', 'success');
  addLog('AI', '最终职务: ' + result.finalRank + ', 任期: ' + result.duration + ', GDP: ' + (result.finalGDP/10000).toFixed(1) + '亿', 'info');

  if (AI_STATE.gameCount >= AI_STATE.maxGames) {
    finishAllAIGames();
  } else {
    // 自动开始下一局
    addLog('AI', '3秒后开始第' + (AI_STATE.gameCount+1) + '局...', 'info');
    setTimeout(function() {
      if (typeof initGame === 'function') {
        initGame('AI干部', 'AI实验市', '普通');
        AI_STATE.currentGameLog = [];
        aiStep();
      }
    }, 3000);
  }
}

// 完成所有游戏，生成汇总
function finishAllAIGames() {
  AI_STATE.running = false;
  addLog('AI', '========== 20局游戏全部完成 ==========', 'success');

  // 统计汇总
  var results = AI_STATE.allGameResults;
  var avgGDP = results.reduce(function(s,r){return s+r.finalGDP;},0) / results.length;
  var avgPop = results.reduce(function(s,r){return s+r.finalPopulation;},0) / results.length;
  var avgSat = results.reduce(function(s,r){return s+r.finalSatisfaction;},0) / results.length;
  var avgEval = results.reduce(function(s,r){return s+r.finalEval;},0) / results.length;
  var rankCount = {};
  results.forEach(function(r){ rankCount[r.finalRank] = (rankCount[r.finalRank]||0)+1; });

  var summary = {
    totalGames: results.length,
    totalDecisions: AI_STATE.totalDecisions,
    averageGDP: avgGDP,
    averagePopulation: avgPop,
    averageSatisfaction: avgSat,
    averageEvaluation: avgEval,
    rankDistribution: rankCount,
    results: results
  };

  AI_STATE.finalSummary = summary;

  // 保存到localStorage
  try {
    localStorage.setItem('ai_game_summary', JSON.stringify(summary));
  } catch(e) {}

  // 调用AI做最终分析
  requestAIFinalAnalysis(summary);
}

  html += '<div style="font-size:14px;font-weight:700;margin-bottom:8px;">职务分布</div>';
  for (var rank in summary.rankDistribution) {
    var pct = (summary.rankDistribution[rank] / summary.totalGames * 100).toFixed(0);
    html += '<div style="display:flex;align-items:center;margin-bottom:4px;font-size:12px;">';
    html += '<span style="width:120px;">' + rank + '</span>';
    html += '<div style="flex:1;height:14px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:0 8px;">';
    html += '<div style="width:' + pct + '%;height:100%;background:#007aff;"></div></div>';
    html += '<span>' + summary.rankDistribution[rank] + '局 (' + pct + '%)</span></div>';
  }
  html += '</div>';

  if (analysis) {
    html += '<div style="background:#fff;border-radius:10px;padding:12px;">';
    html += '<div style="font-size:14px;font-weight:700;margin-bottom:8px;color:#007aff;">AI 深度分析报告</div>';
    html += '<div style="font-size:12px;line-height:1.8;color:#374151;white-space:pre-wrap;">' + analysis.replace(/</g,'&lt;') + '</div>';
    html += '</div>';
  }
  html += '</div>';

  showModal('AI 20局游戏分析报告', html, [{text:'关闭',class:'',action:closeModal}]);
}
