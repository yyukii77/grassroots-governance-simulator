function generateExamQuestions(){var qs=[];qs.push({q:'我国的根本政治制度是？',opts:['人民代表大会制度','中国共产党领导的多党合作制','民族区域自治制度','基层群众自治制度'],ans:0});qs.push({q:'《宪法》规定，中华人民共和国的一切权力属于？',opts:['人民','中国共产党','全国人大','国务院'],ans:0});qs.push({q:'社会主义市场经济体制中，市场在资源配置中起？',opts:['决定性作用','基础性作用','辅助性作用','主导性作用'],ans:0});qs.push({q:'我国耕地红线约为？',opts:['13%','18%','20%','25%'],ans:0});qs.push({q:'以下哪个是我国的货币政策工具？',opts:['存款准备金率','财政支出','税收政策','国债发行'],ans:0});qs.push({q:'填入最恰当的一项：科技创新是____发展的核心驱动力。',opts:['经济','社会','文化','生态'],ans:0});qs.push({q:'下列词语中，没有错别字的是？',opts:['呕心沥血','直接了当','金榜提名','走头无路'],ans:0});qs.push({q:'“不积跬步，无以至千里”强调的是？',opts:['量变引起质变','质变是量变的前提','事物是发展的','矛盾是普遍的'],ans:0});qs.push({q:'某城市GDP年均增长8%，5年后GDP约为原来的？',opts:['1.47倍','1.40倍','1.50倍','1.60倍'],ans:0});qs.push({q:'某项目投资1亿元，年回报率6%，5年后本利和约为？',opts:['1.34亿','1.30亿','1.38亿','1.42亿'],ans:0});qs.push({q:'所有公务员都是党员，有些党员是干部，因此？',opts:['有些公务员是干部','所有干部是公务员','有些干部是公务员','以上都不是'],ans:2});qs.push({q:'与“书籍：阅读”关系最相似的是？',opts:['电影：观看','食物：品尝','音乐：欣赏','以上都是'],ans:3});qs.push({q:'如果“GDP增长→就业增加”，那么“就业不增加”意味着？',opts:['GDP不增长','GDP增长','GDP可能增长','无法判断'],ans:2});qs.push({q:'某市2023年GDP为800亿，2024年为920亿，增长率为？',opts:['15%','12%','10%','18%'],ans:0});qs.push({q:'某企业营收从5亿增长到7亿，增长了多少？',opts:['40%','30%','20%','50%'],ans:0});return qs;}
function openExamModal(){if(G.personal.deposit<0.5){showModal('学历考试','<div style="color:#e74c5e;">存款不足5000元，无法参加考试。</div>',[{text:'关闭',class:'',action:closeModal}]);return;}examQuestions=generateExamQuestions();examAnswers=new Array(examQuestions.length).fill(-1);examCurrent=0;showModal('学历考试','<div id="examContainer"></div>',[{text:'提交考试',class:'primary',action:submitExam}]);renderExamQuestion();}
function renderExamQuestion(){var container=document.getElementById('examContainer');if(!container)return;var q=examQuestions[examCurrent];var total=examQuestions.length;var html='<div style="margin-bottom:12px;color:#8e8e93;font-size:14px;font-weight:500;">第 '+(examCurrent+1)+'/'+total+' 题</div>';html+='<div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #e5e5ea;"><div style="font-size:16px;font-weight:600;color:#1c1c1e;line-height:1.5;margin-bottom:14px;">'+q.q+'</div><div style="display:flex;flex-direction:column;gap:8px;">';q.opts.forEach(function(opt,idx){var checked=examAnswers[examCurrent]===idx;var bgColor=checked?'#007aff':'#f2f2f7';var textColor=checked?'#fff':'#1c1c1e';var borderColor=checked?'#007aff':'#e5e5ea';html+='<div onclick="examAnswers['+examCurrent+']='+idx+';renderExamQuestion();" style="padding:12px 16px;border-radius:10px;background:'+bgColor+';color:'+textColor+';border:1px solid '+borderColor+';font-size:14px;cursor:pointer;transition:all 0.2s;">'+String.fromCharCode(65+idx)+'. '+opt+'</div>';});html+='</div></div>';html+='<div style="display:flex;gap:10px;margin-bottom:12px;"><button onclick="examPrev()" '+(examCurrent===0?'disabled style="flex:1;padding:12px;background:#f2f2f7;color:#8e8e93;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:not-allowed;"':'style="flex:1;padding:12px;background:#f2f2f7;color:#007aff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;"')+'>上一题</button><button onclick="examNext()" '+(examCurrent>=total-1?'disabled style="flex:1;padding:12px;background:#f2f2f7;color:#8e8e93;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:not-allowed;"':'style="flex:1;padding:12px;background:#007aff;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;"')+'>下一题</button></div>';html+='<div style="height:6px;background:#e5e5ea;border-radius:3px;overflow:hidden;"><div style="height:100%;background:#007aff;border-radius:3px;transition:width 0.3s;width:'+((examCurrent+1)/total*100)+'%;"></div></div>';container.innerHTML=html;}
function examPrev(){if(examCurrent>0){examCurrent--;renderExamQuestion();}}
function examNext(){if(examCurrent<examQuestions.length-1){examCurrent++;renderExamQuestion();}}
function submitExam(){var unanswered=examAnswers.some(function(a){return a===-1;});if(unanswered){showModal('提示','还有题目未作答，请完成所有题目。',[{text:'继续答题',class:'',action:closeModal}]);return;}var score=0;examQuestions.forEach(function(q,i){if(examAnswers[i]===q.ans)score++;});var total=examQuestions.length;var pct=Math.round((score/total)*100);G.personal.deposit-=0.5;var edu=G.personal.education;var ability=G.personal.ability;var salary=G.personal.salary;var passed=false;if(pct>=95){edu='博士';ability=25;salary=1.8;passed=true;}else if(pct>=85){edu='硕士';ability=15;salary=1.2;passed=true;}else if(pct>=75){edu='本科';ability=5;salary=0.8;passed=true;}else if(pct>=60){edu='大专';ability=0;salary=0.6;passed=true;}else{passed=false;}if(passed&&edu!==G.personal.education){G.personal.education=edu;G.personal.ability=ability;G.personal.salary=salary;G.personal.eduScore=pct;addLog('考试','🎓 通过学历考试，获得'+edu+'学历！','success');showModal('考试结果','<div class="exam-result"><div class="score">'+pct+'分</div><div class="grade"> 获得 '+edu+' 学历！</div><div style="margin-top:8px;color:rgba(255,255,255,0.6);">执政能力 +'+ability+'，月工资 '+fmtMoney(salary)+'</div></div>',[{text:'太好了',class:'primary',action:closeModal}]);}else if(passed){showModal('考试结果','<div class="exam-result"><div class="score">'+pct+'分</div><div class="grade">已通过，当前学历 '+G.personal.education+'</div></div>',[{text:'知道了',class:'',action:closeModal}]);}else{showModal('考试结果','<div class="exam-result"><div class="score" style="color:#e74c5e;">'+pct+'分</div><div class="grade">未通过，3个月后可重考</div><div style="margin-top:8px;color:rgba(255,255,255,0.6);">需要60分以上</div></div>',[{text:'继续努力',class:'',action:closeModal}]);}renderAll();}

/></svg>'};var html='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">';items.forEach(function(item){var icon=catIcons[item.cat]||'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>';html+='<div style="background:#fff;border:1px solid #e5e5ea;border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.transform=\'scale(1.03)\';this.style.boxShadow=\'0 4px 12px rgba(0,0,0,0.1)\';" onmouseout="this.style.transform=\'scale(1)\';this.style.boxShadow=\'none\';" onclick="doConsume(\''+item.name+'\','+item.price+')"><div style="margin-bottom:6px;">'+icon+'</div><div style="font-weight:600;font-size:13px;color:#1c1c1e;">'+item.name+'</div><div style="color:#007aff;font-size:12px;font-weight:500;margin-top:2px;">'+fmtYuan(item.price)+'</div><div style="font-size:10px;color:#8e8e93;margin-top:2px;">'+item.cat+'</div></div>';});html+='</div>';showModal('个人消费',html,[{text:'关闭',class:'',action:closeModal}]);}
function doConsume(name,price){if(G.personal.deposit<price){showModal('提示','存款不足，需要'+fmtYuan(price),[{text:'知道了',class:'',action:closeModal}]);return;}G.personal.deposit-=price;G.personal.assets.push({type:'消费',name:name,value:price,purchased:G.year+'-'+G.month+'-'+G.day});G.personal.consumeLog.push({name:name,price:price,date:G.year+'-'+G.month+'-'+G.day});if(price>100){G.personal.corruptionRisk=Math.min(100,G.personal.corruptionRisk+2);}if(price>200){G.personal.corruptionRisk=Math.min(100,G.personal.corruptionRisk+5);}addLog('消费','消费 '+name+'，花费'+fmtMoney(price),'info');closeModal();renderAll();showModal('消费成功','已购买 '+name+'，花费'+fmtMoney(price),[{text:'好的',class:'',action:closeModal}]);}

function initStocks(){G.stocks=STOCK_LIST.map(function(s){var isCheap=parseInt(s.code)>=600016;return{code:s.code,name:s.name,industry:s.industry,price:isCheap?rand(3,25):rand(8,150),change:0,changePct:0,prevClose:0,history:[]};});G.stockPrices={};G.stocks.forEach(function(s){G.stockPrices[s.code]=s.price;G.stockHistory[s.code]=[];var initChangePct=(Math.random()-0.5)*4;s.prevClose=s.price;s.change=s.price*initChangePct/100;s.changePct=initChangePct;});G.personal.stocks=[];}
function generateHistoryKlines(){var codes=STOCK_LIST.map(function(s){return s.code;});codes.forEach(function(code){var hist=[];var price=rand(8,150);var base=price;for(var i=0;i<480;i++){var change=(Math.random()-0.48)*0.04;price=price*(1+change);price=Math.max(2,price);var open=price*(1+(Math.random()-0.5)*0.02);var close=price;var high=Math.max(open,close)*(1+Math.random()*0.015);var low=Math.min(open,close)*(1-Math.random()*0.015);var vol=Math.floor(rand(100,5000));hist.push({open:open,close:close,high:high,low:low,volume:vol,date:i});base=price;}G.stockHistory[code]=hist;G.stockPrices[code]=price;var stk=G.stocks.find(function(s){return s.code===code;});if(stk)stk.price=price;});}
function closeDailyKline(){if(!G.stocks)return;G.stocks.forEach(function(stk){var code=stk.code;var price=G.stockPrices[code]||stk.price;var hist=G.stockHistory[code]||[];var open=hist.length>0?hist[hist.length-1].close:price;var close=price;var high=Math.max(open,close)*(1+Math.random()*0.01);var low=Math.min(open,close)*(1-Math.random()*0.01);var volume=Math.floor(rand(100,5000));hist.push({open:open,close:close,high:high,low:low,volume:volume,date:hist.length});G.stockHistory[code]=hist;});}
function updateStockPrices(){var hour=G.hour;var dayOfWeek=getDayOfWeek(G.year,G.month,G.day);var isTrading=(dayOfWeek>=1&&dayOfWeek<=5&&hour>=9&&hour<16);if(!isTrading)return;if(typeof marketTrend==='undefined')var marketTrend=0;if(G.hour%100===0){marketTrend=(Math.random()-0.5)*0.8;}G.stocks.forEach(function(stk){var prevPrice=stk.price;var stockBeta=(stk.code.charCodeAt(5)-48)/10;var changePct=(Math.random()-0.5)*0.03+marketTrend*0.01*stockBeta;changePct=Math.max(-0.10,Math.min(0.10,changePct));var newPrice=stk.price*(1+changePct);newPrice=Math.max(2,newPrice);stk.price=newPrice;stk.prevClose=prevPrice;stk.change=newPrice-prevPrice;stk.changePct=(newPrice-prevPrice)/prevPrice*100;G.stockPrices[stk.code]=newPrice;if(!G.stockHistory[stk.code])G.stockHistory[stk.code]=[];var hist=G.stockHistory[stk.code];if(hist.length===0||hist[hist.length-1].date!==G.day){hist.push({open:newPrice,close:newPrice,high:newPrice,low:newPrice,volume:Math.floor(rand(100,5000)),date:G.day,year:G.year,month:G.month});}else{var last=hist[hist.length-1];last.close=newPrice;last.high=Math.max(last.high,newPrice);last.low=Math.min(last.low,newPrice);last.volume+=Math.floor(rand(50,1000));}});}
function getDayOfWeek(year,month,day){var d=new Date(year,month-1,day);return d.getDay();}
// 统一股票交易函数（修复版）
function tradeStock(action){var code=currentStockCode;var codeInput=document.getElementById('tradeCode');if(!code&&codeInput){code=codeInput.value.trim();}if(!code){showModal('提示','请先选择一只股票',[{text:'知道了',class:'',action:closeModal}]);return;}var sharesInput=document.getElementById('tradeShares');if(!sharesInput){showModal('提示','交易界面未初始化，请重新打开',[{text:'知道了',class:'',action:closeModal}]);return;}var shares=parseInt(sharesInput.value);if(!shares||shares<=0){showModal('提示','请输入正确的股数',[{text:'知道了',class:'',action:closeModal}]);return;}var stk=G.stocks.find(function(s){return s.code===code;});if(!stk){stk=G.stocks.find(function(s){return s.name.includes(code);});}if(!stk){showModal('提示','未找到该股票（代码：'+code+'）',[{text:'知道了',class:'',action:closeModal}]);return;}currentStockCode=stk.code;var price=stk.price||0;var totalYuan=price*shares;var totalWan=totalYuan/10000;var personal=G.personal;if(!personal.stocks)personal.stocks=[];if(action==='buy'){if(personal.deposit<totalWan){showModal('提示','存款不足，需要 '+fmtYuan(totalYuan)+'，当前存款 '+fmtYuan(personal.deposit),[{text:'知道了',class:'',action:closeModal}]);return;}personal.deposit-=totalWan;var holding=personal.stocks.find(function(s){return s.code===stk.code;});if(holding){holding.shares+=shares;holding.cost+=totalWan;}else{personal.stocks.push({code:stk.code,name:stk.name,shares:shares,cost:totalWan});}addLog('股票','买入 '+stk.name+' '+shares+'股，成交价 '+price.toFixed(2)+'元，花费 '+fmtYuan(totalYuan),'success');}else if(action==='sell'){var holding=personal.stocks.find(function(s){return s.code===stk.code;});if(!holding||holding.shares<shares){showModal('提示','持仓不足，当前持有 '+(holding?holding.shares:0)+' 股',[{text:'知道了',class:'',action:closeModal}]);return;}var costRatio=shares/holding.shares;holding.cost-=holding.cost*costRatio;holding.shares-=shares;personal.deposit+=totalWan;if(holding.shares<=0){personal.stocks=personal.stocks.filter(function(s){return s.code!==stk.code;});}addLog('股票','卖出 '+stk.name+' '+shares+'股，成交价 '+price.toFixed(2)+'元，收入 '+fmtYuan(totalYuan),'info');}if(typeof updateHoldingPanel==='function')updateHoldingPanel();if(typeof renderAll==='function')renderAll();if(document.getElementById('modalOverlay').classList.contains('active')){var isBankStockTab=document.querySelector('#modalBody [data-stock-code]')!==null;if(isBankStockTab){renderBankModal();}else{renderStockModal();}}}
function getMarketStatus(){var upStocks=G.stocks.filter(function(s){return (s.change||0)>=0;}).length;var downStocks=G.stocks.length-upStocks;var avgChange=G.stocks.reduce(function(s,stk){return s+(stk.changePct||0);},0)/G.stocks.length;return{up:upStocks,down:downStocks,avgChange:avgChange,trend:avgChange>=0?'上涨':'下跌'};}

var autoTimeEnabled=false;var autoTimeInterval=null;
function toggleAutoTime(){autoTimeEnabled=!autoTimeEnabled;var btn=document.getElementById('autoTimeBtn');if(autoTimeEnabled){if(btn){btn.classList.add('active');btn.textContent='自动中';}autoTimeInterval=setInterval(function(){advanceHour();},60000);}else{if(autoTimeInterval){clearInterval(autoTimeInterval);autoTimeInterval=null;}if(btn){btn.classList.remove('active');btn.textContent='自动';}}}
function advanceDay(){if(G.gameOver)return;G.day++;var daysInMonth=getDaysInMonth(G.year,G.month);if(G.day>daysInMonth){G.day=1;G.month++;G.termMonths++;if(G.month>12){G.month=1;G.year++;annualSettlement();}monthlySettlement();}closeDailyKline();dailyTick();autoSave();renderAll();}
function advanceMonth(){if(G.gameOver)return;G.month++;G.termMonths++;if(G.month>12){G.month=1;G.year++;annualSettlement();}G.day=1;monthlySettlement();closeDailyKline();dailyTick();autoSave();renderAll();}
function getDaysInMonth(year,month){return [31,28,31,30,31,30,31,31,30,31,30,31][month-1]||30;}
function dailyTick(){G.population+=Math.floor(rand(0,5));G.satisfaction+=(Math.random()-0.5)*0.001;G.satisfaction=clamp(G.satisfaction,0,1);G.superiorEval+=(Math.random()-0.5)*0.0005;G.superiorEval=clamp(G.superiorEval,0,1);G.finance-=5;if(G.finance<0)G.finance=0;}
function monthlySettlement(){updateBankSystem();if(G.citizens){var _sr=updateSocietyMonthly();}if(typeof updateGovernmentMonthly==='function'){try{updateGovernmentMonthly();}catch(e){console.log('政务更新错误',e);}if(_sr){addLog('社会','人口变动：出生'+_sr.births+'人，死亡'+_sr.deaths+'人，失业率'+(_sr.unemploymentRate*100).toFixed(1)+'%','info');}}var gdpAdd=0;var taxAdd=0;var popAdd=0;var pollAdd=0;for(var key in G.buildingData){var bd=G.buildingData[key];var coords=key.split(',').map(Number);var x=coords[0],y=coords[1];var type=G.grid[y]?.[x];if(!bd||!bd.level)continue;var lv=bd.level;var base=getBuildingBase(type);if(!base)continue;var mult=[1,1,1.8,2.8,4,5.5][lv]||1;gdpAdd+=(base.gdp||0)*mult/12;taxAdd+=(base.tax||0)*mult/12;popAdd+=(base.pop||0)*mult/12;pollAdd+=(base.pollution||0)*mult/12;}var farmGdp=G.farmland*500/12;gdpAdd+=farmGdp;G.gdp+=gdpAdd;G.finance+=taxAdd;G.population+=Math.floor(popAdd);G.pollution+=pollAdd*0.1;G.pollution=clamp(G.pollution,0,100);markPollutionDirty();var transfer=[1200,3000,6000,15000,30000,0][G.rank]||0;G.finance+=transfer/12;var staffCount=Math.floor(G.population*0.008);var salaryCost=staffCount*0.08/12;G.finance-=salaryCost;var threeGuarantee=G.finance*0.03;G.finance-=threeGuarantee;var policyCost=G.finance*0.02;G.finance-=policyCost;for(var i=G.debts.length-1;i>=0;i--){var d=G.debts[i];d.remaining-=d.monthly||(d.amount/d.term);if(d.remaining<=0){G.debts.splice(i,1);}else{G.finance-=(d.monthly||(d.amount/d.term));}}G.farmland=countFarmland();var ratio=getFarmlandRatio();if(ratio<0.13){G.violationMonths++;if(G.violationMonths===1){addLog('耕地','耕地比例降至13%以下，触发警告！','warn');G.superiorEval=Math.max(0,G.superiorEval-0.05);}else if(G.violationMonths>=3&&G.violationMonths<6){if(G.violationMonths%3===0){var fine=G.finance*0.05;G.finance-=fine;G.superiorEval=Math.max(0,G.superiorEval-0.1);G.satisfaction=Math.max(0,G.satisfaction-0.05);addLog('耕地','连续'+G.violationMonths+'月低于红线，罚款'+fmtMoney(fine),'danger');}}else if(G.violationMonths>=6&&G.violationMonths<12){if(G.violationMonths===6){G.superiorEval=Math.max(0,G.superiorEval-0.2);addLog('耕地','连续6月低于红线，考核不合格！','danger');}}else if(G.violationMonths>=12){G.gameOver=true;G.gameOverReason='耕地红线连续12月低于13%，被撤职查处！';addLog('耕地',''+G.gameOverReason,'danger');showGameOver();return;}}else{if(G.violationMonths>0){G.violationMonths=0;addLog('耕地','耕地已恢复至红线以上，违规记录清零','success');}}if(Math.random()<0.25)triggerRandomEvent();if(G.month%3===0)triggerInvestor();G.termYears+=1/12;
  // 发放工资
  var monthlySalary = G.personal.salary || 0.6;
  G.personal.deposit += monthlySalary;
  if(G.month === 1) addLog('个人','年度工资已发放，当前存款'+fmtYuan(G.personal.deposit),'info');
  var termLimit=G.rank===0?3:5;if(G.termYears>=termLimit){checkPromotion();}addLog('结算',''+G.year+'年'+G.month+'月结算完成，GDP +'+fmtNum(gdpAdd)+'，税收 +'+fmtNum(taxAdd)+'，工资 +'+fmtYuan(monthlySalary),'info');}
function annualSettlement(){
  G.age++;
  addLog('个人','您年满'+G.age+'岁','info');
  var gdpTarget=getRankTarget(G.rank+1);var popTarget=getPopTarget(G.rank+1);var satTarget=getSatTarget(G.rank+1);var evalTarget=getEvalTarget(G.rank+1);var score=0;if(G.gdp>=gdpTarget)score++;if(G.population>=popTarget)score++;if(G.satisfaction>=satTarget)score++;if(G.superiorEval>=evalTarget)score++;if(getFarmlandRatio()>=0.13)score++;var grade=score>=5?'优秀':score>=4?'良好':score>=3?'合格':'不合格';addLog('考核',' 年度考核: '+grade+' (得分'+score+'/5)',grade==='不合格'?'danger':'success');G.performance+=score;if(grade==='不合格'){G.superiorEval=Math.max(0,G.superiorEval-0.1);}else if(grade==='优秀'){G.superiorEval=Math.min(1,G.superiorEval+0.05);G.satisfaction=Math.min(1,G.satisfaction+0.03);}G.examRecords.push({year:G.year,grade:grade,score:score});addLog('体检',' '+G.year+'年度城市体检: GDP '+fmtNum(G.gdp)+', 人口 '+fmtNum(G.population)+', 满意度 '+fmtPct(G.satisfaction),'info');
}
function getRankTarget(rank){var targets=[25000,60000,150000,400000,1000000,3000000,8000000,20000000];return targets[rank-1]||10000;}
function getPopTarget(rank){var targets=[450000,600000,1000000,2000000,4000000,8000000,15000000,30000000];return targets[rank-1]||500000;}
function getSatTarget(rank){return [0.55,0.58,0.60,0.62,0.65,0.68,0.70,0.72][rank-1]||0.68;}
function getEvalTarget(rank){return [0.55,0.58,0.60,0.62,0.65,0.68,0.70,0.72][rank-1]||0.68;}
function getEduRequirement(rank){var reqs=['大专','大专','本科','本科','本科','硕士','硕士','博士'];return reqs[rank-1]||'大专';}
function getMinTermMonths(rank){return [24,24,36,36,48,48,60,60][rank]||24;}
function getMaxTermMonths(rank){return [96,96,120,120,144,144,180,180][rank]||120;}
function getBestAgeRange(rank){return [[30,38],[33,42],[36,45],[40,50],[44,55],[48,58],[52,62],[55,65]][rank]||[30,60];}
function getRetirementAge(rank){if(rank>=8)return 70;if(rank>=7)return 68;if(rank>=6)return 65;return 60;}
function getAdminLevel(){var pop=G.population;if(pop>=1000000)return 6;if(pop>=300000)return 5;if(pop>=100000)return 4;if(pop>=50000)return 3;if(pop>=20000)return 2;if(pop>=5000)return 1;return 0;}
function getAdminLevelName(){return ADMIN_LEVELS[getAdminLevel()].name;}
function isFacilityUnlocked(facilityId){var adminLevel=getAdminLevel();for(var i=0;i<=adminLevel;i++){if(ADMIN_LEVELS[i].unlock.includes(facilityId))return true;}var facility=ALL_FACILITIES[facilityId];if(facility&&facility.unlock==='initial')return true;return false;}
function countFacilityType(facilityId){var count=0;for(var y=0;y<50;y++){for(var x=0;x<50;x++){if(G.grid[y][x]>12)count++;}}return count;}
function calculateCoverage(){if(!G.cityCoverage)G.cityCoverage={};var cov=G.cityCoverage;if(!cov.power){cov.power=Array(50).fill(null).map(function(){return Array(50).fill(false);});cov.water=Array(50).fill(null).map(function(){return Array(50).fill(false);});cov.gas=Array(50).fill(null).map(function(){return Array(50).fill(false);});cov.education=Array(50).fill(null).map(function(){return Array(50).fill(false);});cov.medical=Array(50).fill(null).map(function(){return Array(50).fill(false);});cov.police=Array(50).fill(null).map(function(){return Array(50).fill(false);});cov.fire=Array(50).fill(null).map(function(){return Array(50).fill(false);});cov.garbage=Array(50).fill(null).map(function(){return Array(50).fill(false);});cov.transit=Array(50).fill(null).map(function(){return Array(50).fill(false);});cov.telecom=Array(50).fill(null).map(function(){return Array(50).fill(false);});}for(var y=0;y<50;y++){for(var x=0;x<50;x++){cov.power[y][x]=false;cov.water[y][x]=false;cov.gas[y][x]=false;cov.education[y][x]=false;cov.medical[y][x]=false;cov.police[y][x]=false;cov.fire[y][x]=false;cov.garbage[y][x]=false;cov.transit[y][x]=false;cov.telecom[y][x]=false;}}for(var y=0;y<50;y++){for(var x=0;x<50;x++){var type=G.grid[y][x];if(type===8||type===16||type===17){for(var dy=-10;dy<=10;dy++){for(var dx=-10;dx<=10;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<50&&nx>=0&&nx<50)cov.power[ny][nx]=true;}}}if(type===9||type===18){for(var dy=-8;dy<=8;dy++){for(var dx=-8;dx<=8;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<50&&nx>=0&&nx<50)cov.water[ny][nx]=true;}}}if(type>=21&&type<=25){for(var dy=-12;dy<=12;dy++){for(var dx=-12;dx<=12;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<50&&nx>=0&&nx<50)cov.education[ny][nx]=true;}}}if(type>=26&&type<=27){for(var dy=-15;dy<=15;dy++){for(var dx=-15;dx<=15;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<50&&nx>=0&&nx<50)cov.medical[ny][nx]=true;}}}if(type===28){for(var dy=-10;dy<=10;dy++){for(var dx=-10;dx<=10;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<50&&nx>=0&&nx<50)cov.police[ny][nx]=true;}}}if(type===29){for(var dy=-10;dy<=10;dy++){for(var dx=-10;dx<=10;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<50&&nx>=0&&nx<50)cov.fire[ny][nx]=true;}}}if(type===30){for(var dy=-8;dy<=8;dy++){for(var dx=-8;dx<=8;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<50&&nx>=0&&nx<50)cov.garbage[ny][nx]=true;}}}if(type===31){for(var dy=-8;dy<=8;dy++){for(var dx=-8;dx<=8;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<50&&nx>=0&&nx<50)cov.transit[ny][nx]=true;}}}if(type===32){for(var dy=-10;dy<=10;dy++){for(var dx=-10;dx<=10;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<50&&nx>=0&&nx<50)cov.telecom[ny][nx]=true;}}}}}var powerCount=0,waterCount=0,eduCount=0,medCount=0,totalBuildable=0;for(var y=0;y<50;y++){for(var x=0;x<50;x++){if(G.grid[y][x]!==7&&G.grid[y][x]!==12){totalBuildable++;if(cov.power[y][x])powerCount++;if(cov.water[y][x])waterCount++;if(cov.education[y][x])eduCount++;if(cov.medical[y][x])medCount++;}}}cov.powerRate=totalBuildable>0?powerCount/totalBuildable:0;cov.waterRate=totalBuildable>0?waterCount/totalBuildable:0;cov.educationRate=totalBuildable>0?eduCount/totalBuildable:0;cov.medicalRate=totalBuildable>0?medCount/totalBuildable:0;return cov;}
var _pollutionMapCache=null;var _pollutionMapDirty=true;function markPollutionDirty(){_pollutionMapDirty=true;}
function calculatePollutionMap(){if(!G)return null;if(_pollutionMapCache&&!_pollutionMapDirty)return _pollutionMapCache;var w=mapWidth,h=mapHeight;var pm=[];for(var y=0;y<h;y++){pm[y]=[];for(var x=0;x<w;x++)pm[y][x]=0;}for(var key in G.buildingData){var bd=G.buildingData[key];var coords=key.split(',').map(Number);var bx=coords[0],by=coords[1];var type=G.grid[by]?.[bx];if(!bd||!bd.level)continue;var base=getBuildingBase(type);if(!base)continue;var poll=base.pollution||0;var range=base.pollutionRange||0;if(poll===0||range===0)continue;var mult=[1,1,1.8,2.8,4,5.5][bd.level]||1;var strength=poll*mult;for(var dy=-range;dy<=range;dy++){for(var dx=-range;dx<=range;dx++){var nx=bx+dx,ny=by+dy;if(nx<0||nx>=w||ny<0||ny>=h)continue;var dist=Math.sqrt(dx*dx+dy*dy);if(dist>range)continue;var falloff=1-dist/(range+1);pm[ny][nx]+=strength*falloff;}}}var globalPoll=G.pollution||0;for(var y=0;y<h;y++){for(var x=0;x<w;x++){pm[y][x]+=globalPoll*0.3;pm[y][x]=Math.max(-20,Math.min(100,pm[y][x]));}}_pollutionMapCache=pm;_pollutionMapDirty=false;return pm;}
function calculateCitySatisfaction(){var cov=G.cityCoverage||calculateCoverage();var score=0;score+=(cov.powerRate||0)*10;score+=(cov.waterRate||0)*10;var garbageCount=countBuildingType(30)||0;score+=Math.min(10,garbageCount*2);score+=(cov.educationRate||0)*10;score+=(cov.medicalRate||0)*10;var policeCount=countBuildingType(28)||0;score+=Math.min(10,policeCount*2+G.securityIndex/10);var fireCount=countBuildingType(29)||0;score+=Math.min(5,fireCount*1.5);var transitCount=countBuildingType(31)||0;score+=Math.min(5,transitCount*1.5);var greenCount=countBuildingType(6)||0;score+=Math.min(10,greenCount*0.3+(100-G.pollution)/10);var commercialCount=countBuildingType(4)||0;score+=Math.min(5,commercialCount*0.5);score+=Math.min(5,G.finance/10000);var cultureCount=(countBuildingType(33)||0)+(countBuildingType(34)||0)+(countBuildingType(35)||0);score+=Math.min(10,cultureCount*1.5+G.livelihood.socialSecurity/10);return Math.min(100,Math.max(0,score));}
function calculateCityDemand(){if(!G.cityDemand)G.cityDemand={};var demand=G.cityDemand;demand.residential=Math.round(G.population*0.05+(G.commercialJobs+G.industrialJobs)*0.1);demand.commercial=Math.round(G.population*0.02+G.personal.deposit*10);demand.industrial=Math.round(G.populationStructure.labor*0.05+G.gdp/10000);demand.office=Math.round(demand.commercial*0.3+G.educationIndex/10);demand.highTech=Math.round(G.educationIndex*0.5+(G.cityCoverage?.telecomRate||0)*100);return demand;}
function calculateCityEconomy(){if(!G.cityEconomy)G.cityEconomy={};var econ=G.cityEconomy;var residentialCount=countBuildingType(3)||0;var commercialCount=countBuildingType(4)||0;var industrialCount=countBuildingType(5)||0;var officeCount=countBuildingType(10)||0;econ.residentialTax=Math.round(residentialCount*50*0.09*(G.livelihood.education/50));econ.commercialTax=Math.round(commercialCount*100*0.10);econ.industrialTax=Math.round(industrialCount*80*0.12);econ.officeTax=Math.round(officeCount*120*0.11);econ.totalTax=econ.residentialTax+econ.commercialTax+econ.industrialTax+econ.officeTax;var roadCount=countBuildingType(2)||0;econ.maintenance=Math.round(roadCount*2+(Object.keys(ALL_FACILITIES).length*10));econ.surplus=econ.totalTax-econ.maintenance;return econ;}
function updateCitySimulation(){calculateCoverage();var satisfaction=calculateCitySatisfaction();G.citySatisfaction=satisfaction;G.satisfaction=G.satisfaction*0.7+(satisfaction/100)*0.3;calculateCityDemand();calculateCityEconomy();var newLevel=getAdminLevel();if(!G.currentAdminLevel)G.currentAdminLevel=0;if(newLevel>G.currentAdminLevel){G.currentAdminLevel=newLevel;addLog('城市',' 行政区划升级为'+ADMIN_LEVELS[newLevel].name+'！解锁更多设施。','event');}}
function updateLivelihood(){var eduBuildings=countBuildingType(3)+countBuildingType(10);G.livelihood.education=Math.min(100,Math.max(0,20+eduBuildings*2+G.policy.eduRatio*8+G.population/5000));G.educationIndex=G.livelihood.education;G.livelihood.medical=Math.min(100,Math.max(0,15+countBuildingType(6)*3+G.policy.healthRatio*8+G.population/8000));G.medicalIndex=G.livelihood.medical;var totalJobs=G.commercialJobs+G.industrialJobs;var jobDemand=G.populationStructure.labor;G.livelihood.employment=Math.min(100,Math.max(0,40+(totalJobs/Math.max(1,jobDemand))*40+G.gdp/100000));var residential=countBuildingType(3);G.livelihood.housing=Math.min(100,Math.max(0,20+residential*2.5+G.population/10000-G.pollution/5));G.livelihood.socialSecurity=Math.min(100,Math.max(0,20+G.policy.socialRatio*10+G.policy.socialCoverage*30+G.finance/50000));}
function updatePopulation(){var ps=G.populationStructure;var birthRateMod=1;if(G.year>=1980&&G.year<2016)birthRateMod=0.5;else if(G.year>=2016&&G.year<2021)birthRateMod=0.7;else if(G.year>=2021)birthRateMod=0.85;ps.birthRate=Math.max(0.3,2*birthRateMod-G.livelihood.housing/200-G.livelihood.education/300);ps.deathRate=Math.max(0.3,0.6+ps.elderly/Math.max(1,G.population)*2-G.livelihood.medical/100);ps.naturalGrowth=ps.birthRate-ps.deathRate;var naturalIncrease=Math.round(G.population*ps.naturalGrowth/100);var flowFactor=(G.livelihood.employment-50)/50+(G.gdp/100000)-0.5;ps.inflow=Math.max(0,Math.round(flowFactor*500));ps.outflow=Math.max(0,Math.round(-flowFactor*300+(100-G.livelihood.housing)*10));G.population=Math.max(1000,G.population+naturalIncrease+ps.inflow-ps.outflow);ps.children=Math.round(G.population*0.28);ps.labor=Math.round(G.population*0.62);ps.elderly=G.population-ps.children-ps.labor;var giniTarget=0.30+Math.min(0.25,G.gdp/5000000)-G.livelihood.socialSecurity/300;G.giniCoefficient=G.giniCoefficient*0.8+giniTarget*0.2;}
function updateFinanceDetail(){var fd=G.financeDetail;fd.taxRevenue=Math.round(G.gdp*0.15+countBuildingType(4)*200+countBuildingType(5)*300);if(G.year>=1998){fd.landRevenue=Math.round((G.year-1998)*200+countBuildingType(3)*100+G.population/100);}else{fd.landRevenue=Math.round(countBuildingType(3)*20);}fd.transferPayment=Math.round(10000+G.rank*5000+Math.max(0,50000-G.finance)/10);fd.adminFee=Math.round(G.population*0.5+countBuildingType(4)*50);var totalRevenue=fd.taxRevenue+fd.landRevenue+fd.transferPayment+fd.adminFee;fd.econConstruction=Math.round(totalRevenue*0.30*G.policy.infraRatio);fd.education=Math.round(totalRevenue*0.18*G.policy.eduRatio);fd.medical=Math.round(totalRevenue*0.12*G.policy.healthRatio);fd.admin=Math.round(totalRevenue*0.15);fd.socialSecurity=Math.round(totalRevenue*0.10*G.policy.socialRatio);fd.publicSecurity=Math.round(totalRevenue*0.08*G.policy.justiceRatio);fd.environmental=Math.round(totalRevenue*0.04*G.policy.envRatio);fd.other=Math.round(totalRevenue*0.03);var totalExpense=fd.econConstruction+fd.education+fd.medical+fd.admin+fd.socialSecurity+fd.publicSecurity+fd.environmental+fd.other;var surplus=totalRevenue-totalExpense;G.finance+=surplus;G.financeSurplus=surplus;}
function updateRelationships(){var rel=G.relationships;rel.superior.relation=Math.max(0,rel.superior.relation-2);rel.superior.trust=Math.max(0,rel.superior.trust-1);rel.superior2.relation=Math.max(0,rel.superior2.relation-3);rel.colleagues.forEach(function(c){c.relation=Math.max(0,c.relation-2);c.trust=Math.max(0,c.trust-1);});rel.subordinates.forEach(function(s){s.relation=Math.max(0,s.relation-1);if(s.loyal)s.trust=Math.min(100,s.trust+1);});if(G.superiorEval>0.7){rel.superior.relation=Math.min(100,rel.superior.relation+3);rel.superior.trust=Math.min(100,rel.superior.trust+2);}if(G.personal.corruptionRisk>50){rel.colleagues.forEach(function(c){if(Math.random()<0.3)c.hostile=true;});}}

function triggerRandomEvent(){
  if(G.eventState.eventCooldown>0){G.eventState.eventCooldown--;return;}
  if(Math.random()>0.4)return;
  var available=randomEvents.filter(function(e){return !e.condition||e.condition();});
  if(available.length===0)return;
  var totalProb=available.reduce(function(s,e){return s+e.probability;},0);
  var randVal=Math.random()*totalProb;
  var selected=available[0];
  for(var i=0;i<available.length;i++){randVal-=available[i].probability;if(randVal<=0){selected=available[i];break;}}
  G.eventState.eventCooldown=1;
  G.eventState.lastEventYear=G.year;
  G.currentEvent = selected;
  var eventHtml='<div style="padding:10px;">';
  eventHtml+='<div style="background:#f2f2f7;border-radius:12px;padding:16px;margin-bottom:14px;">';
  eventHtml+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">';
  eventHtml+='<div style="width:40px;height:40px;background:#ff9500;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;">!</div>';
  eventHtml+='<div style="font-size:17px;font-weight:700;color:#1c1c1e;">'+selected.name+'</div></div>';
  eventHtml+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">';
  eventHtml+='<div style="background:#fff;border-radius:8px;padding:10px;"><div style="font-size:11px;color:#8e8e93;">事件类型</div><div style="font-size:14px;font-weight:600;color:#1c1c1e;margin-top:2px;">'+selected.type+'</div></div>';
  eventHtml+='<div style="background:#fff;border-radius:8px;padding:10px;"><div style="font-size:11px;color:#8e8e93;">严重程度</div><div style="font-size:14px;font-weight:600;color:#ff3b30;margin-top:2px;">'+'★'.repeat(selected.severity)+'</div></div>';
  eventHtml+='</div>';
  eventHtml+='<div style="font-size:13px;color:#3a3a3c;line-height:1.6;margin-bottom:12px;">'+(selected.description||'请妥善应对。')+'</div>';
  eventHtml+='<div style="font-size:12px;font-weight:600;color:#007aff;margin-bottom:8px;">请选择应对方案：</div>';
  eventHtml+='</div>';
  // 生成选项按钮
  var buttons = [];
  selected.choices.forEach(function(choice, idx){
    eventHtml+='<div onclick="handleEventChoice('+idx+')" style="background:#fff;border:1px solid #e5e5ea;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.borderColor=\'#007aff\';this.style.background=\'#f0f7ff\'" onmouseout="this.style.borderColor=\'#e5e5ea\';this.style.background=\'#fff\'">';
    eventHtml+='<div style="font-size:14px;font-weight:600;color:#1c1c1e;margin-bottom:4px;">'+choice.text+'</div>';
    eventHtml+='<div style="font-size:12px;color:#8e8e93;">'+choice.desc+'</div>';
    eventHtml+='</div>';
  });
  eventHtml+='</div>';
  showModal('突发事件：'+selected.name, eventHtml, []);
  renderAll();
}
function handleEventChoice(idx){
  if(!G.currentEvent||!G.currentEvent.choices[idx])return;
  var choice = G.currentEvent.choices[idx];
  choice.effect();
  G.currentEvent = null;
  closeModal();
  renderAll();
}

// 投资者来访事件
function triggerInvestor(){
  if(!G.investorQueue) G.investorQueue = [];
  if(Math.random() > 0.4) return;
  var investorTypes = [
    {name:'港商李先生', industry:'制造业', amount: 2000+Math.floor(Math.random()*3000), condition: function(){return G.gdp > 5000;}},
    {name:'台商王总', industry:'电子产业', amount: 3000+Math.floor(Math.random()*5000), condition: function(){return G.educationIndex > 40;}},
    {name:'浙商张老板', industry:'商贸物流', amount: 1500+Math.floor(Math.random()*2500), condition: function(){return true;}},
    {name:'外资企业代表', industry:'高新技术', amount: 5000+Math.floor(Math.random()*8000), condition: function(){return G.gdp > 20000 && G.educationIndex > 50;}},
    {name:'本地企业家陈总', industry:'房地产', amount: 1000+Math.floor(Math.random()*2000), condition: function(){return G.population > 300000;}}
  ];
  var available = investorTypes.filter(function(i){return i.condition();});
  if(available.length === 0) return;
  var investor = available[Math.floor(Math.random()*available.length)];
  var html = '<div style="padding:10px;"><div style="background:#f0f7ff;border-radius:12px;padding:16px;margin-bottom:14px;">';
  html += '<div style="font-size:16px;font-weight:700;color:#007aff;margin-bottom:8px;">'+investor.name+'来访考察</div>';
  html += '<div style="font-size:13px;color:#3a3a3c;line-height:1.6;margin-bottom:10px;">'+investor.name+'对我市'+investor.industry+'领域表示浓厚兴趣，计划投资约'+investor.amount+'万元。</div>';
  html += '<div style="font-size:12px;color:#8e8e93;">投资将增加GDP和就业，但需要配套基础设施。</div>';
  html += '</div></div>';
  showModal('招商引资', html, [
    {text:'热情接待', class:'primary', action:function(){
      G.gdp += investor.amount * 0.3;
      G.finance += investor.amount * 0.05;
      G.livelihood.employment = Math.min(100, G.livelihood.employment + 2);
      G.satisfaction = Math.min(1, G.satisfaction + 0.02);
      addLog('招商', investor.name+'投资'+investor.amount+'万元落户我市，GDP+'+Math.round(investor.amount*0.3)+'万，就业+2%','success');
      closeModal();
      renderAll();
    }},
    {text:'婉拒', class:'', action:function(){
      addLog('招商', '婉拒了'+investor.name+'的投资意向','info');
      closeModal();
    }}
  ]);
}

function buildTile(x,y,type){if(G.gameOver)return false;if(x<0||x>=50||y<0||y>=50)return false;if(G.grid[y][x]===7&&type!==11){addLog('建造','水域不可建造（铁路可建桥梁）','warn');return false;}if(G.grid[y][x]===12){addLog('建造','山地地形复杂，不可建造','warn');return false;}if(G.grid[y][x]===type){return false;}var cost=getBuildingCost(type,1);if(cost>G.finance){addLog('建造','财政不足，需要'+fmtMoney(cost),'warn');showModal('财政不足','<div style="padding:10px 0;">当前财政：<strong style="color:#dc2626;">'+fmtMoney(G.finance)+'</strong><br>建造'+getTypeName(type)+'需要：<strong>'+fmtMoney(cost)+'</strong><br><br>请先发展经济增加财政收入，或调整预算。</div>',[{text:'知道了',class:'primary',action:closeModal}]);return false;}if(G.grid[y][x]===1){var ratio=getFarmlandRatio();if(ratio<0.13){addLog('建造',' 耕地红线警告！当前比例'+fmtPct(ratio),'warn');}}G.finance-=cost;var oldType=G.grid[y][x];G.grid[y][x]=type;if(oldType===1)G.farmland--;if(type===1)G.farmland++;var key=x+','+y;G.buildingData[key]={level:1,builtTime:G.year+'-'+G.month+'-'+G.day,type:type,cost:cost};addLog('建造',' 在('+x+','+y+')建造了'+getTypeName(type)+'，花费'+fmtMoney(cost),'success');markPollutionDirty();renderAll();return true;}
function demolishTile(x,y){if(G.gameOver)return false;if(x<0||x>=50||y<0||y>=50)return false;var type=G.grid[y][x];if(type===0||type===7)return false;var key=x+','+y;var bd=G.buildingData[key];var refund=0;if(bd){var cost=getBuildingCost(type,bd.level);refund=cost*0.5;G.finance+=refund;delete G.buildingData[key];}if(type===1)G.farmland--;G.grid[y][x]=0;addLog('拆除','拆除('+x+','+y+')'+getTypeName(type)+'，返还'+fmtMoney(refund),'info');markPollutionDirty();renderAll();return true;}

function renderDemandTab(){var html='';html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:12px 0 8px;">产业需求</div>';html+=demandBar('商业岗位',G.commercialJobs,G.commercialJobDemand,'个');html+=demandBar('工业岗位',G.industrialJobs,G.industrialJobDemand,'个');html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:16px 0 8px;">基础设施需求</div>';html+=demandBar('电力供给',G.powerSupply,G.powerDemand,'kW');html+=demandBar('供水能力',G.waterSupply,G.waterDemand,'吨');html+=demandBar('污水处理能力',G.sewageCapacity,G.sewageDemand,'吨');html+=demandBar('垃圾处理能力',G.garbageCapacity,G.garbageDemand,'吨');html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:16px 0 8px;">公共服务需求</div>';html+=demandBar('教育资源',G.educationIndex*10,1000,'学位');html+=demandBar('医疗资源',G.medicalIndex*10,1000,'床位');var unmet=[];if(G.commercialJobs<G.commercialJobDemand)unmet.push('商业岗位');if(G.industrialJobs<G.industrialJobDemand)unmet.push('工业岗位');if(G.powerSupply<G.powerDemand)unmet.push('电力供给');if(G.waterSupply<G.waterDemand)unmet.push('供水能力');if(G.sewageCapacity<G.sewageDemand)unmet.push('污水处理');if(G.garbageCapacity<G.garbageDemand)unmet.push('垃圾处理');if(unmet.length>0){html+='<div style="margin-top:16px;padding:12px;background:#fef3c7;border-radius:8px;border-left:4px solid #f59e0b;"><div style="font-weight:600;color:#92400e;">城市需求未满足</div><div style="font-size:13px;color:#78350f;margin-top:4px;">以下供给不足：'+unmet.join('、')+'<br>请增加对应类型的建筑以提升市民满意度。</div></div>';}else{html+='<div style="margin-top:16px;padding:12px;background:#d1fae5;border-radius:8px;border-left:4px solid #10b981;"><div style="font-weight:600;color:#065f46;">所有需求已满足</div><div style="font-size:13px;color:#047857;margin-top:4px;">城市各项基础设施和公共服务供给充足，市民满意度较高。</div></div>';}return html;}
function demandBar(name,supply,demand,unit){var ratio=Math.min(100,(supply/demand)*100);var status=supply>=demand?'充足':(supply>=demand*0.7?'不足':'严重不足');var color=supply>=demand?'#10b981':(supply>=demand*0.7?'#f59e0b':'#ef4444');return '<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><span style="font-size:14px;font-weight:500;color:#111827;">'+name+'</span><span style="font-size:13px;font-weight:600;color:'+color+';">'+status+'</span></div><div style="height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:4px;"><div style="height:100%;width:'+ratio+'%;background:'+color+';border-radius:4px;transition:width 0.3s;"></div></div><div style="font-size:12px;color:#6b7280;">总需求: '+fmtNum(demand)+' '+unit+' / 当前供给: '+fmtNum(supply)+' '+unit+'</div></div>';}

y:flex;justify-content:space-between;"><span style="font-size:14px;color:#111827;">耕地红线比例</span><span style="font-size:14px;font-weight:600;color:#111827;">'+farmlandRatio+'%</span></div>';html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;"><span style="font-size:14px;color:#111827;">违规月数</span><span style="font-size:14px;font-weight:600;color:'+(G.violationMonths>0?'#ef4444':'#059669')+';">'+G.violationMonths+'月</span></div>';html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:16px 0 8px;">政治指标</div>';html+=indexBar('政治声誉',Math.round(G.politicalReputation),'#dc2626');html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;"><span style="font-size:14px;color:#111827;">任内政绩</span><span style="font-size:14px;font-weight:600;color:#111827;">'+fmtNum(G.performance)+'</span></div>';html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;"><span style="font-size:14px;color:#111827;">私人账户</span><span style="font-size:14px;font-weight:600;color:#b45309;">¥'+fmtNum(G.personalAccount)+'万</span></div>';return html;}

function getHistoricalEvents(){return [{id:'sez1980',year:1980,name:'设立经济特区',desc:'中央批准在深圳、珠海、汕头、厦门设置经济特区，对外开放迈出关键步伐。效果：商业GDP+20%，税收+15%，持续5年。'},{id:'coastal1984',year:1984,name:'开放沿海港口城市',desc:'进一步开放大连、天津、青岛、上海、广州等14个沿海港口城市。效果：工业GDP+15%，招商引资成功率+20%。'},{id:'price1988',year:1988,name:'价格闯关',desc:'试图放开大部分商品价格，引发短期通胀。效果：通胀率+8%，市民满意度-10%（短期），长期市场经济体制初步建立。'},{id:'南巡1992',year:1992,name:'邓小平南巡讲话',desc:'进一步解放思想，加快改革开放步伐。效果：GDP增速+3%，商业/工业GDP+25%，持续10年。'},{id:'market1993',year:1993,name:'建立社会主义市场经济体制',desc:'十四届三中全会通过《关于建立社会主义市场经济体制若干问题的决定》。效果：税收制度改革，财政收入+20%。'},{id:'housing1998',year:1998,name:'住房制度改革',desc:'停止住房实物分配，实行住房分配货币化。效果：住宅需求+50%，房地产GDP+30%，持续8年。'},{id:'wto2001',year:2001,name:'加入世界贸易组织',desc:'中国正式成为WTO成员，对外开放进入新阶段。效果：进出口贸易+40%，工业GDP+20%，持续15年。'},{id:'tax2006',year:2006,name:'取消农业税',desc:'延续2600年的农业税正式退出历史舞台。效果：农民收入+15%，市民满意度+5%，耕地保护+10%。'},{id:'highspeed2008',year:2008,name:'高铁时代开启',desc:'京津城际铁路开通，中国进入高铁时代。效果：交通拥堵-30%，商业GDP+15%，人口流入+20%。'},{id:'belt2013',year:2013,name:'一带一路倡议',desc:'提出共建"丝绸之路经济带"和"21世纪海上丝绸之路"。效果：对外贸易+25%，基础设施投资+30%。'},{id:'newera2017',year:2017,name:'中国特色社会主义新时代',desc:'十九大宣告中国特色社会主义进入新时代。效果：环保监管+2级，民生投入+20%，高质量发展导向。'},{id:'pandemic2020',year:2020,name:'新冠疫情冲击',desc:'突如其来的疫情对经济社会造成巨大冲击。效果：GDP增速-5%，商业GDP-20%（短期），医疗指数+15%。'},{id:'commone2021',year:2021,name:'共同富裕示范区',desc:'高质量发展建设共同富裕示范区。效果：社保覆盖率+10%，市民满意度+10%，收入差距缩小。'}];}
function triggerHistoricalEvent(id){var events=getHistoricalEvents();var e=events.find(function(ev){return ev.id===id;});if(!e||G.triggeredEvents.includes(id))return;G.triggeredEvents.push(id);addLog('事件',''+e.year+'年 '+e.name+'：'+e.desc,'event');if(id==='sez1980'||id==='南巡1992'){G.satisfaction=Math.min(1,G.satisfaction+0.05);G.politicalReputation=Math.min(100,G.politicalReputation+5);}if(id==='wto2001'){G.gdp=Math.round(G.gdp*1.2);G.politicalReputation=Math.min(100,G.politicalReputation+8);}if(id==='pandemic2020'){G.satisfaction=Math.max(0,G.satisfaction-0.1);G.finance=Math.round(G.finance*0.9);}if(id==='tax2006'||id==='commone2021'){G.satisfaction=Math.min(1,G.satisfaction+0.08);}renderGovModal();renderAll();}

function doCadreAction(cadreId,action){
  var c=G.cadres.find(function(x){return x.id===cadreId;});
  if(!c)return;
  if(action==='promote'){
    var ranks=['办事员','科员','正股级','副科','正科','副处','正处'];
    var idx=ranks.indexOf(c.rank);
    if(idx>=ranks.length-1){alert('已到本级最高职级');return;}
    c.rank=ranks[idx+1];
    c.relation=Math.min(5,c.relation+1);
    addLog('人事',c.name+'提拔为'+c.rank,'success');
  }else if(action==='transfer'){
    var depts=['党委办','政府办','发改委','财政局','教育局','卫生局','住建局','交通局','水利局','农业局','商务局','公安局','司法局','人社局','环保局','安监局','审计局','统计局','工商局','税务局'];
    c.department=depts[Math.floor(Math.random()*depts.length)];
    addLog('人事',c.name+'平调至'+c.department,'info');
  }else if(action==='assess'){
    var results=['优秀','称职','基本称职','不称职'];
    c.performance=results[Math.floor(Math.random()*results.length)];
    addLog('人事',c.name+'年度考核：'+c.performance,c.performance==='优秀'?'success':c.performance==='不称职'?'warn':'info');
  }
  renderGovModal();
}
function doAppoint(cadreId,action){
  var c=G.cadres.find(function(x){return x.id===cadreId;});
  if(!c)return;
  if(action==='promote'){if(c.rank>=8){alert('已到最高职级');return;}appointCadre(cadreId,c.position,c.rank+1);}
  else if(action==='transfer'){var nd=DEPARTMENTS[Math.floor(Math.random()*DEPARTMENTS.length)];appointCadre(cadreId,nd+'局长',c.rank);}
  else if(action==='demote'){if(c.rank<=0){alert('已到最低职级');return;}appointCadre(cadreId,c.position,c.rank-1);}
  renderGovModal();
}

function showPromotionModal(newRank){showModal(' 晋升喜报','<div style="text-align:center;padding:12px 0;"><div style="font-size:32px;margin-bottom:8px;"></div><div style="font-size:22px;font-weight:600;color:#007aff;">晋升为 '+newRank+'</div><div style="margin-top:12px;color:rgba(255,255,255,0.6);">工资上涨，考核目标提高</div><div style="margin-top:6px;font-size:13px;color:rgba(255,255,255,0.4);">个人资产、股票持仓全部保留</div></div>',[{text:'继续治理',class:'primary',action:closeModal}]);}

function checkPromotion(){
  if(G.gameOver)return;
  var termLimit=G.rank===0?3:5;
  if(G.termYears<termLimit)return;
  var evalThreshold=[0.5,0.55,0.6,0.65,0.7][G.rank]||0.7;
  var gdpThreshold=[25000,60000,150000,400000,1000000][G.rank]||1000000;
  if(G.superiorEval>=evalThreshold&&G.gdp>=gdpThreshold&&G.rank<5){
    G.rank++;
    G.termYears=0;
    G.salary=[8000,12000,18000,25000,35000,50000][G.rank]||50000;
    var newRankName=G.rankNames[G.rank]||'高级干部';
    addLog('晋升','恭喜！您已晋升为'+newRankName+'，月薪'+G.salary+'元','success');
    showPromotionModal(newRankName);
  }else if(G.termYears>=termLimit){
    if(G.superiorEval<evalThreshold*0.7||G.gdp<gdpThreshold*0.5){
      G.gameOver=true;
      G.gameOverReason='任期考核不合格，被调离岗位！';
      addLog('考核',''+G.gameOverReason,'danger');
      showGameOver();
    }else{
      G.termYears=0;
      addLog('考核','任期结束，考核合格，继续留任','info');
    }
  }
}

function generateMap(seed){var size=50;var mapSeed=seed||Date.now();var elevNoise=new ValueNoise(mapSeed);var moistNoise=new ValueNoise(mapSeed+1000);var elevScale=0.12;var moistScale=0.09;var terrain=[];var grid=[];for(var y=0;y<size;y++){grid[y]=new Array(size).fill(0);terrain[y]=[];for(var x=0;x<size;x++){var elevation=elevNoise.fbm(x*elevScale,y*moistScale,5);var moisture=moistNoise.fbm(x*moistScale,y*moistScale,4);terrain[y][x]={elevation:elevation,moisture:moisture};if(elevation<0.30){grid[y][x]=7;}else if(elevation<0.35){grid[y][x]=0;}else if(elevation<0.60){grid[y][x]=moisture>0.55?6:1;}else if(elevation<0.75){grid[y][x]=moisture>0.45?6:0;}else{grid[y][x]=12;}}}var visited=[];for(var y=0;y<size;y++)visited[y]=new Array(size).fill(false);function findWaterRegion(sx,sy){var region=[];var stack=[[sx,sy]];while(stack.length>0){var pt=stack.pop();var x=pt[0],y=pt[1];if(x<0||x>=size||y<0||y>=size)continue;if(visited[y][x]||grid[y][x]!==7)continue;visited[y][x]=true;region.push([x,y]);stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}return region;}for(var y=0;y<size;y++){for(var x=0;x<size;x++){if(grid[y][x]===7&&!visited[y][x]){var region=findWaterRegion(x,y);var minX=size,maxX=0,minY=size,maxY=0;for(var idx=0;idx<region.length;idx++){var rx=region[idx][0],ry=region[idx][1];if(rx<minX)minX=rx;if(rx>maxX)maxX=rx;if(ry<minY)minY=ry;if(ry>maxY)maxY=ry;}var width=maxX-minX+1;var height=maxY-minY+1;var area=region.length;var isRiver=(width>height*2.5||height>width*2.5)&&area<80;if(isRiver){if(width>height){for(var ry=minY;ry<=maxY;ry++){var waterInRow=[];for(var rx=minX;rx<=maxX;rx++){if(grid[ry][rx]===7)waterInRow.push(rx);}if(waterInRow.length>2){var mid=Math.floor(waterInRow.length/2);var keep=[waterInRow[mid-1],waterInRow[mid]];for(var ri=0;ri<waterInRow.length;ri++){if(!keep.includes(waterInRow[ri]))grid[ry][waterInRow[ri]]=0;}}}}else{for(var rx=minX;rx<=maxX;rx++){var waterInCol=[];for(var ry=minY;ry<=maxY;ry++){if(grid[ry][rx]===7)waterInCol.push(ry);}if(waterInCol.length>2){var mid=Math.floor(waterInCol.length/2);var keep=[waterInCol[mid-1],waterInCol[mid]];for(var ri=0;ri<waterInCol.length;ri++){if(!keep.includes(waterInCol[ri]))grid[waterInCol[ri]][rx]=0;}}}}}}}}var farmCount=0;for(var y=0;y<size;y++){for(var x=0;x<size;x++){if(grid[y][x]===1)farmCount++;}}var targetFarm=Math.floor(size*size*0.22);if(farmCount<targetFarm){for(var y=0;y<size&&farmCount<targetFarm;y++){for(var x=0;x<size&&farmCount<targetFarm;x++){if(grid[y][x]===0||grid[y][x]===6){if(terrain[y][x].elevation<0.55){grid[y][x]=1;farmCount++;}}}}}var buildable=0;for(var y=0;y<size;y++){for(var x=0;x<size;x++){if(grid[y][x]!==7&&grid[y][x]!==12)buildable++;}}var minBuildable=Math.floor(size*size*0.60);if(buildable<minBuildable){var needConvert=minBuildable-buildable;for(var y=0;y<size&&needConvert>0;y++){for(var x=0;x<size&&needConvert>0;x++){if(grid[y][x]===12&&terrain[y][x].elevation<0.80){grid[y][x]=0;needConvert--;}}}}return grid;}

// 但为了完整，补上空函数定义以防遗漏
function calcMonthlyPayment(principal,annualRate,months){var monthlyRate=annualRate/100/12;if(monthlyRate===0)return principal/months;return principal*monthlyRate*Math.pow(1+monthlyRate,months)/(Math.pow(1+monthlyRate,months)-1);}
function calcFixedDepositMaturity(amount,annualRate,months){return amount*(1+annualRate/100*months/12);}
function depositCurrent(amount){if(amount<=0)return {success:false,msg:'金额必须大于0'};var amountWan=amount/10000;if(G.personal.deposit<amountWan)return {success:false,msg:'可用资金不足，需要'+fmtYuan(amountWan)};G.personal.deposit-=amountWan;G.personal.bank.currentDeposit+=amount;addLog('银行','活期存款存入'+fmtYuan(amountWan)+'，当前活期余额'+fmtYuan(G.personal.bank.currentDeposit/10000),'info');return {success:true};}
function withdrawCurrent(amount){if(amount<=0)return {success:false,msg:'金额必须大于0'};if(G.personal.bank.currentDeposit<amount)return {success:false,msg:'活期存款不足'};var amountWan=amount/10000;G.personal.bank.currentDeposit-=amount;G.personal.deposit+=amountWan;addLog('银行','活期取款'+fmtYuan(amountWan)+'，当前活期余额'+fmtYuan(G.personal.bank.currentDeposit/10000),'info');return {success:true};}
function depositFixed(amount,months){if(amount<=0)return {success:false,msg:'金额必须大于0'};var amountWan=amount/10000;if(G.personal.deposit<amountWan)return {success:false,msg:'可用资金不足，需要'+fmtYuan(amountWan)};var rateKey='fixed'+(months<12?months+'m':(months/12)+'y');var rate=BANK_CONFIG.depositRates[rateKey]||BANK_CONFIG.depositRates.fixed1y;G.personal.deposit-=amountWan;var deposit={id:'FD'+Date.now(),amount:amount,rate:rate,months:months,startDate:G.year+'-'+G.month+'-'+G.day,endMonth:G.month+months,endYear:G.year+Math.floor((G.month+months-1)/12),maturityAmount:calcFixedDepositMaturity(amount,rate,months),status:'active'};G.personal.bank.fixedDeposits.push(deposit);addLog('银行','定期存款'+fmtYuan(amount)+'，期限'+months+'个月，利率'+rate+'%，到期本息'+fmtYuan(deposit.maturityAmount),'success');return {success:true};}
function withdrawFixed(depositId,early){var idx=G.personal.bank.fixedDeposits.findIndex(function(d){return d.id===depositId;});if(idx<0)return {success:false,msg:'未找到该定期存款'};var deposit=G.personal.bank.fixedDeposits[idx];var returnAmount;if(early){var elapsedMonths=(G.year-parseInt(deposit.startDate.split('-')[0]))*12+(G.month-parseInt(deposit.startDate.split('-')[1]));returnAmount=deposit.amount*(1+BANK_CONFIG.earlyWithdrawalRate/100*elapsedMonths/12);addLog('银行','定期存款提前支取'+fmtYuan(deposit.amount)+'，按活期利率结算，实得'+fmtYuan(returnAmount),'warn');}else{returnAmount=deposit.maturityAmount;addLog('银行','定期存款到期支取'+fmtYuan(deposit.amount)+'，本息合计'+fmtYuan(returnAmount),'success');}G.personal.deposit+=returnAmount;G.personal.bank.fixedDeposits.splice(idx,1);return {success:true,amount:returnAmount};}
function applyLoan(type,amount,months){if(amount<=0)return {success:false,msg:'金额必须大于0'};var limit=BANK_CONFIG.loanLimits[type]||500000;if(amount>limit)return {success:false,msg:'超过'+type+'贷款上限'+fmtYuan(limit)};var rate=BANK_CONFIG.loanRates[type]||5.0;var monthlyPayment=calcMonthlyPayment(amount,rate,months);var loan={id:'LN'+Date.now(),type:type,typeName:{mortgage:'住房贷款',car:'汽车贷款',consumer:'消费贷款',business:'经营贷款',education:'助学贷款'}[type]||'贷款',amount:amount,rate:rate,months:months,startDate:G.year+'-'+G.month+'-'+G.day,monthlyPayment:monthlyPayment,remaining:amount,paidMonths:0,totalInterest:monthlyPayment*months-amount,status:'active'};G.personal.bank.loans.push(loan);G.personal.deposit+=amount;G.personal.bank.creditScore=Math.max(300,G.personal.bank.creditScore-5);addLog('银行',loan.typeName+'审批通过，金额'+fmtYuan(amount)+'，期限'+months+'个月，利率'+rate+'%，月供'+fmtYuan(monthlyPayment),'success');return {success:true,loan:loan};}
function repayLoan(loanId,amount){var idx=G.personal.bank.loans.findIndex(function(l){return l.id===loanId;});if(idx<0)return {success:false,msg:'未找到该贷款'};var loan=G.personal.bank.loans[idx];var payment=amount||loan.monthlyPayment;var paymentWan=payment/10000;if(G.personal.deposit<paymentWan)return {success:false,msg:'可用资金不足，需'+fmtYuan(paymentWan)};G.personal.deposit-=paymentWan;var monthlyRate=loan.rate/100/12;var interest=loan.remaining*monthlyRate;var principal=payment-interest;loan.remaining=Math.max(0,loan.remaining-principal);loan.paidMonths++;G.personal.bank.creditScore=Math.min(850,G.personal.bank.creditScore+2);if(loan.remaining<=0||loan.paidMonths>=loan.months){loan.status='completed';addLog('银行',loan.typeName+'已还清，共还款'+loan.paidMonths+'期','success');}else{addLog('银行',loan.typeName+'还款'+fmtYuan(payment)+'（本金'+fmtYuan(principal)+'，利息'+fmtYuan(interest)+'），剩余'+fmtYuan(loan.remaining),'info');}return {success:true};}
function prepayLoan(loanId,amount){var idx=G.personal.bank.loans.findIndex(function(l){return l.id===loanId;});if(idx<0)return {success:false,msg:'未找到该贷款'};var loan=G.personal.bank.loans[idx];var penalty=loan.remaining*BANK_CONFIG.prepaymentPenalty/100;var total=amount+penalty;if(G.personal.deposit<total)return {success:false,msg:'可用资金不足，需'+fmtYuan(total)+'（含违约金'+fmtYuan(penalty)+'）'};G.personal.deposit-=total;loan.remaining=Math.max(0,loan.remaining-amount);addLog('银行',loan.typeName+'提前还款'+fmtYuan(amount)+'，违约金'+fmtYuan(penalty)+'，剩余'+fmtYuan(loan.remaining),'warn');if(loan.remaining<=0){loan.status='completed';addLog('银行',loan.typeName+'已提前结清','success');}return {success:true};}
function updateBankSystem(){if(!G||!G.personal||!G.personal.bank)return;if(G.personal.bank.currentDeposit>0){var monthlyInterest=G.personal.bank.currentDeposit*BANK_CONFIG.depositRates.current/100/12;G.personal.bank.currentDeposit+=monthlyInterest;}G.personal.bank.fixedDeposits.forEach(function(deposit){if(deposit.status==='active'){var endYear=deposit.endYear;var endMonth=((deposit.endMonth-1)%12)+1;if(G.year>endYear||(G.year===endYear&&G.month>=endMonth)){deposit.status='matured';G.personal.bank.currentDeposit+=deposit.maturityAmount;addLog('银行','定期存款到期'+fmtYuan(deposit.amount)+'，本息'+fmtYuan(deposit.maturityAmount)+'已自动转入活期','success');}}});G.personal.bank.fixedDeposits=G.personal.bank.fixedDeposits.filter(function(d){return d.status==='active';});G.personal.bank.loans.forEach(function(loan){if(loan.status==='active'){if(G.personal.deposit>=loan.monthlyPayment){repayLoan(loan.id,loan.monthlyPayment);}else{loan.remaining*=1.005;G.personal.bank.creditScore=Math.max(300,G.personal.bank.creditScore-10);addLog('银行',loan.typeName+'逾期，罚息后剩余'+fmtYuan(loan.remaining)+'，信用评分下降','warn');}}});G.personal.bank.totalAssets=G.personal.deposit+G.personal.bank.currentDeposit/10000+G.personal.bank.fixedDeposits.reduce(function(s,d){return s+d.amount/10000;},0);G.personal.bank.totalLiabilities=G.personal.bank.loans.reduce(function(s,l){return s+l.remaining/10000;},0);}

class ValueNoise{constructor(seed){this.seed=seed;this.perm=[];var rand=this._mulberry32(seed);var p=[];for(var i=0;i<256;i++)p.push(i);for(var i=255;i>0;i--){var j=Math.floor(rand()*(i+1));var tmp=p[i];p[i]=p[j];p[j]=tmp;}this.perm=p.concat(p);}_mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}}_hash(x,y){return this.perm[(this.perm[x&255]+y)&255]/255;}_fade(t){return t*t*(3-2*t);}noise(x,y){var xi=Math.floor(x),yi=Math.floor(y);var xf=x-xi,yf=y-yi;var u=this._fade(xf),v=this._fade(yf);var a=this._hash(xi,yi);var b=this._hash(xi+1,yi);var c=this._hash(xi,yi+1);var d=this._hash(xi+1,yi+1);return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;}fbm(x,y,octaves,lacunarity,gain){octaves=octaves||4;lacunarity=lacunarity||2;gain=gain||0.5;var value=0,amplitude=1,frequency=1,maxVal=0;for(var i=0;i<octaves;i++){value+=amplitude*this.noise(x*frequency,y*frequency);maxVal+=amplitude;amplitude*=gain;frequency*=lacunarity;}return value/maxVal;}}

function getLinePoints(x1,y1,x2,y2){var points=[];var dx=Math.abs(x2-x1);var dy=Math.abs(y2-y1);var sx=x1<x2?1:-1;var sy=y1<y2?1:-1;var err=dx-dy;var x=x1,y=y1;while(true){points.push({x:x,y:y});if(x===x2&&y===y2)break;var e2=2*err;if(e2>-dy){err-=dy;x+=sx;}if(e2<dx){err+=dx;y+=sy;}}return points;}

// ---------- 工具函数 ----------
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function weightedPick(items) {
  var total = items.reduce(function(s, it) { return s + it.w; }, 0);
  var r = Math.random() * total;
  for (var i = 0; i < items.length; i++) { r -= items[i].w; if (r <= 0) return items[i].v; }
  return items[items.length - 1].v;
}

// ---------- 市民Agent ----------
var _citizenId = 0;
function createCitizen(age, gender, education) {
  _citizenId++;
  var g = gender || (Math.random() < 0.51 ? '男' : '女');
  var edu = education;
  if (!edu) {
    if (age < 6) edu = '文盲';
    else if (age < 12) edu = '小学';
    else if (age < 15) edu = '初中';
    else if (age < 18) edu = '高中';
    else if (age < 22) edu = weightedPick([{v:'高中',w:30},{v:'大专',w:25},{v:'本科',w:40},{v:'硕士',w:5}]);
    else edu = weightedPick([{v:'高中',w:15},{v:'大专',w:25},{v:'本科',w:40},{v:'硕士',w:15},{v:'博士',w:5}]);
  }
  return {
    id: 'C' + _citizenId,
    name: genName(g),
    gender: g,
    birthYear: (G ? G.year : 1980) - age,
    age: age,
    education: edu,
    educationProgress: age < 22 ? rand(0.3, 0.9) : 1,
    health: clamp(rand(60, 100) - (age > 50 ? (age - 50) * 0.5 : 0), 10, 100),
    happiness: rand(40, 80),
    stress: rand(10, 50),
    income: 0,
    savings: rand(0, 20000),
    debt: 0,
    occupation: age >= 18 && age < 60 ? pick(['工人','职员','服务员','技术员','个体户','农民','无业']) : (age < 18 ? '学生' : '退休'),
    workplace: null,
    industry: null,
    maritalStatus: age >= 22 && Math.random() < 0.6 ? '已婚' : '未婚',
    spouse: null,
    children: [],
    parents: [],
    socialClass: '工薪阶层',
    skills: { 技术: randInt(1, 5), 管理: randInt(1, 3), 沟通: randInt(1, 4) },
    isAlive: true,
    retired: age >= 60,

}

  return prefix + (suffix[industry] || '有限公司');
}

// ---------- 社会引擎初始化 ----------
function initSociety() {
  if (!G) return;
  _citizenId = 0;
  _householdId = 0;
  _businessId = 0;

  // 初始化市民（抽样2000人代表全市人口）
  G.citizens = [];
  var sampleSize = 2000;
  var basePop = G.population > 1000 ? G.population : 10000;
  var popScale = basePop / sampleSize; // 每个市民代表的人数
  G.popScale = popScale;

  for (var i = 0; i < sampleSize; i++) {
    var age = weightedPick([
      { v: randInt(0, 5), w: 8 }, { v: randInt(6, 12), w: 10 },
      { v: randInt(13, 18), w: 9 }, { v: randInt(19, 29), w: 15 },
      { v: randInt(30, 44), w: 22 }, { v: randInt(45, 59), w: 18 },
      { v: randInt(60, 74), w: 12 }, { v: randInt(75, 90), w: 6 }
    ]);
    G.citizens.push(createCitizen(age));
  }

  // 初始化家庭
  G.households = [];
  var unmarried = G.citizens.filter(function(c) { return c.maritalStatus === '未婚' && c.age >= 18 && c.age < 60; });
  var married = G.citizens.filter(function(c) { return c.maritalStatus === '已婚'; });
  // 配对已婚
  for (var i = 0; i < married.length - 1; i += 2) {
    if (married[i].gender === married[i + 1].gender) continue;
    married[i].spouse = married[i + 1].id;
    married[i + 1].spouse = married[i].id;
    var hh = createHousehold([married[i].id, married[i + 1].id]);
    // 可能有孩子
    if (Math.random() < 0.6) {
      var childCount = randInt(1, 3);
      for (var j = 0; j < childCount; j++) {
        var child = createCitizen(randInt(0, 18));
        child.parents = [married[i].id, married[i + 1].id];
        G.citizens.push(child);
        married[i].children.push(child.id);
        married[i + 1].children.push(child.id);
        hh.members.push(child.id);
      }
    }
    G.households.push(hh);
  }
  // 单身家庭
  for (var i = 0; i < unmarried.length; i += 2) {
    if (Math.random() < 0.3) {
      G.households.push(createHousehold([unmarried[i].id]));
    }
  }
  // 老年家庭
  var elderly = G.citizens.filter(function(c) { return c.age >= 60 && !c.spouse; });
  elderly.forEach(function(c) { if (Math.random() < 0.5) G.households.push(createHousehold([c.id])); });

  // 初始化企业
  G.businesses = [];
  var industryKeys = Object.keys(INDUSTRIES);
  var businessCount = 80 + Math.floor(G.population / 5000);
  for (var i = 0; i < businessCount; i++) {
    var ind = weightedPick(industryKeys.map(function(k) {
      var w = { agriculture: 8, food: 6, textile: 5, chemical: 4, steel: 3, machine: 5, electronic: 4, auto: 2, newEnergy: 1, construction: 6, wholesale: 8, transport: 5, hotel: 6, finance: 3, realestate: 3, it: 3, education: 4, medical: 4, culture: 3, public: 5, service: 7, mining: 2 };
      return { v: k, w: w[k] || 3 };
    }));
    G.businesses.push(createBusiness(ind));
  }

  // 分配工作
  assignJobs();

  // 社会指标
  G.society = {
    birthRate: 0.018,
    deathRate: 0.007,
    naturalGrowth: 0.011,
    urbanizationRate: 0.35,
    giniCoefficient: 0.35,
    laborParticipation: 0.75,
    averageWage: 3500,
    medianIncome: 3000,
    povertyRate: 0.08,
    homeOwnership: 0.6,
    averageHousingPrice: 800,
    crimeRate: 0.02,
    divorceRate: 0.05,
    educationAttainment: { 文盲: 0.15, 小学: 0.25, 初中: 0.3, 高中: 0.15, 大专: 0.08, 本科: 0.05, 硕士: 0.015, 博士: 0.005 },
    ageStructure: { '0-14': 0.28, '15-59': 0.62, '60+': 0.10 },
    industryEmployment: { primary: 0.5, secondary: 0.25, tertiary: 0.25 },
    socialSecurityCoverage: 0.4,
    medicalInsuranceCoverage: 0.5,
    pensionCoverage: 0.35
  };

  G.socialLogs = [];
}

// ---------- 工作分配 ----------
function assignJobs() {
  if (!G || !G.citizens || !G.businesses) return;
  var workers = G.citizens.filter(function(c) { return c.age >= 18 && c.age < 60 && c.isAlive; });
  var totalJobs = G.businesses.reduce(function(s, b) { return s + b.employees; }, 0);
  var employed = 0;
  workers.forEach(function(w) {
    if (employed < totalJobs && Math.random() < 0.92) {
      var b = pick(G.businesses);
      w.occupation = b.industryName + '员工';
      w.workplace = b.id;
      w.industry = b.industry;
      w.income = Math.round(b.wageLevel * EDU_INCOME[w.education] * rand(0.8, 1.2));
      w.unemployed = false;
      w.monthsUnemployed = 0;
      employed++;
    } else {
      w.unemployed = true;
      w.occupation = '无业';
      w.workplace = null;
      w.income = 0;
    }
  });
  // 退休人员养老金
  G.citizens.filter(function(c) { return c.age >= 60 && c.isAlive; }).forEach(function(c) {
    c.income = Math.round(1500 * EDU_INCOME[c.education] * 0.5);
    c.retired = true;
  });
}

// ---------- 月度社会更新 ----------
function updateSocietyMonthly() {
  if (!G || !G.citizens) return;
  // 更新人口缩放系数
  if (G.population > 1000) {
    G.popScale = G.population / G.citizens.filter(function(c) { return c.isAlive; }).length;
  }
  var year = G.year, month = G.month;
  var eraFactor = getEraFactor(year);

  // 1. 年龄增长（每年1月）
  if (month === 1) {
    G.citizens.forEach(function(c) {
      if (c.isAlive) {
        c.age++;
        // 教育进度
        if (c.age < 22 && c.educationProgress < 1) {
          c.educationProgress = clamp(c.educationProgress + 0.08 + G.educationIndex / 500, 0, 1);
          if (c.educationProgress >= 1) {
            var idx = EDU_LEVELS.indexOf(c.education);
            if (idx < EDU_LEVELS.length - 1 && Math.random() < 0.4 + G.educationIndex / 200) {
              c.education = EDU_LEVELS[idx + 1];
              c.educationProgress = 0;
            }
          }
        }
        // 退休
        if (c.age === 60 && !c.retired) {
          c.retired = true;
          c.occupation = '退休';
          c.lifeEvents.push(year + '年退休');
        }
        // 健康随年龄下降
        if (c.age > 50) c.health = clamp(c.health - rand(0.5, 2), 0, 100);
        if (c.age > 70) c.health = clamp(c.health - rand(1, 3), 0, 100);
      }
    });
  }

  // 2. 出生与死亡
  var births = 0, deaths = 0;
  G.citizens.forEach(function(c) {
    if (!c.isAlive) return;
    // 死亡概率
    var deathProb = 0.001;
    if (c.age > 60) deathProb += (c.age - 60) * 0.002;
    if (c.age > 80) deathProb += (c.age - 80) * 0.005;
    if (c.health < 30) deathProb += 0.02;
    if (G.pollution > 50) deathProb += G.pollution / 2000;
    if (Math.random() < deathProb / 12) {
      c.isAlive = false;
      deaths++;
      c.lifeEvents.push(year + '年' + month + '月去世，享年' + c.age + '岁');
    }
    // 生育
    if (c.gender === '女' && c.age >= 20 && c.age <= 40 && c.maritalStatus === '已婚' && !c.unemployed) {
      var birthProb = 0.015 * eraFactor.fertility;
      birthProb *= (1 - G.livelihood.housing / 200);
      birthProb *= (1 - c.stress / 200);
      if (year < 2000) birthProb *= 0.5; // 计划生育
      if (year >= 2016) birthProb *= 1.3; // 全面二孩
      if (year >= 2021) birthProb *= 1.1; // 三孩
      if (Math.random() < birthProb / 12) {
        var baby = createCitizen(0, Math.random() < 0.51 ? '男' : '女', '文盲');
        baby.parents = [c.id, c.spouse];
        G.citizens.push(baby);
        c.children.push(baby.id);
        if (c.spouse) {
          var spouse = G.citizens.find(function(x) { return x.id === c.spouse; });
          if (spouse) spouse.children.push(baby.id);
        }
        births++;
        c.lifeEvents.push(year + '年生育');
      }
    }
  });

  // 更新人口
  var scale = G.popScale || 250;
  G.population += Math.round((births - deaths) * scale);
  G.population = Math.max(1000, G.population);
  G.society.birthRate = births / G.citizens.filter(function(c) { return c.isAlive; }).length * 12;
  G.society.deathRate = deaths / G.citizens.filter(function(c) { return c.isAlive; }).length * 12;

  // 3. 企业月度经营
  var totalWages = 0, totalProfit = 0, totalTax = 0, totalPollution = 0;
  G.businesses.forEach(function(b) {
    // 营收增长
    b.revenue *= (1 + b.growthRate / 12 + rand(-0.02, 0.02));
    b.revenue = Math.max(10, b.revenue);
    // 利润
    b.profit = b.revenue * rand(0.03, 0.18);
    // 工资支出
    var wageCost = b.employees * b.wageLevel;
    totalWages += wageCost;
    // 税收
    var tax = Math.max(0, b.profit * b.taxRate + b.revenue * 0.06);
    totalTax += tax;
    // 污染
    totalPollution += b.pollution * b.employees / 100;
    // 招聘/裁员
    if (b.hiring && b.employees < b.maxEmployees && Math.random() < 0.1) {
      b.employees += randInt(1, Math.max(1, Math.floor(b.employees * 0.05)));
    }
    if (b.profit < 0 && Math.random() < 0.05) {
      b.employees = Math.max(1, b.employees - randInt(1, 5));
      b.layoff = true;
    }
    // 企业破产
    if (b.financialHealth < 20 && Math.random() < 0.02) {
      b.bankrupt = true;
    }
    b.financialHealth = clamp(b.financialHealth + (b.profit > 0 ? 1 : -2), 0, 100);
  });
  // 移除破产企业，新增企业
  G.businesses = G.businesses.filter(function(b) { return !b.bankrupt; });
  if (Math.random() < 0.3 && G.businesses.length < 200) {
    G.businesses.push(createBusiness(pick(Object.keys(INDUSTRIES))));
  }

  // 4. 就业市场调整
  var totalJobs = G.businesses.reduce(function(s, b) { return s + b.employees; }, 0);
  var laborForce = G.citizens.filter(function(c) { return c.age >= 18 && c.age < 60 && c.isAlive; }).length;
  var unemploymentRate = clamp(1 - totalJobs / (laborForce * 0.9), 0.02, 0.3);
  G.livelihood.employment = clamp(100 - unemploymentRate * 100, 20, 100);

  // 失业者找工作
  G.citizens.filter(function(c) { return c.unemployed && c.age >= 18 && c.age < 60 && c.isAlive; }).forEach(function(c) {
    c.monthsUnemployed++;
    if (Math.random() < (1 - unemploymentRate) * 0.15) {
      var b = pick(G.businesses);
      c.occupation = b.industryName + '员工';
      c.workplace = b.id;
      c.industry = b.industry;
      c.income = Math.round(b.wageLevel * EDU_INCOME[c.education] * rand(0.8, 1.2));
      c.unemployed = false;
      c.monthsUnemployed = 0;
      c.stress = clamp(c.stress - 10, 0, 100);
    } else {
      c.stress = clamp(c.stress + 2, 0, 100);
      c.happiness = clamp(c.happiness - 1, 0, 100);
    }
  });

  // 5. 工资与收入更新
  var incomes = [];
  G.citizens.filter(function(c) { return c.isAlive && c.income > 0; }).forEach(function(c) {
    if (!c.unemployed && !c.retired) {
      c.income = Math.round(c.income * (1 + rand(-0.01, 0.02)));
    }
    incomes.push(c.income);
  });
  incomes.sort(function(a, b) { return a - b; });
  G.society.averageWage = Math.round(incomes.reduce(function(s, v) { return s + v; }, 0) / Math.max(1, incomes.length));
  G.society.medianIncome = incomes[Math.floor(incomes.length / 2)] || 3000;

  // 6. 健康与医疗
  var totalMedical = 0;
  G.citizens.forEach(function(c) {
    if (!c.isAlive) return;
    // 疾病概率
    var sickProb = 0.02;
    if (c.age > 50) sickProb += (c.age - 50) * 0.003;
    if (G.pollution > 40) sickProb += G.pollution / 1000;
    if (Math.random() < sickProb / 12) {
      var cost = rand(200, c.age > 60 ? 5000 : 1000);
      c.medicalExpense = cost;
      totalMedical += cost;
      c.health = clamp(c.health - rand(2, 10), 0, 100);
      c.stress = clamp(c.stress + 5, 0, 100);
      // 医保报销
      if (Math.random() < G.society.medicalInsuranceCoverage) {
        cost *= 0.3;
      }
      c.savings -= cost;
      if (c.savings < -10000) c.debt += Math.abs(c.savings);
    }
    // 健康恢复
    if (c.health < 100 && Math.random() < 0.1) c.health = clamp(c.health + rand(1, 5), 0, 100);
  });

  // 7. 幸福感更新
  G.citizens.forEach(function(c) {
    if (!c.isAlive) return;
    var h = 50;
    h += (c.income / G.society.averageWage - 1) * 20;
    h += (c.health - 50) * 0.3;
    h -= c.stress * 0.2;
    h += G.livelihood.employment * 0.2;
    h += G.educationIndex * 0.1;
    h += G.medicalIndex * 0.1;
    h -= G.pollution * 0.15;
    h += (c.maritalStatus === '已婚' ? 5 : -3);
    h += c.children.length > 0 ? 3 : 0;
    if (c.unemployed) h -= 15;
    c.happiness = clamp(c.happiness * 0.9 + h * 0.1, 0, 100);
  });

  // 8. 宏观社会指标
  var alive = G.citizens.filter(function(c) { return c.isAlive; });
  G.society.ageStructure = {
    '0-14': alive.filter(function(c) { return c.age <= 14; }).length / alive.length,
    '15-59': alive.filter(function(c) { return c.age >= 15 && c.age <= 59; }).length / alive.length,
    '60+': alive.filter(function(c) { return c.age >= 60; }).length / alive.length
  };
  var eduCount = {};
  alive.filter(function(c) { return c.age >= 25; }).forEach(function(c) { eduCount[c.education] = (eduCount[c.education] || 0) + 1; });
  var eduTotal = alive.filter(function(c) { return c.age >= 25; }).length || 1;
  G.society.educationAttainment = {};
  EDU_LEVELS.forEach(function(e) { G.society.educationAttainment[e] = (eduCount[e] || 0) / eduTotal; });

  // 基尼系数
  var sorted = incomes.slice();
  var n = sorted.length;
  if (n > 10) {
    var mean = sorted.reduce(function(s, v) { return s + v; }, 0) / n;
    var absSum = 0;
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) absSum += Math.abs(sorted[i] - sorted[j]);
    G.society.giniCoefficient = clamp(absSum / (2 * n * n * mean), 0.2, 0.6);
  }

  // 三产就业结构
  var primary = ['agriculture'], secondary = ['mining','food','textile','chemical','steel','machine','electronic','auto','newEnergy','construction'];
  var empCount = { primary: 0, secondary: 0, tertiary: 0 };
  alive.filter(function(c) { return c.industry; }).forEach(function(c) {
    if (primary.indexOf(c.industry) >= 0) empCount.primary++;
    else if (secondary.indexOf(c.industry) >= 0) empCount.secondary++;
    else empCount.tertiary++;
  });
  var empTotal = empCount.primary + empCount.secondary + empCount.tertiary || 1;
  G.society.industryEmployment = {
    primary: empCount.primary / empTotal,
    secondary: empCount.secondary / empTotal,
    tertiary: empCount.tertiary / empTotal
  };

  // 社保覆盖率随年代提升
  G.society.socialSecurityCoverage = clamp(0.3 + (year - 1980) * 0.015, 0.3, 0.95);
  G.society.medicalInsuranceCoverage = clamp(0.4 + (year - 1980) * 0.018, 0.4, 0.98);
  G.society.pensionCoverage = clamp(0.25 + (year - 1980) * 0.016, 0.25, 0.95);
  G.society.urbanizationRate = clamp(0.2 + (year - 1980) * 0.012, 0.2, 0.85);
  G.society.homeOwnership = clamp(0.5 + (year - 1990) * 0.008, 0.5, 0.85);

  // 房价
  G.society.averageHousingPrice = Math.round(500 * Math.pow(1.08, year - 1980) * (1 + G.gdp / 100000));

  // 犯罪率
  G.society.crimeRate = clamp(0.01 + unemploymentRate * 0.1 + G.society.giniCoefficient * 0.05 - G.livelihood.employment / 500, 0.005, 0.08);

  // 全局满意度（市民幸福感均值）
  var avgHappiness = alive.reduce(function(s, c) { return s + c.happiness; }, 0) / alive.length;
  G.satisfaction = clamp(avgHappiness / 100, 0, 1);

  // 记录社会日志
  if (month === 1 || month === 7) {
    G.socialLogs.push({
      year: year, month: month,
      population: G.population,
      gdp: G.gdp,
      happiness: Math.round(avgHappiness),
      unemployment: Math.round(unemploymentRate * 1000) / 10,
      avgWage: G.society.averageWage,
      gini: Math.round(G.society.giniCoefficient * 100) / 100,
      pollution: Math.round(G.pollution)
    });
  }

  return { births: births, deaths: deaths, unemploymentRate: unemploymentRate, avgHappiness: avgHappiness };
}

// ---------- 年代系数 ----------
function getEraFactor(year) {
  if (year < 1990) return { fertility: 1.2, growth: 0.08, wageMult: 0.4, tech: 0.3 };
  if (year < 2000) return { fertility: 0.9, growth: 0.1, wageMult: 0.6, tech: 0.5 };
  if (year < 2010) return { fertility: 0.7, growth: 0.12, wageMult: 0.85, tech: 0.7 };
  if (year < 2020) return { fertility: 0.6, growth: 0.08, wageMult: 1.1, tech: 0.9 };
  return { fertility: 0.5, growth: 0.05, wageMult: 1.3, tech: 1.0 };
}

// ---------- 社会数据摘要（用于AI分析） ----------
function getSocietySummary() {
  if (!G || !G.society) return '社会系统未初始化';
  var s = G.society;
  var alive = G.citizens ? G.citizens.filter(function(c) { return c.isAlive; }) : [];
  var lines = [
    '=== ' + G.cityName + '社会运行报告 ===',
    '时间：' + G.year + '年' + G.month + '月',
    '行政区划：' + (G.rankNames ? G.rankNames[G.rank] : '') + '，城市等级：' + (G.cityLevel || '县'),
    '',
    '【人口】',
    '总人口：' + G.population.toLocaleString() + '人',
    '出生率：' + (s.birthRate * 100).toFixed(2) + '%，死亡率：' + (s.deathRate * 100).toFixed(2) + '%',
    '年龄结构：0-14岁 ' + (s.ageStructure['0-14'] * 100).toFixed(1) + '%，15-59岁 ' + (s.ageStructure['15-59'] * 100).toFixed(1) + '%，60+岁 ' + (s.ageStructure['60+'] * 100).toFixed(1) + '%',
    '城镇化率：' + (s.urbanizationRate * 100).toFixed(1) + '%',
    '',
    '【经济】',
    'GDP：' + (G.gdp / 10000).toFixed(2) + '亿元，财政：' + (G.finance / 10000).toFixed(2) + '亿元',
    '平均工资：' + s.averageWage + '元/月，中位数收入：' + s.medianIncome + '元/月',
    '基尼系数：' + s.giniCoefficient.toFixed(3) + '（' + (s.giniCoefficient > 0.45 ? '差距较大' : s.giniCoefficient > 0.35 ? '中等' : '较均衡') + '）',
    '失业率：' + ((1 - G.livelihood.employment / 100) * 100).toFixed(1) + '%',
    '企业数量：' + (G.businesses ? G.businesses.length : 0) + '家',
    '就业结构：一产 ' + (s.industryEmployment.primary * 100).toFixed(1) + '%，二产 ' + (s.industryEmployment.secondary * 100).toFixed(1) + '%，三产 ' + (s.industryEmployment.tertiary * 100).toFixed(1) + '%',
    '',
    '【民生】',
    '居民满意度：' + (G.satisfaction * 100).toFixed(1) + '%',
    '教育指数：' + G.educationIndex.toFixed(1) + '，医疗指数：' + G.medicalIndex.toFixed(1),
    '社保覆盖率：' + (s.socialSecurityCoverage * 100).toFixed(1) + '%，医保覆盖率：' + (s.medicalInsuranceCoverage * 100).toFixed(1) + '%，养老覆盖率：' + (s.pensionCoverage * 100).toFixed(1) + '%',
    '房价：' + s.averageHousingPrice + '元/平，自有住房率：' + (s.homeOwnership * 100).toFixed(1) + '%',
    '犯罪率：' + (s.crimeRate * 100).toFixed(2) + '%',
    '',
    '【环境】',
    '污染指数：' + G.pollution.toFixed(1) + '（' + (G.pollution > 60 ? '重度污染' : G.pollution > 40 ? '中度污染' : G.pollution > 20 ? '轻度污染' : '优良') + '）',
    '耕地比例：' + (G.farmland / 2500 * 100).toFixed(1) + '%',
    '',
    '【政治】',
    '上级评价：' + (G.superiorEval * 100).toFixed(1) + '%，廉政风险：' + (G.personal ? G.personal.corruptionRisk : 0).toFixed(1) + '%',
    '债务：' + (G.debts ? G.debts.length : 0) + '笔',
    '',
    '【抽样市民画像】（' + alive.length + '个样本Agent）',
  ];
  // 抽样几个典型市民
  var samples = alive.filter(function(c) { return c.age >= 25 && c.age <= 60; }).slice(0, 5);
  samples.forEach(function(c) {
    lines.push('- ' + c.name + '，' + c.age + '岁，' + c.education + '，' + c.occupation + '，月收入' + c.income + '元，健康' + c.health.toFixed(0) + '，幸福' + c.happiness.toFixed(0) + (c.unemployed ? '，【失业中】' : ''));
  });
  return lines.join('\n');
}

// ---------- DeepSeek AI 分析 ----------
var DEEPSEEK_API_KEY = '';
var DEEPSEEK_API_URL = 'https://api.deepseek.com/chat/completions';

function setDeepSeekKey(key) {
  DEEPSEEK_API_KEY = key;
  try { localStorage.setItem('deepseek_api_key', key); } catch(e) {}
}

function loadDeepSeekKey() {
  try {
    DEEPSEEK_API_KEY = localStorage.getItem('deepseek_api_key') || '';
  } catch(e) { DEEPSEEK_API_KEY = ''; }
  return DEEPSEEK_API_KEY;
}

function analyzeSocietyWithAI(callback) {
  if (!DEEPSEEK_API_KEY) {
    callback({ error: '请先在设置中配置DeepSeek API Key' });
    return;
  }
  var summary = getSocietySummary();
  var prompt = '你是一位资深的社会治理顾问和公共政策专家。请根据以下城市社会运行数据，进行深入分析并给出治理建议。\n\n' + summary + '\n\n请从以下维度分析：\n1. 社会运行总体评价（优势与风险）\n2. 人口结构与发展趋势判断\n3. 经济产业结构问题与升级方向\n4. 民生短板与政策建议\n5. 环境与可持续发展\n6. 具体可操作的3-5条政策建议\n\n要求：分析要有数据支撑，建议要具体可执行，语言专业但易懂。';

  fetch(DEEPSEEK_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DEEPSEEK_API_KEY },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [
        { role: 'system', content: '你是中国基层治理专家，熟悉公共政策、社会学、经济学。分析要客观、专业、有数据支撑，建议要具体可操作。' },
        { role: 'user', content: prompt }
      ],
      temperature: 0.7,
      max_tokens: 3000
    })
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.choices && data.choices[0]) {
        callback({ result: data.choices[0].message.content, usage: data.usage });
      } else {
        callback({ error: JSON.stringify(data) });
      }
    })
    .catch(function(e) { callback({ error: 'API请求失败: ' + e.message }); });
}
