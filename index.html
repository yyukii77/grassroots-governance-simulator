function upgradeBuilding(x,y){var key=x+','+y;var bd=G.buildingData[key];if(!bd)return;var type=G.grid[y]?.[x];if(!type)return;if(bd.level>=5){addLog('升级','已达最高等级','warn');return;}var nextCost=getBuildingCost(type,bd.level+1);if(nextCost>G.finance){addLog('升级','财政不足，需要'+fmtMoney(nextCost),'warn');return;}G.finance-=nextCost;bd.level++;bd.cost+=nextCost;addLog('升级','⬆ ('+x+','+y+') 升级至Lv'+bd.level+'，花费'+fmtMoney(nextCost),'success');closeModal();markPollutionDirty();renderAll();}

var examQuestions=[];var examAnswers=[];var examCurrent=0;
function generateExamQuestions(){var qs=[];qs.push({q:'我国的根本政治制度是？',opts:['人民代表大会制度','中国共产党领导的多党合作制','民族区域自治制度','基层群众自治制度'],ans:0});qs.push({q:'《宪法》规定，中华人民共和国的一切权力属于？',opts:['人民','中国共产党','全国人大','国务院'],ans:0});qs.push({q:'社会主义市场经济体制中，市场在资源配置中起？',opts:['决定性作用','基础性作用','辅助性作用','主导性作用'],ans:0});qs.push({q:'我国耕地红线约为？',opts:['13%','18%','20%','25%'],ans:0});qs.push({q:'以下哪个是我国的货币政策工具？',opts:['存款准备金率','财政支出','税收政策','国债发行'],ans:0});qs.push({q:'填入最恰当的一项：科技创新是____发展的核心驱动力。',opts:['经济','社会','文化','生态'],ans:0});qs.push({q:'下列词语中，没有错别字的是？',opts:['呕心沥血','直接了当','金榜提名','走头无路'],ans:0});qs.push({q:'“不积跬步，无以至千里”强调的是？',opts:['量变引起质变','质变是量变的前提','事物是发展的','矛盾是普遍的'],ans:0});qs.push({q:'某城市GDP年均增长8%，5年后GDP约为原来的？',opts:['1.47倍','1.40倍','1.50倍','1.60倍'],ans:0});qs.push({q:'某项目投资1亿元，年回报率6%，5年后本利和约为？',opts:['1.34亿','1.30亿','1.38亿','1.42亿'],ans:0});qs.push({q:'所有公务员都是党员，有些党员是干部，因此？',opts:['有些公务员是干部','所有干部是公务员','有些干部是公务员','以上都不是'],ans:2});qs.push({q:'与“书籍：阅读”关系最相似的是？',opts:['电影：观看','食物：品尝','音乐：欣赏','以上都是'],ans:3});qs.push({q:'如果“GDP增长→就业增加”，那么“就业不增加”意味着？',opts:['GDP不增长','GDP增长','GDP可能增长','无法判断'],ans:2});qs.push({q:'某市2023年GDP为800亿，2024年为920亿，增长率为？',opts:['15%','12%','10%','18%'],ans:0});qs.push({q:'某企业营收从5亿增长到7亿，增长了多少？',opts:['40%','30%','20%','50%'],ans:0});return qs;}
function openExamModal(){
  if(G.personal.deposit<0.005){showModal('学历考试','<div style="color:#e74c5e;">存款不足50元，无法参加考试。</div>',[{text:'关闭',class:'',action:closeModal}]);return;}
  var maxEdu = getMaxEducationByYear(G.year);
  var eraInfo = getEducationEraInfo(G.year);
  if (G.personal.education === maxEdu && maxEdu !== '博士') {
    showModal('学历考试','<div style="text-align:center;padding:20px;"><div style="font-size:36px;margin-bottom:12px;">🎓</div><div style="font-size:16px;font-weight:600;margin-bottom:8px;">当前年代最高学历为'+maxEdu+'</div><div style="font-size:13px;color:#8e8e93;line-height:1.8;">'+eraInfo+'<br><br>请推进时间到更高年代后再考</div></div>',[{text:'关闭',class:'',action:closeModal}]);
    return;
  }
  examQuestions=generateExamQuestions();examAnswers=new Array(examQuestions.length).fill(-1);examCurrent=0;showModal('学历考试','<div id="examContainer"></div>',[{text:'提交考试',class:'primary',action:submitExam}]);renderExamQuestion();}
function renderExamQuestion(){var container=document.getElementById('examContainer');if(!container)return;var q=examQuestions[examCurrent];var total=examQuestions.length;var html='<div style="margin-bottom:12px;color:#8e8e93;font-size:14px;font-weight:500;">第 '+(examCurrent+1)+'/'+total+' 题</div>';html+='<div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #e5e5ea;"><div style="font-size:16px;font-weight:600;color:#1c1c1e;line-height:1.5;margin-bottom:14px;">'+q.q+'</div><div style="display:flex;flex-direction:column;gap:8px;">';q.opts.forEach(function(opt,idx){var checked=examAnswers[examCurrent]===idx;var bgColor=checked?'#007aff':'#f2f2f7';var textColor=checked?'#fff':'#1c1c1e';var borderColor=checked?'#007aff':'#e5e5ea';html+='<div onclick="examAnswers['+examCurrent+']='+idx+';renderExamQuestion();" style="padding:12px 16px;border-radius:10px;background:'+bgColor+';color:'+textColor+';border:1px solid '+borderColor+';font-size:14px;cursor:pointer;transition:all 0.2s;">'+String.fromCharCode(65+idx)+'. '+opt+'</div>';});html+='</div></div>';html+='<div style="display:flex;gap:10px;margin-bottom:12px;"><button onclick="examPrev()" '+(examCurrent===0?'disabled style="flex:1;padding:12px;background:#f2f2f7;color:#8e8e93;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:not-allowed;"':'style="flex:1;padding:12px;background:#f2f2f7;color:#007aff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;"')+'>上一题</button><button onclick="examNext()" '+(examCurrent>=total-1?'disabled style="flex:1;padding:12px;background:#f2f2f7;color:#8e8e93;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:not-allowed;"':'style="flex:1;padding:12px;background:#007aff;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;"')+'>下一题</button></div>';html+='<div style="height:6px;background:#e5e5ea;border-radius:3px;overflow:hidden;"><div style="height:100%;background:#007aff;border-radius:3px;transition:width 0.3s;width:'+((examCurrent+1)/total*100)+'%;"></div></div>';container.innerHTML=html;}
function examPrev(){if(examCurrent>0){examCurrent--;renderExamQuestion();}}
function examNext(){if(examCurrent<examQuestions.length-1){examCurrent++;renderExamQuestion();}}
function submitExam(){var unanswered=examAnswers.some(function(a){return a===-1;});if(unanswered){showModal('提示','还有题目未作答，请完成所有题目。',[{text:'继续答题',class:'',action:closeModal}]);return;}var score=0;examQuestions.forEach(function(q,i){if(examAnswers[i]===q.ans)score++;});var total=examQuestions.length;var pct=Math.round((score/total)*100);G.personal.deposit-=0.005;var edu=G.personal.education;var ability=G.personal.ability;var salary=G.personal.salary;var passed=false;var maxEdu = getMaxEducationByYear(G.year);
  var eduOrder = ['大专','本科','硕士','博士'];
  var maxIdx = eduOrder.indexOf(maxEdu);
  if(pct>=95 && maxIdx>=3){edu='博士';ability=25;salary=calculateSalary(G.rank,G.year)*1.5/10000;passed=true;}
  else if(pct>=85 && maxIdx>=2){edu='硕士';ability=15;salary=calculateSalary(G.rank,G.year)*1.3/10000;passed=true;}
  else if(pct>=75 && maxIdx>=1){edu='本科';ability=5;salary=calculateSalary(G.rank,G.year)*1.1/10000;passed=true;}
  else if(pct>=60 && maxIdx>=0){edu='大专';ability=0;salary=calculateSalary(G.rank,G.year)/10000;passed=true;}
  else if(pct>=60){edu=maxEdu;ability=[0,5,15,25][maxIdx];salary=calculateSalary(G.rank,G.year)*[1,1.1,1.3,1.5][maxIdx]/10000;passed=true;}else{passed=false;}if(passed&&edu!==G.personal.education){G.personal.education=edu;G.personal.ability=ability;G.personal.salary=salary;G.personal.eduScore=pct;addLog('考试','🎓 通过学历考试，获得'+edu+'学历！','success');showModal('考试结果','<div class="exam-result"><div class="score">'+pct+'分</div><div class="grade"> 获得 '+edu+' 学历！</div><div style="margin-top:8px;color:rgba(255,255,255,0.6);">执政能力 +'+ability+'，月工资 '+fmtMoney(salary)+'</div></div>',[{text:'太好了',class:'primary',action:closeModal}]);}else if(passed){showModal('考试结果','<div class="exam-result"><div class="score">'+pct+'分</div><div class="grade">已通过，当前学历 '+G.personal.education+'</div></div>',[{text:'知道了',class:'',action:closeModal}]);}else{showModal('考试结果','<div class="exam-result"><div class="score" style="color:#e74c5e;">'+pct+'分</div><div class="grade">未通过，3个月后可重考</div><div style="margin-top:8px;color:rgba(255,255,255,0.6);">需要60分以上</div></div>',[{text:'继续努力',class:'',action:closeModal}]);}renderAll();}

function archiveCurrentCity(){

  // 记录玩家任期结束
  var lastTerm=cityArchive.terms[cityArchive.terms.length-1];
  if(lastTerm&&lastTerm.type==='player'&&!lastTerm.endYear){
    lastTerm.endYear=G.year;lastTerm.endMonth=G.month;lastTerm.endRank=G.rank;lastTerm.evalAtEnd=G.superiorEval;
  }
  cityArchive.endYear=G.year;cityArchive.endMonth=G.month;
  cityArchive.playerTermYears=G.termYears;
  cityArchive.rankWhenLeft=G.rank;
  cityArchive.isActive=false;
  // 更新快照（供AI代理使用）
  cityArchive.snapshot.grid=G.grid?G.grid.map(function(row){return row.slice();}):[];
  cityArchive.snapshot.buildingCount=G.buildingData?Object.keys(G.buildingData).length:0;
  cityArchive.snapshot.businessCount=G.businesses?G.businesses.length:0;
  cityArchive.snapshot.housing=G.housing?JSON.parse(JSON.stringify(G.housing)):{};
  cityArchive.snapshot.pollution=G.pollution;cityArchive.snapshot.satisfaction=G.satisfaction;
  cityArchive.snapshot.finance=G.finance;cityArchive.snapshot.gdp=G.gdp;cityArchive.snapshot.population=G.population;
  cityArchive.snapshot.capitalStock=G.gdp*2;cityArchive.snapshot.labor=Math.round(G.population*0.6);
  cityArchive.snapshot.technology=1.0+(G.educationIndex||30)/100;
  // 分配AI代理
  cityArchive.aiGovernor={
    strategy:['balanced','gdp','livelihood','stable','aggressive'][Math.floor(Math.random()*5)],
    decisions:[],performance:G.satisfaction,ability:0.4+Math.random()*0.4
  };
  // 添加里程碑
  cityArchive.milestones.push({year:G.year,month:G.month,text:'晋升调任，AI代理接管',type:'promotion'});
  if(!G.career)G.career={cities:[],achievements:[],totalTermYears:0,reputation:0};
  G.career.totalTermYears+=G.termYears;

}

function simulateCityMonth(cityArchive){
  var s=cityArchive.snapshot;
  var ai=cityArchive.aiGovernor;
  var hist=cityArchive.history;
  // 兼容新旧history格式
  var lastRec=hist.length>0&&typeof hist[hist.length-1]==='object'?hist[hist.length-1]:null;
  var lastGDP=lastRec?lastRec.gdp:(hist.gdp?hist.gdp[hist.gdp.length-1]:s.gdp);
  var lastPop=lastRec?lastRec.population:(hist.population?hist.population[hist.population.length-1]:s.population);
  var lastSat=lastRec?lastRec.satisfaction:(hist.satisfaction?hist.satisfaction[hist.satisfaction.length-1]:s.satisfaction);
  var lastPoll=lastRec?lastRec.pollution:(hist.pollution?hist.pollution[hist.pollution.length-1]:s.pollution);
  var lastFin=lastRec?lastRec.finance:(hist.finance?hist.finance[hist.finance.length-1]:s.finance);
  if(lastFin===undefined)lastFin=s.finance;

  // 城市级别基准增长率
  var baseGrowth=[0.004,0.006,0.008,0.006][cityArchive.level]||0.005;
  // AI能力影响
  var aiBonus=(ai.ability-0.5)*0.004;
  // 资本积累
  s.capitalStock*=(1+0.008);
  // 技术进步
  s.technology*=(1+0.003);
  // GDP增长（索洛模型简化）
  var gdpGrowth=baseGrowth+aiBonus+0.002*(s.technology-1)-0.001*(lastPoll/50);
  gdpGrowth=Math.max(-0.02,Math.min(0.03,gdpGrowth+(Math.random()-0.5)*0.004));
  var newGDP=Math.max(100,lastGDP*(1+gdpGrowth));

  // 人口变动
  var age60=s.ageStructure&&s.ageStructure['60+']?s.ageStructure['60+']:0.1;
  var birthRate=0.012*(1-age60*0.5);
  var deathRate=0.007*(1+age60*0.8);
  // 人口迁移：比全国平均满意度高则吸引人口
  var avgSat=G.nation.avgSatisfaction||0.5;
  var netMigration=(lastSat-avgSat)*lastPop*0.002;
  var newPop=Math.max(1000,lastPop+lastPop*(birthRate-deathRate)/12+netMigration/12);
  s.labor=Math.round(newPop*0.6);

  // 老龄化缓慢推进
  if(s.ageStructure){
    s.ageStructure['60+']=Math.min(0.35,s.ageStructure['60+']+0.0002);
    s.ageStructure['15-59']=Math.max(0.45,s.ageStructure['15-59']-0.0001);
    s.ageStructure['0-14']=1-s.ageStructure['60+']-s.ageStructure['15-59'];
  }

  // 财政收支
  var taxRate=0.12+cityArchive.level*0.01;
  var revenue=newGDP*taxRate/12;
  var expenditure=newGDP*0.1/12+lastPop*0.0005;
  var newFinance=lastFin+revenue-expenditure;

  // AI代理决策（简化）
  var decision='维持';
  if(newFinance>newGDP*0.05&&lastSat<0.5){decision='民生投入';lastSat=Math.min(1,lastSat+0.003);newFinance-=newGDP*0.02;}
  else if(gdpGrowth<0.005){decision='基建招商';newGDP*=1.002;newFinance-=newGDP*0.015;lastPoll=Math.min(100,lastPoll+0.2);}
  else if(lastPoll>55){decision='环保治理';lastPoll=Math.max(0,lastPoll-0.5);newFinance-=newGDP*0.01;}
  ai.decisions.push({year:G.year,month:G.month,action:decision});
  if(ai.decisions.length>24)ai.decisions.shift();

  // 满意度变化
  var satChange=0.001*(gdpGrowth*100)-0.002*(lastPoll/50)+0.001*(newFinance>0?1:-1);
  var newSat=clamp(lastSat+satChange+(Math.random()-0.5)*0.005,0.1,0.95);

  // 污染变化
  var newPoll=clamp(lastPoll+(gdpGrowth>0.006?0.1:-0.05)+(Math.random()-0.5)*0.2,0,100);

  // 记录（每年记录一次，减少数据量）
  if(G.month===12||hist.length===0||typeof hist[0]!=='object'){
    hist.push({year:G.year,month:G.month,population:Math.round(newPop),gdp:Math.round(newGDP),satisfaction:Math.round(newSat*1000)/1000,pollution:Math.round(newPoll*10)/10,finance:Math.round(newFinance),eval:ai.performance,education:lastRec?lastRec.education:30,medical:lastRec?lastRec.medical:25,employment:lastRec?lastRec.employment:60,rank:cityArchive.rankWhenLeft});
  }

  // 更新快照
  s.gdp=newGDP;s.population=newPop;s.satisfaction=newSat;s.pollution=newPoll;s.finance=newFinance;
  cityArchive.lastUpdateYear=G.year;
  cityArchive.lastUpdateMonth=G.month;
  ai.performance=Math.round((ai.performance*0.95+newSat*0.05)*100)/100;
}

function updateNationStats(){
  if(!G.nation||!G.nation.cities)return;
  var totalGDP=G.gdp,totalPop=G.population,totalSat=G.satisfaction,count=1;
  G.nation.cities.forEach(function(c){
    if(c.isActive)return;
    var last=c.history.length>0?c.history[c.history.length-1]:null;
    if(last&&typeof last==='object'){
      totalGDP+=last.gdp||0;totalPop+=last.population||0;totalSat+=last.satisfaction||0;count++;
    }else if(c.history.gdp&&c.history.gdp.length>0){
      var idx=c.history.gdp.length-1;
      totalGDP+=c.history.gdp[idx]||0;totalPop+=c.history.population[idx]||0;totalSat+=c.history.satisfaction[idx]||0;count++;
    }
  });
  G.nation.totalGDP=Math.round(totalGDP);
  G.nation.totalPopulation=Math.round(totalPop);
  G.nation.avgSatisfaction=Math.round(totalSat/count*1000)/1000;
  G.nation.eraYear=G.year;
  // 全国政治稳定指数
  var avgPoll=G.pollution;
  G.nation.cities.forEach(function(c){
    if(c.isActive)return;
    var last=c.history.length>0?c.history[c.history.length-1]:null;

function reportToSuperior(topic){

  var score=0;
  if(topic==='gdp'){score=Math.min(10,G.gdp/20000);}
  else if(topic==='livelihood'){score=G.satisfaction*10;}
  else if(topic==='environment'){score=(100-G.pollution)/10;}
  else if(topic==='stability'){score=(G.securityIndex||50)/10;}
  else if(topic==='loyalty'){score=5+G.personal.ability*0.5;}

  s.trust=Math.min(100,s.trust+score/10);
  s.relation=Math.min(100,s.relation+score/20);
  G.superiorEval=Math.min(1,G.superiorEval+score/200);
  G.personal.stress=Math.min(100,(G.personal.stress||0)+3);

  if(score>0.7){
    s.trust=Math.min(100,s.trust+5);
    s.politicalCapital=(s.politicalCapital||0)+1;
    G.superiorEval=Math.min(1,G.superiorEval+0.03);
    addLog('上级','上级巡视高度评价，政治资本+1，信任+5','success');
  }else if(score<0.4){
    s.trust=Math.max(0,s.trust-8);
    G.superiorEval=Math.max(0,G.superiorEval-0.05);
    addLog('上级','巡视组认为政绩平平，信任-8','warn');
  }else{
    s.trust=Math.min(100,s.trust+2);
    addLog('上级','上级巡视，评价一般，信任+2','info');
  }
}

function assignSuperiorTask(){

function checkSuperiorTask(){
  var s=G.relationships.superior;
  var t=s.currentTask;
  if(!t)return;
  t.deadline--;
  var current=t.type==='gdp'?G.gdp:t.type==='pollution'?G.pollution:t.type==='satisfaction'?G.satisfaction:G.population;
  var done=(t.type==='pollution')?(current<=t.target):(current>=t.target);
  if(done){
    s.politicalCapital=(s.politicalCapital||0)+t.reward;
    s.trust=Math.min(100,s.trust+5);
    G.superiorEval=Math.min(1,G.superiorEval+0.02);
    addLog('上级','完成上级任务【'+t.name+'】，政治资本+'+t.reward+'，信任+5','success');
    s.currentTask=null;
  }else if(t.deadline<=0){
    s.trust=Math.max(0,s.trust-5);
    G.superiorEval=Math.max(0,G.superiorEval-0.03);
    addLog('上级','上级任务【'+t.name+'】未按时完成，信任-5','warn');
    s.currentTask=null;
  }
}

function updatePublicOpinion(){
  if(!G.publicOpinion)return;
  var po=G.publicOpinion;
  // 各话题舆论基于社会指标
  po.topics.economy=clamp(0.5+(G.gdp-50000)/100000*0.3,0,1);
  po.topics.environment=clamp(0.5+(50-G.pollution)/100,0,1);
  po.topics.education=clamp(0.3+(G.educationIndex||30)/100,0,1);
  po.topics.medical=clamp(0.3+(G.medicalIndex||25)/100,0,1);
  po.topics.housing=clamp(0.5+(G.livelihood.housing-30)/100,0,1);
  po.topics.corruption=clamp(0.7-(G.personal.corruptionRisk||0)/200,0,1);
  po.topics.publicSafety=clamp(0.5+(G.securityIndex||50)/200,0,1);
  // 整体舆论 = 各话题加权平均
  var weights={economy:0.2,environment:0.15,education:0.15,medical:0.15,housing:0.15,corruption:0.1,publicSafety:0.1};
  var total=0,weightSum=0;
  for(var k in weights){total+=(po.topics[k]||0.5)*weights[k];weightSum+=weights[k];}
  po.overall=clamp(po.overall*0.8+(total/weightSum)*0.2,0,1);
  // 媒体传播影响（简化：自媒体偏负面会拉低舆论）
  po.media.forEach(function(m){
    if(m.type==='social'&&Math.random()<0.05){
      po.overall=clamp(po.overall+m.bias*0.02,0,1);
    }
  });
  // 舆论影响满意度和上级评价
  G.satisfaction=clamp(G.satisfaction*0.95+po.overall*0.05,0,1);
  if(po.overall<0.3){G.superiorEval=Math.max(0,G.superiorEval-0.005);}
  else if(po.overall>0.7){G.superiorEval=Math.min(1,G.superiorEval+0.002);}
}

// ========== 法治与司法系统 ==========
function generateCrime(){
  if(!G.justice)return;
  var j=G.justice;
  // 犯罪率受失业率、贫富差距、满意度影响
  var baseRate=0.015;
  var unempFactor=(1-G.livelihood.employment/100)*0.5;
  var giniFactor=(G.giniCoefficient||0.35-0.3)*2;
  var satFactor=(0.6-G.satisfaction)*0.3;
  var crimeProb=baseRate+unempFactor+giniFactor+satFactor;
  crimeProb=Math.max(0.005,Math.min(0.08,crimeProb));
  j.crimeRate=crimeProb;
  if(Math.random()<crimeProb*3){
    var types=['盗窃','诈骗','斗殴','经济犯罪','寻衅滋事'];
    var type=types[Math.floor(Math.random()*types.length)];
    var severity=0.2+Math.random()*0.6;
    var newCase={
      id:'CASE'+Date.now()+Math.floor(Math.random()*1000),
      type:type,
      status:'侦查中',
      severity:severity,
      year:G.year,
      month:G.month,
      publicAttention:severity*0.8+Math.random()*0.2,
      monthsInvestigating:0
    };
    j.cases.push(newCase);
    j.totalCases++;
    G.satisfaction=clamp(G.satisfaction-0.002*severity,0,1);
    G.securityIndex=clamp((G.securityIndex||50)-severity*2,0,100);
    if(severity>0.7){
      addLog('法治','发生'+type+'案件（严重程度'+(severity*100).toFixed(0)+'%），治安指数下降','warn');
    }
  }
}

function investigateCases(){
  if(!G.justice)return;
  var j=G.justice;
  var policeEffort=0.3+j.policeBudget/100;
  var techFactor=(G.educationIndex||30)/100;
  j.cases.forEach(function(cs){
    if(cs.status!=='侦查中')return;
    cs.monthsInvestigating++;
    var successProb=Math.min(0.4,policeEffort*0.3+techFactor*0.2);
    if(cs.monthsInvestigating>6)successProb*=0.5;
    if(Math.random()<successProb){
      cs.status='已破案';
      cs.clearedMonth=G.month;
      j.clearedCases++;
      j.clearanceRate=j.clearedCases/Math.max(1,j.totalCases);
      G.securityIndex=clamp((G.securityIndex||50)+1,0,100);
      if(cs.severity>0.5){
        addLog('法治','案件'+cs.id+'（'+cs.type+'）告破，治安指数+1','success');
      }
    }
  });
  // 清理超过24个月的旧案件
  j.cases=j.cases.filter(function(cs){return cs.monthsInvestigating<24||cs.status==='已破案';});
  if(j.cases.length>50)j.cases=j.cases.slice(-50);
}

function updateJudicialTrust(){
  if(!G.justice)return;
  var j=G.justice;
  // 司法信任受破案率、犯罪率、满意度影响
  var target=0.3+j.clearanceRate*0.4+(1-j.crimeRate*20)*0.2+G.satisfaction*0.1;
  target=clamp(target,0,1);
  j.judicialTrust=j.judicialTrust*0.9+target*0.1;
  // 司法信任影响满意度
  G.satisfaction=clamp(G.satisfaction+(j.judicialTrust-0.5)*0.005,0,1);
}

// ========== 阶层与流动性系统 ==========
var CLASS_ORDER=['底层','工薪','中产','富裕'];

function getCitizenClass(citizen){
  if(!citizen||!citizen.isAlive)return null;
  var income=citizen.income||0;
  var savings=citizen.savings||0;
  var score=income*12+savings*0.1;
  var avgW=G.society.averageWage||45;
  if(score>avgW*12*8)return '富裕';
  if(score>avgW*12*3)return '中产';
  if(score>avgW*12*0.8)return '工薪';
  return '底层';
}

function updateSocialClasses(){
  if(!G.citizens||!G.socialMobility)return;
  var sm=G.socialMobility;
  var dist={bottom:0,working:0,middle:0,rich:0};
  var moves=0;
  G.citizens.forEach(function(c){
    if(!c.isAlive||c.age<18)return;
    var newClass=getCitizenClass(c);
    var oldClass=c.socialClass||'工薪';
    if(newClass!==oldClass){
      if(!c.classHistory)c.classHistory=[];
      c.classHistory.push({year:G.year,from:oldClass,to:newClass});
      c.socialClass=newClass;
      moves++;
    }else{
      c.socialClass=newClass;
    }
    if(newClass==='底层')dist.bottom++;
    else if(newClass==='工薪')dist.working++;
    else if(newClass==='中产')dist.middle++;
    else dist.rich++;
  });
  sm.classDistribution=dist;
  var total=dist.bottom+dist.working+dist.middle+dist.rich;
  sm.mobilityRate=total>0?moves/total:0;
}

function applyMobilityPolicy(){
  if(!G.socialMobility)return;
  var sm=G.socialMobility;
  // 教育公平：底层子女教育加成
  if(sm.educationFairness>0.5){
    G.citizens.filter(function(c){return c.isAlive&&c.age<22&&c.socialClass==='底层';}).forEach(function(c){
      c.educationProgress=(c.educationProgress||0)+0.005*sm.educationFairness;
    });
  }
  // 扶贫：底层收入补贴
  if(sm.povertyAlleviation){
    G.citizens.filter(function(c){return c.isAlive&&c.socialClass==='底层'&&c.age>=18;}).forEach(function(c){
      c.income=Math.round((c.income||0)*1.05);
    });
  }
}

function toggleEducationFairness(){
  if(!G.socialMobility)return;
  var sm=G.socialMobility;
  sm.educationFairness=sm.educationFairness>0.5?0.3:0.7;
  G.finance-=sm.educationFairness>0.5?20:0;
  addLog('阶层','教育公平政策'+(sm.educationFairness>0.5?'启动（-20万/年）':'关闭'),sm.educationFairness>0.5?'success':'info');
}

function togglePovertyAlleviation(){
  if(!G.socialMobility)return;
  var sm=G.socialMobility;
  sm.povertyAlleviation=!sm.povertyAlleviation;
  G.finance-=sm.povertyAlleviation?30:0;
  addLog('阶层','扶贫政策'+(sm.povertyAlleviation?'启动（-30万/年）':'关闭'),sm.povertyAlleviation?'success':'info');
}

function showClassPanel(){
  var sm=G.socialMobility;
  if(!sm)return;
  var d=sm.classDistribution;
  var total=d.bottom+d.working+d.middle+d.rich;
  var html='<div style="font-size:13px;line-height:1.8;">';
  html+='<div style="background:linear-gradient(135deg,#007aff,#5ac8fa);border-radius:12px;padding:14px;margin-bottom:10px;color:#fff;">';
  html+='<div style="font-size:16px;font-weight:700;">社会阶层结构</div>';
  html+='<div style="font-size:12px;opacity:0.9;margin-top:2px;">阶层流动率：'+(sm.mobilityRate*100).toFixed(1)+'%/月</div>';
  html+='</div>';
  html+='<div style="background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;">';
  var classes=[['rich','富裕','#ff9500'],['middle','中产','#007aff'],['working','工薪','#34c759'],['bottom','底层','#8e8e93']];
  classes.forEach(function(cls){
    var count=d[cls[0]]||0;
    var pct=total>0?(count/total*100):0;
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;"><span style="font-weight:600;color:'+cls[2]+';">'+cls[1]+'</span><div style="flex:1;margin:0 10px;height:8px;background:#e5e5ea;border-radius:4px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:'+cls[2]+';"></div></div><strong style="min-width:50px;text-align:right;">'+count+'人（'+pct.toFixed(0)+'%）</strong></div>';
  });
  html+='</div>';
  html+='<div style="background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;">';
  html+='<div style="font-weight:600;margin-bottom:8px;">阶层流动政策</div>';
  html+='<button onclick="toggleEducationFairness();closeModal();" style="width:100%;padding:10px;margin-bottom:6px;border:none;border-radius:8px;background:'+(sm.educationFairness>0.5?'#34c759':'#f2f2f7')+';color:'+(sm.educationFairness>0.5?'#fff':'#007aff')+';font-size:13px;cursor:pointer;">教育公平（'+(sm.educationFairness>0.5?'已启动':'未启动')+'）</button>';
  html+='<button onclick="togglePovertyAlleviation();closeModal();" style="width:100%;padding:10px;border:none;border-radius:8px;background:'+(sm.povertyAlleviation?'#34c759':'#f2f2f7')+';color:'+(sm.povertyAlleviation?'#fff':'#007aff')+';font-size:13px;cursor:pointer;">扶贫政策（'+(sm.povertyAlleviation?'已启动':'未启动')+'）</button>';
  html+='</div>';
  html+='<div style="font-size:11px;color:#8e8e93;">阶层由收入和储蓄综合判定，教育水平影响向上流动概率</div>';
  html+='</div>';
  showModal('阶层流动',html,[{text:'关闭',action:closeModal}]);
}

function updateRelationships(){var rel=G.relationships;rel.superior.relation=Math.max(0,rel.superior.relation-2);rel.superior.trust=Math.max(0,rel.superior.trust-1);rel.superior2.relation=Math.max(0,rel.superior2.relation-3);rel.colleagues.forEach(function(c){c.relation=Math.max(0,c.relation-2);c.trust=Math.max(0,c.trust-1);});rel.subordinates.forEach(function(s){s.relation=Math.max(0,s.relation-1);if(s.loyal)s.trust=Math.min(100,s.trust+1);});if(G.superiorEval>0.7){rel.superior.relation=Math.min(100,rel.superior.relation+3);rel.superior.trust=Math.min(100,rel.superior.trust+2);}if(G.personal.corruptionRisk>50){rel.colleagues.forEach(function(c){if(Math.random()<0.3)c.hostile=true;});}}
function updateTaxPolicy(){var tp=G.taxPolicy;if(G.year>=1994&&!tp.taxSharingReform){tp.taxSharingReform=true;tp.valueAddedTax=true;addLog('政策',' 1994年分税制改革：增值税开征，中央财政集权，地方财政压力增大。','event');}if(G.year>=2006&&tp.agriculturalTax){tp.agriculturalTax=false;addLog('政策',' 2006年取消农业税：延续2600年的农业税正式退出历史舞台，农民负担减轻。','event');G.satisfaction=Math.min(1,G.satisfaction+0.05);}if(G.year>=2016&&tp.businessTax){tp.businessTax=false;addLog('政策',' 2016年全面营改增：营业税退出历史舞台，增值税覆盖全行业，减税效应明显。','event');}if(G.year>=2011&&!tp.propertyTax&&G.rank>=3){tp.propertyTax=true;addLog('政策',' 房产税试点启动：部分城市开始征收房产税，房地产市场调控加强。','event');}}

function triggerRandomEvent(){
  if(!G.eventState.eventCounts)G.eventState.eventCounts={};
  if(G.eventState.eventCooldown>0){G.eventState.eventCooldown--;return;}
  if(Math.random()>0.4)return;
  var available=randomEvents.filter(function(e){
    if(e.condition&&!e.condition())return false;
    return (G.eventState.eventCounts[e.id]||0)<3;
  });
  if(available.length===0)return;
  var totalProb=available.reduce(function(s,e){return s+e.probability;},0);
  var randVal=Math.random()*totalProb;
  var selected=available[0];
  for(var i=0;i<available.length;i++){randVal-=available[i].probability;if(randVal<=0){selected=available[i];break;}}
  G.eventState.eventCooldown=3;
  G.eventState.lastEventYear=G.year;
  G.eventState.eventCounts[selected.id]=(G.eventState.eventCounts[selected.id]||0)+1;G.currentEvent = selected;
  var eventHtml='<div style="padding:10px;">';
  eventHtml+='<div style="background:#f2f2f7;border-radius:12px;padding:16px;margin-bottom:14px;">';
  eventHtml+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">';
  eventHtml+='<div style="width:40px;height:40px;background:#ff9500;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;">!</div>';
  eventHtml+='<div style="font-size:17px;font-weight:700;color:#1c1c1e;">'+selected.name+'</div></div>';
  eventHtml+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">';
  eventHtml+='<div style="background:#fff;border-radius:8px;padding:10px;"><div style="font-size:11px;color:#8e8e93;">事件类型</div><div style="font-size:14px;font-weight:600;color:#1c1c1e;margin-top:2px;">'+selected.type+'</div></div>';
  eventHtml+='<div style="background:#fff;border-radius:8px;padding:10px;"><div style="font-size:11px;color:#8e8e93;">严重程度</div><div style="font-size:14px;font-weight:600;color:#ff3b30;margin-top:2px;">'+'★'.repeat(selected.severity)+'</div></div>';
  eventHtml+='</div>';
  eventHtml+='<div style="font-size:13px;color:#3a3a3c;line-height:1.6;margin-bottom:12px;">'+(selected.description||'请妥善应对。')+'</div>';
  eventHtml+='<div style="font-size:12px;font-weight:600;color:#007aff;margin-bottom:8px;">请选择应对方案：</div>';
  eventHtml+='</div>';
  // 生成选项按钮
  var buttons = [];
  selected.choices.forEach(function(choice, idx){
    eventHtml+='<div onclick="handleEventChoice('+idx+')" style="background:#fff;border:1px solid #e5e5ea;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.borderColor=\'#007aff\';this.style.background=\'#f0f7ff\'" onmouseout="this.style.borderColor=\'#e5e5ea\';this.style.background=\'#fff\'">';
    eventHtml+='<div style="font-size:14px;font-weight:600;color:#1c1c1e;margin-bottom:4px;">'+choice.text+'</div>';
    eventHtml+='<div style="font-size:12px;color:#8e8e93;">'+choice.desc+'</div>';
    eventHtml+='</div>';
  });
  eventHtml+='</div>';
  showModal('突发事件：'+selected.name, eventHtml, []);
  renderAll();
}
function handleEventChoice(idx){
  if(!G.currentEvent||!G.currentEvent.choices[idx])return;
  var choice = G.currentEvent.choices[idx];
  choice.effect();
  G.currentEvent = null;
  if(typeof AI_STATE!=='undefined'){AI_STATE.thinking=false;}
  closeModal();
  renderAll();
}

  html += '<div style="font-size:12px;color:#8e8e93;">投资将增加GDP和就业，但需要配套基础设施。</div>';
  html += '</div></div>';
  showModal('招商引资', html, [
    {text:'热情接待', class:'primary', action:function(){
      G.gdp += investor.amount * 0.3;
      G.finance += investor.amount * 0.05;
      G.livelihood.employment = Math.min(100, G.livelihood.employment + 2);
      G.satisfaction = Math.min(1, G.satisfaction + 0.02);
      addLog('招商', investor.name+'投资'+investor.amount+'万元落户我市，GDP+'+Math.round(investor.amount*0.3)+'万，就业+2%','success');
      closeModal();
      renderAll();
    }},
    {text:'婉拒', class:'', action:function(){
      addLog('招商', '婉拒了'+investor.name+'的投资意向','info');
      closeModal();
    }}
  ]);
}

function buildTile(x,y,type){if(G.gameOver)return false;if(x<0||x>=50||y<0||y>=50)return false;if(G.grid[y][x]===7&&type!==11){addLog('建造','水域不可建造（铁路可建桥梁）','warn');return false;}if(G.grid[y][x]===12){addLog('建造','山地地形复杂，不可建造','warn');return false;}if(G.grid[y][x]===type){return false;}var cost=getBuildingCost(type,1);if(cost>G.finance){addLog('建造','财政不足，需要'+fmtMoney(cost),'warn');showModal('财政不足','<div style="padding:10px 0;">当前财政：<strong style="color:#dc2626;">'+fmtMoney(G.finance)+'</strong><br>建造'+getTypeName(type)+'需要：<strong>'+fmtMoney(cost)+'</strong><br><br>请先发展经济增加财政收入，或调整预算。</div>',[{text:'知道了',class:'primary',action:closeModal}]);return false;}if(G.grid[y][x]===1){var ratio=getFarmlandRatio();if(ratio<0.13){addLog('建造',' 耕地红线警告！当前比例'+fmtPct(ratio),'warn');}}G.finance-=cost;var oldType=G.grid[y][x];G.grid[y][x]=type;if(oldType===1)G.farmland--;if(type===1)G.farmland++;var key=x+','+y;G.buildingData[key]={level:1,builtTime:G.year+'-'+G.month+'-'+G.day,type:type,cost:cost};addLog('建造',' 在('+x+','+y+')建造了'+getTypeName(type)+'，花费'+fmtMoney(cost),'success');markPollutionDirty();renderAll();return true;}
function demolishTile(x,y){if(G.gameOver)return false;if(x<0||x>=50||y<0||y>=50)return false;var type=G.grid[y][x];if(type===0||type===7)return false;var key=x+','+y;var bd=G.buildingData[key];var refund=0;if(bd){var cost=getBuildingCost(type,bd.level);refund=cost*0.5;G.finance+=refund;delete G.buildingData[key];}if(type===1)G.farmland--;G.grid[y][x]=0;addLog('拆除','拆除('+x+','+y+')'+getTypeName(type)+'，返还'+fmtMoney(refund),'info');markPollutionDirty();renderAll();return true;}

function renderGovModal(){var tabs=[{id:'demand',name:'需求'},{id:'data',name:'数据'},{id:'policy',name:'政策'},{id:'event',name:'事件'},{id:'gov',name:'政务'}];var html='<div style="display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #e5e7eb;padding-bottom:8px;flex-wrap:wrap;">';tabs.forEach(function(t){html+='<button onclick="switchGovTab(\''+t.id+'\')" style="padding:6px 14px;border:none;background:'+(govTab===t.id?'#2563eb':'transparent')+';color:'+(govTab===t.id?'#fff':'#374151')+';border-radius:6px;font-size:13px;cursor:pointer;font-weight:'+(govTab===t.id?'600':'400')+';">'+t.name+'</button>';});html+='</div><div id="govContent" style="max-height:60vh;overflow-y:auto;">';if(govTab==='demand')html+=renderDemandTab();else if(govTab==='data')html+=renderDataTab();else if(govTab==='policy')html+=renderPolicyTab();else if(govTab==='event')html+=renderEventTab();else if(govTab==='gov')html+=renderGovTab();else if(govTab==='personal')html+=renderPersonalTab();html+='</div>';document.getElementById('modalBody').innerHTML=html;}
function switchGovTab(tab){govTab=tab;renderGovModal();}
function renderDemandTab(){var html='';html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:12px 0 8px;">产业需求</div>';html+=demandBar('商业岗位',G.commercialJobs,G.commercialJobDemand,'个');html+=demandBar('工业岗位',G.industrialJobs,G.industrialJobDemand,'个');html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:16px 0 8px;">基础设施需求</div>';html+=demandBar('电力供给',G.powerSupply,G.powerDemand,'kW');html+=demandBar('供水能力',G.waterSupply,G.waterDemand,'吨');html+=demandBar('污水处理能力',G.sewageCapacity,G.sewageDemand,'吨');html+=demandBar('垃圾处理能力',G.garbageCapacity,G.garbageDemand,'吨');html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:16px 0 8px;">公共服务需求</div>';html+=demandBar('教育资源',G.educationIndex*10,1000,'学位');html+=demandBar('医疗资源',G.medicalIndex*10,1000,'床位');var unmet=[];if(G.commercialJobs<G.commercialJobDemand)unmet.push('商业岗位');if(G.industrialJobs<G.industrialJobDemand)unmet.push('工业岗位');if(G.powerSupply<G.powerDemand)unmet.push('电力供给');if(G.waterSupply<G.waterDemand)unmet.push('供水能力');if(G.sewageCapacity<G.sewageDemand)unmet.push('污水处理');if(G.garbageCapacity<G.garbageDemand)unmet.push('垃圾处理');if(unmet.length>0){html+='<div style="margin-top:16px;padding:12px;background:#fef3c7;border-radius:8px;border-left:4px solid #f59e0b;"><div style="font-weight:600;color:#92400e;">城市需求未满足</div><div style="font-size:13px;color:#78350f;margin-top:4px;">以下供给不足：'+unmet.join('、')+'<br>请增加对应类型的建筑以提升市民满意度。</div></div>';}else{html+='<div style="margin-top:16px;padding:12px;background:#d1fae5;border-radius:8px;border-left:4px solid #10b981;"><div style="font-weight:600;color:#065f46;">所有需求已满足</div><div style="font-size:13px;color:#047857;margin-top:4px;">城市各项基础设施和公共服务供给充足，市民满意度较高。</div></div>';}return html;}
function demandBar(name,supply,demand,unit){var ratio=Math.min(100,(supply/demand)*100);var status=supply>=demand?'充足':(supply>=demand*0.7?'不足':'严重不足');var color=supply>=demand?'#10b981':(supply>=demand*0.7?'#f59e0b':'#ef4444');return '<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><span style="font-size:14px;font-weight:500;color:#111827;">'+name+'</span><span style="font-size:13px;font-weight:600;color:'+color+';">'+status+'</span></div><div style="height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:4px;"><div style="height:100%;width:'+ratio+'%;background:'+color+';border-radius:4px;transition:width 0.3s;"></div></div><div style="font-size:12px;color:#6b7280;">总需求: '+fmtNum(demand)+' '+unit+' / 当前供给: '+fmtNum(supply)+' '+unit+'</div></div>';}
function renderDataTab(){var html='';html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:12px 0 8px;">社会福利</div>';html+=indexBar('教育指数',G.educationIndex,'#7c3aed');html+=indexBar('医疗指数',G.medicalIndex,'#dc2626');html+=indexBar('治安指数',G.securityIndex,'#b45309');html+=indexBar('市民满意度',Math.round(G.satisfaction*100),'#059669');html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:16px 0 8px;">环境质量</div>';var aqiLevel=G.airQuality<=50?'优':(G.airQuality<=100?'良':(G.airQuality<=150?'轻度污染':'中度污染'));var aqiColor=G.airQuality<=50?'#10b981':(G.airQuality<=100?'#84cc16':(G.airQuality<=150?'#f59e0b':'#ef4444'));html+=indexBar('空气质量 (GB3095)',Math.round(G.airQuality),aqiColor,aqiLevel);var waterLevel=G.waterQuality>=90?'I类':(G.waterQuality>=80?'II类':(G.waterQuality>=70?'III类':'IV类'));html+=indexBar('水质 (GB3838)',Math.round(G.waterQuality),'#0ea5e9',waterLevel);html+=indexBar('绿化覆盖率',Math.round(G.greenCoverage),'#22c55e','%');html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;"><span style="font-size:14px;color:#111827;">噪声水平</span><span style="font-size:14px;font-weight:600;color:#059669;">'+G.noiseLevel+'dB</span></div>';html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:16px 0 8px;">耕地保护</div>';var farmlandRatio=(G.farmland/2500*100).toFixed(1);html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:14px;color:#111827;">耕地面积</span><span style="font-size:14px;font-weight:600;color:#059669;">'+G.farmland+'格 / 红线375格</span></div><div style="height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;"><div style="height:100%;width:'+Math.min(100,G.farmland/375*100)+'%;background:#059669;"></div></div></div>';html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;"><span style="font-size:14px;color:#111827;">耕地红线比例</span><span style="font-size:14px;font-weight:600;color:#111827;">'+farmlandRatio+'%</span></div>';html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;"><span style="font-size:14px;color:#111827;">违规月数</span><span style="font-size:14px;font-weight:600;color:'+(G.violationMonths>0?'#ef4444':'#059669')+';">'+G.violationMonths+'月</span></div>';html+='<div style="font-size:15px;font-weight:600;color:#111827;margin:16px 0 8px;">政治指标</div>';html+=indexBar('政治声誉',Math.round(G.politicalReputation),'#dc2626');html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;"><span style="font-size:14px;color:#111827;">任内政绩</span><span style="font-size:14px;font-weight:600;color:#111827;">'+fmtNum(G.performance)+'</span></div>';html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;"><span style="font-size:14px;color:#111827;">私人账户</span><span style="font-size:14px;font-weight:600;color:#b45309;">¥'+fmtNum(G.personalAccount)+'万</span></div>';

function indexBar(name,value,color,suffix){var display=suffix?value+(suffix==='%'?'%':' ('+suffix+')'):value+'/100';return '<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:14px;color:#111827;">'+name+'</span><span style="font-size:14px;font-weight:600;color:'+color+';">'+display+'</span></div><div style="height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;"><div style="height:100%;width:'+Math.min(100,value)+'%;background:'+color+';border-radius:4px;"></div></div></div>';}
function renderPolicyTab(){var html='<div style="font-size:15px;font-weight:600;color:#111827;margin:12px 0 8px;"> 现行政策</div>';var policies=[{name:'房产税率',value:(G.policy.taxProperty*100).toFixed(1)+'%'},{name:'营业税率',value:(G.policy.taxBusiness*100).toFixed(1)+'%'},{name:'个人所得税率',value:(G.policy.taxIncome*100).toFixed(1)+'%'},{name:'教育投入比例',value:G.policy.eduRatio.toFixed(1)+'x'},{name:'医疗投入比例',value:G.policy.healthRatio.toFixed(1)+'x'},{name:'基础设施投入',value:G.policy.infraRatio.toFixed(1)+'x'},{name:'社保覆盖率',value:(G.policy.socialCoverage*100).toFixed(0)+'%'},{name:'医保报销比例',value:(G.policy.medicalReimb*100).toFixed(0)+'%'},{name:'养老金替代率',value:(G.policy.pension*100).toFixed(0)+'%'},{name:'环保监管强度',value:G.policy.envSupervision+'级'}];policies.forEach(function(p){html+='<div style="background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;"><span style="font-size:13px;color:#374151;">'+p.name+'</span><span style="font-size:13px;font-weight:600;color:#2563eb;">'+p.value+'</span></div>';});html+='<div style="margin-top:12px;padding:10px;background:#eff6ff;border-radius:8px;font-size:12px;color:#1e40af;"> 提示：政策调整将影响财政收入、市民满意度和各项指数。合理的政策组合是城市治理的关键。</div>';return html;}
function renderEventTab(){var html='<div style="font-size:15px;font-weight:600;color:#111827;margin:12px 0 8px;"> 历史事件 (改革开放进程)</div>';var events=getHistoricalEvents();events.forEach(function(e){var triggered=G.triggeredEvents.includes(e.id);var canTrigger=G.year>=e.year&&!triggered;html+='<div style="background:'+(triggered?'#f0fdf4':(canTrigger?'#fef3c7':'#f9fafb'))+';border-radius:8px;padding:12px;margin-bottom:8px;border-left:4px solid '+(triggered?'#10b981':(canTrigger?'#f59e0b':'#d1d5db'))+';">';html+='<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:14px;font-weight:600;color:#111827;">'+e.year+'年 '+e.name+'</span>';html+='<span style="font-size:12px;padding:2px 8px;border-radius:4px;background:'+(triggered?'#d1fae5':(canTrigger?'#fde68a':'#e5e7eb'))+';color:'+(triggered?'#065f46':(canTrigger?'#92400e':'#6b7280'))+';">'+(triggered?'已发生':(canTrigger?'可触发':'未到时间'))+'</span></div>';html+='<div style="font-size:13px;color:#4b5563;margin-top:6px;">'+e.desc+'</div>';if(canTrigger){html+='<button onclick="triggerHistoricalEvent(\''+e.id+'\')" style="margin-top:8px;padding:6px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;">触发事件</button>';}html+='</div>';});return html;}
function getHistoricalEvents(){return [{id:'sez1980',year:1980,name:'设立经济特区',desc:'中央批准在深圳、珠海、汕头、厦门设置经济特区，对外开放迈出关键步伐。效果：商业GDP+20%，税收+15%，持续5年。'},{id:'coastal1984',year:1984,name:'开放沿海港口城市',desc:'进一步开放大连、天津、青岛、上海、广州等14个沿海港口城市。效果：工业GDP+15%，招商引资成功率+20%。'},{id:'price1988',year:1988,name:'价格闯关',desc:'试图放开大部分商品价格，引发短期通胀。效果：通胀率+8%，市民满意度-10%（短期），长期市场经济体制初步建立。'},{id:'南巡1992',year:1992,name:'邓小平南巡讲话',desc:'进一步解放思想，加快改革开放步伐。效果：GDP增速+3%，商业/工业GDP+25%，持续10年。'},{id:'market1993',year:1993,name:'建立社会主义市场经济体制',desc:'十四届三中全会通过《关于建立社会主义市场经济体制若干问题的决定》。效果：税收制度改革，财政收入+20%。'},{id:'housing1998',year:1998,name:'住房制度改革',desc:'停止住房实物分配，实行住房分配货币化。效果：住宅需求+50%，房地产GDP+30%，持续8年。'},{id:'wto2001',year:2001,name:'加入世界贸易组织',desc:'中国正式成为WTO成员，对外开放进入新阶段。效果：进出口贸易+40%，工业GDP+20%，持续15年。'},{id:'tax2006',year:2006,name:'取消农业税',desc:'延续2600年的农业税正式退出历史舞台。效果：农民收入+15%，市民满意度+5%，耕地保护+10%。'},{id:'highspeed2008',year:2008,name:'高铁时代开启',desc:'京津城际铁路开通，中国进入高铁时代。效果：交通拥堵-30%，商业GDP+15%，人口流入+20%。'},{id:'belt2013',year:2013,name:'一带一路倡议',desc:'提出共建"丝绸之路经济带"和"21世纪海上丝绸之路"。效果：对外贸易+25%，基础设施投资+30%。'},{id:'newera2017',year:2017,name:'中国特色社会主义新时代',desc:'十九大宣告中国特色社会主义进入新时代。效果：环保监管+2级，民生投入+20%，高质量发展导向。'},{id:'pandemic2020',year:2020,name:'新冠疫情冲击',desc:'突如其来的疫情对经济社会造成巨大冲击。效果：GDP增速-5%，商业GDP-20%（短期），医疗指数+15%。'},{id:'commone2021',year:2021,name:'共同富裕示范区',desc:'高质量发展建设共同富裕示范区。效果：社保覆盖率+10%，市民满意度+10%，收入差距缩小。'}];}
function triggerHistoricalEvent(id){var events=getHistoricalEvents();var e=events.find(function(ev){return ev.id===id;});if(!e||G.triggeredEvents.includes(id))return;G.triggeredEvents.push(id);addLog('事件',''+e.year+'年 '+e.name+'：'+e.desc,'event');if(id==='sez1980'||id==='南巡1992'){G.satisfaction=Math.min(1,G.satisfaction+0.05);G.politicalReputation=Math.min(100,G.politicalReputation+5);}if(id==='wto2001'){G.gdp=Math.round(G.gdp*1.2);G.politicalReputation=Math.min(100,G.politicalReputation+8);}if(id==='pandemic2020'){G.satisfaction=Math.max(0,G.satisfaction-0.1);G.finance=Math.round(G.finance*0.9);}if(id==='tax2006'||id==='commone2021'){G.satisfaction=Math.min(1,G.satisfaction+0.08);}renderGovModal();renderAll();}

function doCadreAction(cadreId,action){
  var c=G.cadres.find(function(x){return x.id===cadreId;});
  if(!c)return;
  if(action==='promote'){
    var ranks=['办事员','科员','正股级','副科','正科','副处','正处'];
    var idx=ranks.indexOf(c.rank);
    if(idx>=ranks.length-1){alert('已到本级最高职级');return;}
    c.rank=ranks[idx+1];
    c.relation=Math.min(5,c.relation+1);
    addLog('人事',c.name+'提拔为'+c.rank,'success');
  }else if(action==='transfer'){
    var depts=['党委办','政府办','发改委','财政局','教育局','卫生局','住建局','交通局','水利局','农业局','商务局','公安局','司法局','人社局','环保局','安监局','审计局','统计局','工商局','税务局'];
    c.department=depts[Math.floor(Math.random()*depts.length)];
    addLog('人事',c.name+'平调至'+c.department,'info');
  }else if(action==='assess'){
    var results=['优秀','称职','基本称职','不称职'];
    c.performance=results[Math.floor(Math.random()*results.length)];
    addLog('人事',c.name+'年度考核：'+c.performance,c.performance==='优秀'?'success':c.performance==='不称职'?'warn':'info');
  }
  renderGovModal();
}
function doAppoint(cadreId,action){
  var c=G.cadres.find(function(x){return x.id===cadreId;});
  if(!c)return;
  if(action==='promote'){if(c.rank>=8){alert('已到最高职级');return;}appointCadre(cadreId,c.position,c.rank+1);}
  else if(action==='transfer'){var nd=DEPARTMENTS[Math.floor(Math.random()*DEPARTMENTS.length)];appointCadre(cadreId,nd+'局长',c.rank);}
  else if(action==='demote'){if(c.rank<=0){alert('已到最低职级');return;}appointCadre(cadreId,c.position,c.rank-1);}
  renderGovModal();
}

// ---------- 个人需求与想法系统 ----------
function initPersonalNeeds() {
  if (!G.personal.needs) {
    G.personal.needs = {
      housing: 30,      // 住房需求（结婚/孩子/职级提升时增加）
      vehicle: 10,      // 购车需求（职级/通勤/面子）
      marriage: 50,     // 结婚需求（25-35岁高峰）
      child: 0,         // 生育需求（结婚后）
      social: 40,       // 社交需求（维护关系）
      consumption: 20,  // 消费需求（改善生活）
    };
    G.personal.married = false;
    G.personal.spouse = null;
    G.personal.children = 0;
  }
}

// 根据年份计算房价（元/平）
function getHousePrice(year) {
  if (year < 1985) return 200 + (year - 1980) * 30;           // 1980-1985: 200-350元/平（福利分房时代）
  if (year < 1990) return 400 + (year - 1985) * 80;           // 1985-1990: 400-800元/平（房改起步）
  if (year < 1995) return 900 + (year - 1990) * 200;          // 1990-1995: 900-1900元/平
  if (year < 2000) return 2000 + (year - 1995) * 400;         // 1995-2000: 2000-4000元/平
  if (year < 2005) return 4500 + (year - 2000) * 600;         // 2000-2005: 4500-7500元/平
  if (year < 2010) return 8000 + (year - 2005) * 1500;        // 2005-2010: 8000-15500元/平
  if (year < 2015) return 16000 + (year - 2010) * 2000;       // 2010-2015: 16000-26000元/平
  if (year < 2020) return 27000 + (year - 2015) * 1500;       // 2015-2020: 27000-34500元/平
  return 35000 + (year - 2020) * 500;                           // 2020+: 35000+元/平
}

// 根据年份计算车价（元）
function getCarPrice(year, level) {
  var basePrices = {
    '经济型': [30000, 80000, 60000, 50000, 45000, 40000, 35000, 30000, 25000],
    '中档型': [80000, 150000, 120000, 100000, 90000, 80000, 70000, 60000, 50000],
    '豪华型': [200000, 400000, 350000, 300000, 280000, 250000, 220000, 200000, 180000],
  };
  var eraIdx = year < 1985 ? 0 : year < 1990 ? 1 : year < 1995 ? 2 : year < 2000 ? 3 : year < 2005 ? 4 : year < 2010 ? 5 : year < 2015 ? 6 : year < 2020 ? 7 : 8;
  return basePrices[level] ? basePrices[level][eraIdx] : basePrices['经济型'][eraIdx];
}

// 每月更新个人需求
function updatePersonalNeeds() {
  initPersonalNeeds();
  var needs = G.personal.needs;

  // 结婚需求：25-35岁高峰，未婚时增加
  if (!G.personal.married) {
    if (G.age >= 25 && G.age <= 35) {
      needs.marriage = Math.min(100, needs.marriage + 5);
    } else if (G.age > 35) {
      needs.marriage = Math.max(20, needs.marriage - 2);
    }
  } else {
    needs.marriage = 0;
  }

  // 住房需求：结婚后、有孩子、职级提升时增加
  if (G.personal.married) needs.housing = Math.min(100, needs.housing + 3);
  if (G.personal.children > 0) needs.housing = Math.min(100, needs.housing + 2);
  if (G.rank >= 2) needs.housing = Math.min(100, needs.housing + 1); // 处级以上想换房

  // 购车需求：职级提升、有家庭后增加
  if (G.rank >= 1) needs.vehicle = Math.min(100, needs.vehicle + 2); // 副处以上想配车
  if (G.personal.married) needs.vehicle = Math.min(100, needs.vehicle + 1);
  if (G.year >= 2000) needs.vehicle = Math.min(100, needs.vehicle + 2); // 汽车普及时代

  // 生育需求：结婚后增加
  if (G.personal.married && G.personal.children < 3) {
    needs.child = Math.min(100, needs.child + 3);
  }

  // 社交需求：随职级增加
  needs.social = Math.min(100, 30 + G.rank * 8);

  // 消费需求：随工资增加
  needs.consumption = Math.min(100, 15 + G.personal.salary * 2);
}

// 尝试结婚
function tryMarry() {
  if (G.personal.married) return false;
  if (G.personal.needs.marriage < 60) return false;

}

// 尝试生育
function tryHaveChild() {
  if (!G.personal.married) return false;
  if (G.personal.children >= 3) return false;
  if (G.personal.needs.child < 70) return false;

  G.personal.children++;
  G.personal.needs.child = 0;
  G.personal.needs.housing = Math.min(100, G.personal.needs.housing + 20);

// 尝试买房（基于需求，不是有钱就买）
function tryBuyHouse() {
  if (G.personal.needs.housing < 70) return false;
  var pricePerSqm = getHousePrice(G.year);
  var area = G.personal.children > 0 ? 120 : 80;
  var totalPrice = pricePerSqm * area;
  var totalWan = totalPrice / 10000;

  // 需要存款达到房价的30%（首付）
  if (G.personal.deposit < totalWan * 0.3) return false;

  G.personal.deposit -= totalWan * 0.3; // 首付
  if (!G.personal.assets) G.personal.assets = [];
  G.personal.assets.push({type:'房产',value:totalWan,area:area,pricePerSqm:pricePerSqm,year:G.year});
  G.personal.needs.housing = 0;
  G.personal.stress = Math.max(0, G.personal.stress - 15);
  addLog('个人', '🏠 购买'+area+'平米住房，单价'+pricePerSqm.toFixed(0)+'元/平，首付'+(totalWan*0.3).toFixed(1)+'万元', 'success');
  return true;
}

// 尝试买车（基于需求）
function tryBuyCar() {
  if (G.personal.needs.vehicle < 60) return false;
  var level = G.rank >= 4 ? '豪华型' : G.rank >= 2 ? '中档型' : '经济型';
  var price = getCarPrice(G.year, level);
  var priceWan = price / 10000;

  if (G.personal.deposit < priceWan) return false;

  G.personal.deposit -= priceWan;
  if (!G.personal.assets) G.personal.assets = [];
  G.personal.assets.push({type:'车辆',value:priceWan,level:level,year:G.year});
  G.personal.needs.vehicle = 0;
  G.personal.stress = Math.max(0, G.personal.stress - 8);
  addLog('个人', '🚗 购买'+level+'轿车，价格'+priceWan.toFixed(1)+'万元', 'success');
  return true;
}

function submitPromotionApplication() {
  var req = getPromotionRequirements(G.rank);
  var termYears = Math.floor(G.termMonths/12);
  var eduLevel = {'大专':0,'本科':1,'硕士':2,'博士':3};
  var currentEdu = eduLevel[G.personal.education] || 0;
  var requiredEdu = eduLevel[req.edu] || 0;

  var buildingCount = G.buildingData ? Object.keys(G.buildingData).length : 0;
  var allPass = termYears >= req.term && G.gdp >= req.gdp && G.population >= req.pop && G.superiorEval*100 >= req.eval && currentEdu >= requiredEdu && buildingCount >= req.buildings;

  if (!allPass) {
    showModal('申请失败', '<div style="text-align:center;padding:20px;"><div style="font-size:36px;margin-bottom:10px;">❌</div><div style="font-size:16px;">晋升条件未全部满足</div><div style="font-size:13px;color:#8e8e93;margin-top:8px;">请继续努力，达成所有条件后再申请</div></div>', [{text:'知道了',class:'primary',action:closeModal}]);
    return;
  }

  // 晋升成功率：基础70% + 上级评价加成 + 靠山关系加成
  var successRate = 0.7 + (G.superiorEval - 0.5) * 0.3 + (G.relationships.superior.relation / 100) * 0.1;
  successRate = Math.min(0.95, Math.max(0.3, successRate));

  closeModal();

  if (Math.random() < successRate) {
    // 晋升成功 + 调任新城市
    var oldRank = G.rank;
    G.rank++;
    var newRankName = G.rankNames[G.rank];
    // 存档当前城市（AI代理接管）
    archiveCurrentCity();
    // 保存个人资产（跨城市保留）
    var personalAssets = {
      deposit: G.personal.deposit,
      education: G.personal.education,
      eduScore: G.personal.eduScore,
      ability: G.personal.ability,
      stocks: G.personal.stocks ? JSON.parse(JSON.stringify(G.personal.stocks)) : [],
      corruptionRisk: G.personal.corruptionRisk || 0,
      health: G.personal.health || 100,
      stress: G.personal.stress || 0,
      assets: G.personal.assets ? JSON.parse(JSON.stringify(G.personal.assets)) : [],
      salary: calculateSalary(G.rank, G.year) / 10000
    };
    var carriedEval = G.superiorEval * 0.8;
    // 确定新城市级别
    var newCityLevel = Math.min(3, Math.floor((G.rank + 1) / 2));
    G.startLevel = newCityLevel;
    // 重新生成地图
    G.grid = generateExistingCity(newCityLevel);
    G.buildingData = {};
    // 重新计算城市数据
    autoCalculateCityStats(newCityLevel);
    // 恢复个人资产
    G.personal.deposit = personalAssets.deposit;
    G.personal.education = personalAssets.education;
    G.personal.eduScore = personalAssets.eduScore;
    G.personal.ability = personalAssets.ability;
    G.personal.stocks = personalAssets.stocks;
    G.personal.corruptionRisk = personalAssets.corruptionRisk;
    G.personal.health = personalAssets.health;
    G.personal.stress = personalAssets.stress;
    G.personal.assets = personalAssets.assets;
    G.personal.salary = personalAssets.salary;
    // 恢复上级评价（保留80%）
    G.superiorEval = carriedEval;
    // 安家费
    var settlingAllowance = 5 + Math.floor(Math.random() * 10);
    G.personal.deposit += settlingAllowance;
    // 重置任期
    G.termMonths = 0;
    G.promotionCooldown = 0;
    G.age = Math.min(80, G.age + 1);
    // 新城市生成档案
    G.cityId=generateCityId();
    initCurrentCityArchive();
    recordCitySnapshot();
    addMilestone('到任履新','career');
    // 重新初始化社会系统
    if (typeof initSociety === 'function') initSociety();initSuperiorRole();
    if (typeof initCadres === 'function') initCadres();
    G.promoted = true;
    G.lastPromotionYear = G.year;
    var cityLevelNames = ['乡镇', '县城', '地级市', '副省级市'];
    var newCityType = cityLevelNames[newCityLevel] || '县城';
    addLog('晋升', '🎉 晋升调任！您已晋升为'+newRankName+'，调任'+newCityType+'，安家费'+settlingAllowance+'万元', 'success');
    addLog('晋升', '新城市人口'+G.population.toLocaleString()+'人，GDP'+fmtNum(G.gdp)+'万元', 'info');
    showPromotionModal(newRankName, newCityType, G.population, G.gdp, settlingAllowance);
    if (typeof centerMap === 'function') centerMap();
    if (typeof renderAll === 'function') renderAll();
    if (typeof renderMap === 'function') renderMap();
  } else {
    // 晋升失败
    G.promotionCooldown = 6;
    G.superiorEval = Math.max(0, G.superiorEval - 0.02);
    addLog('晋升', '晋升申请未通过，上级认为还需锻炼。6个月后可再次申请。', 'warning');
    showModal('申请结果', '<div style="text-align:center;padding:20px;"><div style="font-size:36px;margin-bottom:10px;">📋</div><div style="font-size:16px;font-weight:600;">晋升申请未通过</div><div style="font-size:13px;color:#8e8e93;margin-top:8px;line-height:1.8;">上级组织部门经过考察，认为您还需要进一步锻炼。<br>6个月后可再次申请。<br><br>建议：提升上级评价、发展经济、改善民生</div></div>', [{text:'继续努力',class:'primary',action:closeModal}]);
  }
  renderAll();
}

// 根据年份计算工资增长系数（参考中国实际工资增长）
function getYearSalaryMultiplier(year) {
  if (year <= 1980) return 1.0;
  if (year <= 1985) return 1.0 + (year - 1980) * 0.06;   // 年增6%
  if (year <= 1990) return 1.3 + (year - 1985) * 0.2;    // 年增20%
  if (year <= 1995) return 2.3 + (year - 1990) * 0.5;    // 年增50%
  if (year <= 2000) return 4.8 + (year - 1995) * 1.5;    // 年增150%
  if (year <= 2005) return 12.3 + (year - 2000) * 3.0;   // 年增300%
  if (year <= 2010) return 27.3 + (year - 2005) * 4.0;   // 年增400%
  if (year <= 2015) return 47.3 + (year - 2010) * 5.0;   // 年增500%
  if (year <= 2020) return 72.3 + (year - 2015) * 6.0;   // 年增600%
  return 102.3 + (year - 2020) * 3.0;                     // 年增300%
}

// 根据级别和年份计算实际月薪（元）
function calculateSalary(rank, year) {
  var baseSalary = [60, 80, 100, 130, 160, 200, 250, 320, 400][rank] || 60;  // 1980年基准，级别差距合理
  var multiplier = getYearSalaryMultiplier(year);
  return Math.round(baseSalary * multiplier);
}


// 根据年份返回可考取的最高学历（参考中国学历发展历史）
function getMaxEducationByYear(year) {
  if (year < 1982) return '大专';      // 1977恢复高考，1981才建立学位制度
  if (year < 1985) return '本科';      // 1981首批学士学位
  if (year < 1990) return '硕士';      // 1981首批硕士，数量极少
  return '博士';                        // 1983首批博士，1990后逐渐增多
}

// 获取学历年代说明
function getEducationEraInfo(year) {
  if (year < 1982) return '1981年才建立学位制度，当前只能考取大专学历';
  if (year < 1985) return '1981年首批学士学位，当前最高可考取本科学历';
  if (year < 1990) return '1981年恢复硕士招生，当前最高可考取硕士学历';
  return '1983年首批博士学位，当前可考取博士学历';
}


function checkPromotion(){
  if(G.gameOver)return;
  var termLimit=G.rank===0?3:5;
  if(G.termYears<termLimit)return;
  var evalThreshold=[0.5,0.55,0.6,0.65,0.7][G.rank]||0.7;
  var gdpThreshold=[25000,60000,150000,400000,1000000][G.rank]||1000000;
  if(G.superiorEval>=evalThreshold&&G.gdp>=gdpThreshold&&G.rank<5){
    G.rank++;
    G.termYears=0;
    G.salary=calculateSalary(G.rank, G.year);
    var newRankName=G.rankNames[G.rank]||'高级干部';
    addLog('晋升','恭喜！您已晋升为'+newRankName+'，月薪'+G.salary+'元','success');
    showPromotionModal(newRankName);
  }else if(G.termYears>=termLimit){
    if(G.superiorEval<evalThreshold*0.7||G.gdp<gdpThreshold*0.5){
      G.gameOver=true;
      G.gameOverReason='任期考核不合格，被调离岗位！';
      addLog('考核',''+G.gameOverReason,'danger');
      showGameOver();
    }else{
      G.termYears=0;
      addLog('考核','任期结束，考核合格，继续留任','info');
    }
  }
}

function calculateFinalScore(){
  var cities=G.nation&&G.nation.cities?G.nation.cities:[];
  if(cities.length===0)return{grade:'合格',title:'基层干部',score:60,details:'未完成跨城市任职'};
  var totalGrowth=0,totalSat=0,totalPoll=0,validCount=0;
  cities.forEach(function(c){
    var hist=c.history;
    var isNew=hist.length>0&&typeof hist[0]==='object';
    var last=isNew?hist[hist.length-1]:null;
    var first=isNew?hist[0]:null;
    var oldLast=!isNew&&hist.gdp?hist.gdp.length-1:-1;
    if((isNew&&hist.length>1)||oldLast>0){
      var start=isNew?(first.gdp||1):(hist.gdp[0]||1);
      var end=isNew?(last.gdp||1):(hist.gdp[oldLast]||1);
      totalGrowth+=(end-start)/start;
      totalSat+=isNew?(last.satisfaction||0.5):(hist.satisfaction[oldLast]||0.5);
      totalPoll+=isNew?(last.pollution||20):(hist.pollution[oldLast]||20);
      validCount++;
    }
  });
  var avgGrowth=validCount>0?totalGrowth/validCount:0;
  var avgSat=validCount>0?totalSat/validCount:0.5;
  var avgPoll=validCount>0?totalPoll/validCount:20;
  // 综合评分
  var gdpScore=Math.min(30,avgGrowth*15);
  var satScore=Math.min(25,avgSat*25);
  var envScore=Math.min(20,(1-avgPoll/100)*20);
  var stableScore=Math.min(15,(G.nation&&G.nation.politicalStability?G.nation.politicalStability:0.6)*15);
  var careerScore=Math.min(10,cities.length*2);
  var totalScore=Math.round(gdpScore+satScore+envScore+stableScore+careerScore);
  // 评级
  var grade,title;
  if(totalScore>=85){grade='卓越';title='改革先锋';}
  else if(totalScore>=70){grade='优秀';title='实干家';}
  else if(totalScore>=55){grade='良好';title='称职官员';}
  else if(totalScore>=40){grade='合格';title='守成之官';}
  else{grade='不合格';title='平庸之辈';}
  return{grade:grade,title:title,score:totalScore,details:{avgGrowth:avgGrowth,avgSat:avgSat,avgPoll:avgPoll,cities:cities.length,gdpScore:gdpScore,satScore:satScore,envScore:envScore,stableScore:stableScore,careerScore:careerScore}};
}

function generateMap(seed){var size=50;var mapSeed=seed||Date.now();var elevNoise=new ValueNoise(mapSeed);var moistNoise=new ValueNoise(mapSeed+1000);var elevScale=0.12;var moistScale=0.09;var terrain=[];var grid=[];for(var y=0;y<size;y++){grid[y]=new Array(size).fill(0);terrain[y]=[];for(var x=0;x<size;x++){var elevation=elevNoise.fbm(x*elevScale,y*moistScale,5);var moisture=moistNoise.fbm(x*moistScale,y*moistScale,4);terrain[y][x]={elevation:elevation,moisture:moisture};if(elevation<0.30){grid[y][x]=7;}else if(elevation<0.35){grid[y][x]=0;}else if(elevation<0.60){grid[y][x]=moisture>0.55?6:1;}else if(elevation<0.75){grid[y][x]=moisture>0.45?6:0;}else{grid[y][x]=12;}}}var visited=[];for(var y=0;y<size;y++)visited[y]=new Array(size).fill(false);function findWaterRegion(sx,sy){var region=[];var stack=[[sx,sy]];while(stack.length>0){var pt=stack.pop();var x=pt[0],y=pt[1];if(x<0||x>=size||y<0||y>=size)continue;if(visited[y][x]||grid[y][x]!==7)continue;visited[y][x]=true;region.push([x,y]);stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}return region;}for(var y=0;y<size;y++){for(var x=0;x<size;x++){if(grid[y][x]===7&&!visited[y][x]){var region=findWaterRegion(x,y);var minX=size,maxX=0,minY=size,maxY=0;for(var idx=0;idx<region.length;idx++){var rx=region[idx][0],ry=region[idx][1];if(rx<minX)minX=rx;if(rx>maxX)maxX=rx;if(ry<minY)minY=ry;if(ry>maxY)maxY=ry;}var width=maxX-minX+1;var height=maxY-minY+1;var area=region.length;var isRiver=(width>height*2.5||height>width*2.5)&&area<80;if(isRiver){if(width>height){for(var ry=minY;ry<=maxY;ry++){var waterInRow=[];for(var rx=minX;rx<=maxX;rx++){if(grid[ry][rx]===7)waterInRow.push(rx);}if(waterInRow.length>2){var mid=Math.floor(waterInRow.length/2);var keep=[waterInRow[mid-1],waterInRow[mid]];for(var ri=0;ri<waterInRow.length;ri++){if(!keep.includes(waterInRow[ri]))grid[ry][waterInRow[ri]]=0;}}}}else{for(var rx=minX;rx<=maxX;rx++){var waterInCol=[];for(var ry=minY;ry<=maxY;ry++){if(grid[ry][rx]===7)waterInCol.push(ry);}if(waterInCol.length>2){var mid=Math.floor(waterInCol.length/2);var keep=[waterInCol[mid-1],waterInCol[mid]];for(var ri=0;ri<waterInCol.length;ri++){if(!keep.includes(waterInCol[ri]))grid[waterInCol[ri]][rx]=0;}}}}}}}}var farmCount=0;for(var y=0;y<size;y++){for(var x=0;x<size;x++){if(grid[y][x]===1)farmCount++;}}var targetFarm=Math.floor(size*size*0.22);if(farmCount<targetFarm){for(var y=0;y<size&&farmCount<targetFarm;y++){for(var x=0;x<size&&farmCount<targetFarm;x++){if(grid[y][x]===0||grid[y][x]===6){if(terrain[y][x].elevation<0.55){grid[y][x]=1;farmCount++;}}}}}var buildable=0;for(var y=0;y<size;y++){for(var x=0;x<size;x++){if(grid[y][x]!==7&&grid[y][x]!==12)buildable++;}}var minBuildable=Math.floor(size*size*0.60);if(buildable<minBuildable){var needConvert=minBuildable-buildable;for(var y=0;y<size&&needConvert>0;y++){for(var x=0;x<size&&needConvert>0;x++){if(grid[y][x]===12&&terrain[y][x].elevation<0.80){grid[y][x]=0;needConvert--;}}}}return grid;}

function getBuildingLevelByType(type){
  if([3,4,5,6,22,26,28,29,35].indexOf(type)>=0)return 1;
  if([36,37,23,27,31,33,18,19,20,21,30].indexOf(type)>=0)return 2;
  if([24,32,34,8,9,14,13].indexOf(type)>=0)return 3;
  if([25,10,38,15,16].indexOf(type)>=0)return 4;
  return 1;
}

function generateExistingCity(level){
  var grid=[];
  for(var y=0;y<50;y++){grid[y]=new Array(50).fill(0);}
  var params=[
    {roadGrid:4,blocks:4,residentialType:3,commercialType:4,industrialType:5,hasSchool:true,hasClinic:true,hasPolice:true,hasFactory:true,popDensity:200,buildingLevel:1,name:'乡镇'},
    {roadGrid:5,blocks:8,residentialType:36,commercialType:37,industrialType:5,hasSchool:true,hasClinic:true,hasPolice:true,hasFactory:true,hasHospital:true,hasMiddleSchool:true,hasPowerPlant:true,popDensity:500,buildingLevel:2,name:'县城'},
    {roadGrid:6,blocks:12,residentialType:36,commercialType:37,industrialType:38,hasSchool:true,hasClinic:true,hasPolice:true,hasFactory:true,hasHospital:true,hasMiddleSchool:true,hasHighSchool:true,hasPowerPlant:true,hasWaterPlant:true,hasBusStation:true,hasPark:true,hasTechPark:true,popDensity:1200,buildingLevel:3,name:'地级市'},
    {roadGrid:8,blocks:16,residentialType:36,commercialType:37,industrialType:38,hasSchool:true,hasClinic:true,hasPolice:true,hasFactory:true,hasHospital:true,hasMiddleSchool:true,hasHighSchool:true,hasUniversity:true,hasPowerPlant:true,hasWaterPlant:true,hasBusStation:true,hasPark:true,hasTechPark:true,hasMetro:true,has5G:true,hasCulture:true,hasNursingHome:true,popDensity:2500,buildingLevel:4,name:'副省级市'}
  ];
  var p=params[Math.min(3,Math.max(0,level))];
  var cx=25,cy=25;
  // 道路网
  for(var y2=0;y2<50;y2++){
    for(var x2=0;x2<50;x2++){
      var dx=Math.abs(x2-cx),dy=Math.abs(y2-cy);
      var isMainRoad=(dx%p.roadGrid===0&&dx<=p.blocks*1.2)||(dy%p.roadGrid===0&&dy<=p.blocks*1.2);
      var ringDist=Math.max(dx,dy);
      var isRing=(ringDist===Math.floor(p.blocks*0.4)||ringDist===Math.floor(p.blocks*0.7)||ringDist===Math.floor(p.blocks*1.0))&&ringDist<=p.blocks*1.2;
      if(isMainRoad||isRing){
        var rt=14;
        if(ringDist>p.blocks*0.7)rt=13;
        if(ringDist>p.blocks*1.0)rt=2;
        if(dx===0||dy===0)rt=14;
        grid[y2][x2]=rt;
      }
    }
  }
  // 中心广场+行政中心
  for(var dy2=-1;dy2<=1;dy2++){
    for(var dx2=-1;dx2<=1;dx2++){
      var nx=cx+dx2,ny=cy+dy2;
      if(nx>=0&&nx<50&&ny>=0&&ny<50)grid[ny][nx]=40;
    }
  }
  grid[cy][cx]=4;
  // 功能分区
  for(var y3=0;y3<50;y3++){
    for(var x3=0;x3<50;x3++){
      if(grid[y3][x3]!==0)continue;
      var fdx=x3-cx,fdy=y3-cy;
      var dist=Math.sqrt(fdx*fdx+fdy*fdy);
      if(dist>p.blocks)continue;
      var angle=Math.atan2(fdy,fdx);
      var quad=((angle+Math.PI)/(Math.PI/2))%4;
      if((quad>=0&&quad<1.5)||(quad>=2.5&&quad<4)){
        if(Math.random()<0.3)grid[y3][x3]=p.residentialType;
      }else if(quad>=1.5&&quad<2.5){
        if(Math.random()<0.2)grid[y3][x3]=p.commercialType;
      }else{
        if(Math.random()<0.15)grid[y3][x3]=p.industrialType;
      }
      if(grid[y3][x3]===0&&Math.random()<0.03)grid[y3][x3]=6;
    }
  }
  // 公共服务设施
  var facilities=[];
  if(p.hasSchool){
    facilities.push({type:22,dx:3,dy:-4});
    if(p.hasMiddleSchool)facilities.push({type:23,dx:-4,dy:3});
    if(p.hasHighSchool)facilities.push({type:24,dx:5,dy:2});
    if(p.hasUniversity)facilities.push({type:25,dx:-6,dy:-5});
  }
  if(p.hasClinic)facilities.push({type:26,dx:-3,dy:-3});
  if(p.hasHospital)facilities.push({type:27,dx:4,dy:-5});
  if(p.hasPolice)facilities.push({type:28,dx:-2,dy:4});
  facilities.push({type:29,dx:3,dy:5});
  if(p.hasPowerPlant)facilities.push({type:8,dx:-8,dy:-6});
  if(p.hasWaterPlant)facilities.push({type:18,dx:7,dy:-7});
  if(p.hasBusStation)facilities.push({type:31,dx:6,dy:6});
  if(p.hasTechPark)facilities.push({type:10,dx:-7,dy:7});
  if(p.has5G)facilities.push({type:32,dx:8,dy:-8});
  if(p.hasCulture)facilities.push({type:33,dx:-5,dy:-6});
  if(p.hasNursingHome)facilities.push({type:34,dx:6,dy:-7});
  if(p.hasPark)facilities.push({type:6,dx:-6,dy:-6});
  facilities.push({type:30,dx:9,dy:8});
  facilities.push({type:35,dx:2,dy:-6});
  facilities.forEach(function(f){
    var fx=cx+f.dx,fy=cy+f.dy;
    if(fx>=0&&fx<50&&fy>=0&&fy<50){
      if(grid[fy][fx]===0||grid[fy][fx]===6){grid[fy][fx]=f.type;}
      else{
        for(var r=1;r<5;r++){
          var placed=false;
          for(var rdy=-r;rdy<=r&&!placed;rdy++){
            for(var rdx=-r;rdx<=r&&!placed;rdx++){
              var nnx=fx+rdx,nny=fy+rdy;
              if(nnx>=0&&nnx<50&&nny>=0&&nny<50&&grid[nny][nnx]===0){grid[nny][nnx]=f.type;placed=true;}
            }
          }
          if(placed)break;
        }
      }
    }
  });
  // 外围农田（建成区外，确保耕地红线13%以上）
  for(var y4=0;y4<50;y4++){
    for(var x4=0;x4<50;x4++){
      if(grid[y4][x4]!==0)continue;
      var fdx2=x4-cx,fdy2=y4-cy;
      var dist2=Math.sqrt(fdx2*fdx2+fdy2*fdy2);
      if(dist2<p.blocks*1.1)continue; // 建成区内不铺农田
      var farmProb=0.18;
      if(dist2>p.blocks*1.8)farmProb=0.25;
      if(dist2>p.blocks*2.5)farmProb=0.35;
      if(Math.random()<farmProb)grid[y4][x4]=1;
    }
  }
  // 角落小湖
  for(var ldy=-3;ldy<=3;ldy++){
    for(var ldx=-3;ldx<=3;ldx++){
      var lx=45+ldx,ly=45+ldy;
      if(lx>=0&&lx<50&&ly>=0&&ly<50&&Math.sqrt(ldx*ldx+ldy*ldy)<=3)grid[ly][lx]=7;
    }
  }
  return grid;
}

function autoCalculateCityStats(level){
  if(!G)return;
  var counts={};
  var totalBuildings=0;
  for(var y=0;y<50;y++){
    for(var x=0;x<50;x++){
      var type=G.grid[y][x];
      if(type>0){
        counts[type]=(counts[type]||0)+1;
        totalBuildings++;
        var key=x+','+y;
        if(!G.buildingData[key]){
          G.buildingData[key]={
            level:getBuildingLevelByType(type),
            builtTime:(G.year-Math.floor(Math.random()*15))+'-'+(1+Math.floor(Math.random()*12)),
            type:type,
            cost:getBuildingCost(type,getBuildingLevelByType(type))*(0.6+Math.random()*0.3)
          };
        }
      }
    }
  }
  // 人口估算（按级别基础值+建筑微调）
  var level=(G.startLevel||0);
  var basePop=[30000,250000,1000000,3500000][level]||30000;
  var residentialUnits=(counts[3]||0)*200+(counts[36]||0)*500;
  var popFactor=0.7+Math.min(0.6,residentialUnits/(basePop*0.01));
  G.population=Math.round(basePop*popFactor);
  // GDP估算（人口×人均GDP，按级别）
  var perCapitaGdp=[5000,9000,18000,35000][level]||5000;
  var commercialBonus=1+((counts[4]||0)+(counts[37]||0))*0.01;
  var industrialBonus=1+((counts[5]||0)+(counts[38]||0))*0.008;
  var techBonus=1+(counts[10]||0)*0.02;
  G.gdp=Math.round(G.population*perCapitaGdp/10000*commercialBonus*industrialBonus*techBonus);
  // 财政（GDP的8-12%）
  var taxRate=0.08+Math.random()*0.04;
  G.finance=Math.round(G.gdp*taxRate);
  G.initFinance=G.finance;
  // 满意度/上级评价
  G.satisfaction=0.4+Math.random()*0.3;
  G.superiorEval=0.4+Math.random()*0.3;
  // 耕地
  G.farmland=counts[1]||0;
  // 污染
  var pollutionSources=(counts[5]||0)*3+(counts[8]||0)*5+(counts[4]||0)*0.5;
  G.pollution=Math.min(60,pollutionSources/10);
  // 房价
  var basePrice=500+(counts[36]||0)*5+(counts[4]||0)*3;
  if(!G.housing)G.housing={};
  G.housing.averagePrice=Math.round(basePrice*(0.8+Math.random()*0.4));
  G.housing.supply=(counts[3]||0)*100+(counts[36]||0)*300;
  G.housing.demand=Math.round(G.population*0.001);
  G.housing.speculationIndex=0.1+Math.random()*0.2;
  G.housing.vacancyRate=0.06+Math.random()*0.04;
  G.housing.landRevenue=0;
  G.housing.auctionHistory=[];
  // 企业
  G.businesses=[];
  var bizCount=Math.floor((counts[5]||0)*0.3+(counts[4]||0)*0.2+(counts[38]||0)*0.5)+5;
  for(var i=0;i<Math.min(30,bizCount);i++){
    var inds=['machine','food','wholesale','service','hotel','realestate','it','construction','transport','finance'];
    G.businesses.push(createBusiness(inds[Math.floor(Math.random()*inds.length)],'中型'));
  }
  // 干部
  G.cadres=[];
  var cadreCount=5+Math.floor((level||0)*3)+Math.floor(Math.random()*5);
  for(var j=0;j<cadreCount;j++){
    G.cadres.push(createCadre(1+Math.floor(Math.random()*2)));
  }
  G.cityLevel=(level||0)+1;
  addLog('系统','您已就任'+G.rankNames[G.rank]+'，'+G.cityName+'现有建成区'+totalBuildings+'格，人口'+G.population.toLocaleString()+'人，GDP'+fmtNum(G.gdp)+'万元','success');
}

// 但为了完整，补上空函数定义以防遗漏
function calcMonthlyPayment(principal,annualRate,months){var monthlyRate=annualRate/100/12;if(monthlyRate===0)return principal/months;return principal*monthlyRate*Math.pow(1+monthlyRate,months)/(Math.pow(1+monthlyRate,months)-1);}
function calcFixedDepositMaturity(amount,annualRate,months){return amount*(1+annualRate/100*months/12);}
function depositCurrent(amount){if(amount<=0)return {success:false,msg:'金额必须大于0'};var amountWan=amount/10000;if(G.personal.deposit<amountWan)return {success:false,msg:'可用资金不足，需要'+fmtYuan(amountWan)};G.personal.deposit-=amountWan;G.personal.bank.currentDeposit+=amount;addLog('银行','活期存款存入'+fmtYuan(amountWan)+'，当前活期余额'+fmtYuan(G.personal.bank.currentDeposit/10000),'info');return {success:true};}
function withdrawCurrent(amount){if(amount<=0)return {success:false,msg:'金额必须大于0'};if(G.personal.bank.currentDeposit<amount)return {success:false,msg:'活期存款不足'};var amountWan=amount/10000;G.personal.bank.currentDeposit-=amount;G.personal.deposit+=amountWan;addLog('银行','活期取款'+fmtYuan(amountWan)+'，当前活期余额'+fmtYuan(G.personal.bank.currentDeposit/10000),'info');return {success:true};}
function depositFixed(amount,months){if(amount<=0)return {success:false,msg:'金额必须大于0'};var amountWan=amount/10000;if(G.personal.deposit<amountWan)return {success:false,msg:'可用资金不足，需要'+fmtYuan(amountWan)};var rateKey='fixed'+(months<12?months+'m':(months/12)+'y');var rate=BANK_CONFIG.depositRates[rateKey]||BANK_CONFIG.depositRates.fixed1y;G.personal.deposit-=amountWan;var deposit={id:'FD'+Date.now(),amount:amount,rate:rate,months:months,startDate:G.year+'-'+G.month+'-'+G.day,endMonth:G.month+months,endYear:G.year+Math.floor((G.month+months-1)/12),maturityAmount:calcFixedDepositMaturity(amount,rate,months),status:'active'};G.personal.bank.fixedDeposits.push(deposit);addLog('银行','定期存款'+fmtYuan(amount)+'，期限'+months+'个月，利率'+rate+'%，到期本息'+fmtYuan(deposit.maturityAmount),'success');return {success:true};}
function withdrawFixed(depositId,early){var idx=G.personal.bank.fixedDeposits.findIndex(function(d){return d.id===depositId;});if(idx<0)return {success:false,msg:'未找到该定期存款'};var deposit=G.personal.bank.fixedDeposits[idx];var returnAmount;if(early){var elapsedMonths=(G.year-parseInt(deposit.startDate.split('-')[0]))*12+(G.month-parseInt(deposit.startDate.split('-')[1]));returnAmount=deposit.amount*(1+BANK_CONFIG.earlyWithdrawalRate/100*elapsedMonths/12);addLog('银行','定期存款提前支取'+fmtYuan(deposit.amount)+'，按活期利率结算，实得'+fmtYuan(returnAmount),'warn');}else{returnAmount=deposit.maturityAmount;addLog('银行','定期存款到期支取'+fmtYuan(deposit.amount)+'，本息合计'+fmtYuan(returnAmount),'success');}G.personal.deposit+=returnAmount;G.personal.bank.fixedDeposits.splice(idx,1);return {success:true,amount:returnAmount};}
function applyLoan(type,amount,months){if(amount<=0)return {success:false,msg:'金额必须大于0'};var limit=BANK_CONFIG.loanLimits[type]||500000;if(amount>limit)return {success:false,msg:'超过'+type+'贷款上限'+fmtYuan(limit)};var rate=BANK_CONFIG.loanRates[type]||5.0;var monthlyPayment=calcMonthlyPayment(amount,rate,months);var loan={id:'LN'+Date.now(),type:type,typeName:{mortgage:'住房贷款',car:'汽车贷款',consumer:'消费贷款',business:'经营贷款',education:'助学贷款'}[type]||'贷款',amount:amount,rate:rate,months:months,startDate:G.year+'-'+G.month+'-'+G.day,monthlyPayment:monthlyPayment,remaining:amount,paidMonths:0,totalInterest:monthlyPayment*months-amount,status:'active'};G.personal.bank.loans.push(loan);G.personal.deposit+=amount;G.personal.bank.creditScore=Math.max(300,G.personal.bank.creditScore-5);addLog('银行',loan.typeName+'审批通过，金额'+fmtYuan(amount)+'，期限'+months+'个月，利率'+rate+'%，月供'+fmtYuan(monthlyPayment),'success');return {success:true,loan:loan};}
function repayLoan(loanId,amount){var idx=G.personal.bank.loans.findIndex(function(l){return l.id===loanId;});if(idx<0)return {success:false,msg:'未找到该贷款'};var loan=G.personal.bank.loans[idx];var payment=amount||loan.monthlyPayment;var paymentWan=payment/10000;if(G.personal.deposit<paymentWan)return {success:false,msg:'可用资金不足，需'+fmtYuan(paymentWan)};G.personal.deposit-=paymentWan;var monthlyRate=loan.rate/100/12;var interest=loan.remaining*monthlyRate;var principal=payment-interest;loan.remaining=Math.max(0,loan.remaining-principal);loan.paidMonths++;G.personal.bank.creditScore=Math.min(850,G.personal.bank.creditScore+2);if(loan.remaining<=0||loan.paidMonths>=loan.months){loan.status='completed';addLog('银行',loan.typeName+'已还清，共还款'+loan.paidMonths+'期','success');}else{addLog('银行',loan.typeName+'还款'+fmtYuan(payment)+'（本金'+fmtYuan(principal)+'，利息'+fmtYuan(interest)+'），剩余'+fmtYuan(loan.remaining),'info');}return {success:true};}
function prepayLoan(loanId,amount){var idx=G.personal.bank.loans.findIndex(function(l){return l.id===loanId;});if(idx<0)return {success:false,msg:'未找到该贷款'};var loan=G.personal.bank.loans[idx];var penalty=loan.remaining*BANK_CONFIG.prepaymentPenalty/100;var total=amount+penalty;if(G.personal.deposit<total)return {success:false,msg:'可用资金不足，需'+fmtYuan(total)+'（含违约金'+fmtYuan(penalty)+'）'};G.personal.deposit-=total;loan.remaining=Math.max(0,loan.remaining-amount);addLog('银行',loan.typeName+'提前还款'+fmtYuan(amount)+'，违约金'+fmtYuan(penalty)+'，剩余'+fmtYuan(loan.remaining),'warn');if(loan.remaining<=0){loan.status='completed';addLog('银行',loan.typeName+'已提前结清','success');}return {success:true};}
function updateBankSystem(){if(!G||!G.personal||!G.personal.bank)return;if(G.personal.bank.currentDeposit>0){var monthlyInterest=G.personal.bank.currentDeposit*BANK_CONFIG.depositRates.current/100/12;G.personal.bank.currentDeposit+=monthlyInterest;}G.personal.bank.fixedDeposits.forEach(function(deposit){if(deposit.status==='active'){var endYear=deposit.endYear;var endMonth=((deposit.endMonth-1)%12)+1;if(G.year>endYear||(G.year===endYear&&G.month>=endMonth)){deposit.status='matured';G.personal.bank.currentDeposit+=deposit.maturityAmount;addLog('银行','定期存款到期'+fmtYuan(deposit.amount)+'，本息'+fmtYuan(deposit.maturityAmount)+'已自动转入活期','success');}}});G.personal.bank.fixedDeposits=G.personal.bank.fixedDeposits.filter(function(d){return d.status==='active';});G.personal.bank.loans.forEach(function(loan){if(loan.status==='active'){if(G.personal.deposit>=loan.monthlyPayment){repayLoan(loan.id,loan.monthlyPayment);}else{loan.remaining*=1.005;G.personal.bank.creditScore=Math.max(300,G.personal.bank.creditScore-10);addLog('银行',loan.typeName+'逾期，罚息后剩余'+fmtYuan(loan.remaining)+'，信用评分下降','warn');}}});G.personal.bank.totalAssets=G.personal.deposit+G.personal.bank.currentDeposit/10000+G.personal.bank.fixedDeposits.reduce(function(s,d){return s+d.amount/10000;},0);G.personal.bank.totalLiabilities=G.personal.bank.loans.reduce(function(s,l){return s+l.remaining/10000;},0);}

class ValueNoise{constructor(seed){this.seed=seed;this.perm=[];var rand=this._mulberry32(seed);var p=[];for(var i=0;i<256;i++)p.push(i);for(var i=255;i>0;i--){var j=Math.floor(rand()*(i+1));var tmp=p[i];p[i]=p[j];p[j]=tmp;}this.perm=p.concat(p);}_mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}}_hash(x,y){return this.perm[(this.perm[x&255]+y)&255]/255;}_fade(t){return t*t*(3-2*t);}noise(x,y){var xi=Math.floor(x),yi=Math.floor(y);var xf=x-xi,yf=y-yi;var u=this._fade(xf),v=this._fade(yf);var a=this._hash(xi,yi);var b=this._hash(xi+1,yi);var c=this._hash(xi,yi+1);var d=this._hash(xi+1,yi+1);return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;}fbm(x,y,octaves,lacunarity,gain){octaves=octaves||4;lacunarity=lacunarity||2;gain=gain||0.5;var value=0,amplitude=1,frequency=1,maxVal=0;for(var i=0;i<octaves;i++){value+=amplitude*this.noise(x*frequency,y*frequency);maxVal+=amplitude;amplitude*=gain;frequency*=lacunarity;}return value/maxVal;}}

function getLinePoints(x1,y1,x2,y2){var points=[];var dx=Math.abs(x2-x1);var dy=Math.abs(y2-y1);var sx=x1<x2?1:-1;var sy=y1<y2?1:-1;var err=dx-dy;var x=x1,y=y1;while(true){points.push({x:x,y:y});if(x===x2&&y===y2)break;var e2=2*err;if(e2>-dy){err-=dy;x+=sx;}if(e2<dx){err+=dx;y+=sy;}}return points;}

// ---------- 工具函数 ----------
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function weightedPick(items) {
  var total = items.reduce(function(s, it) { return s + it.w; }, 0);
  var r = Math.random() * total;
  for (var i = 0; i < items.length; i++) { r -= items[i].w; if (r <= 0) return items[i].v; }
  return items[items.length - 1].v;
}

// ---------- 市民Agent ----------
var _citizenId = 0;
function createCitizen(age, gender, education) {
  _citizenId++;
  var g = gender || (Math.random() < 0.51 ? '男' : '女');
  var edu = education;
  if (!edu) {
    if (age < 6) edu = '文盲';
    else if (age < 12) edu = '小学';
    else if (age < 15) edu = '初中';
    else if (age < 18) edu = '高中';
    else if (age < 22) edu = weightedPick([{v:'高中',w:30},{v:'大专',w:25},{v:'本科',w:40},{v:'硕士',w:5}]);
    else edu = weightedPick([{v:'高中',w:15},{v:'大专',w:25},{v:'本科',w:40},{v:'硕士',w:15},{v:'博士',w:5}]);
  }
  return {
    id: 'C' + _citizenId,
    name: genName(g),
    gender: g,
    birthYear: (G ? G.year : 1980) - age,
    age: age,
    education: edu,
    educationProgress: age < 22 ? rand(0.3, 0.9) : 1,
    health: clamp(rand(60, 100) - (age > 50 ? (age - 50) * 0.5 : 0), 10, 100),
    happiness: rand(40, 80),
    stress: rand(10, 50),
    income: (function(){
      var avgWage=(G&&G.society&&G.society.averageWage)?G.society.averageWage:45;
      if(age<18)return 0;
      if(age>=60)return Math.round(avgWage*0.7);
      var occ=age>=18&&age<60?['工人','职员','服务员','技术员','个体户','农民','无业'][Math.floor(Math.random()*7)]:'退休';
      var wageMap={'工人':0.9,'职员':1.1,'服务员':0.7,'技术员':1.3,'个体户':1.5,'农民':0.5,'无业':0,'退休':0.7,'学生':0};
      return Math.round(avgWage*(wageMap[occ]||1)*(0.8+Math.random()*0.4));
    })(),
    savings: (function(){
      if(age<18)return Math.round(Math.random()*100);
      if(age<30)return Math.round(Math.random()*500);
      if(age<50)return Math.round(Math.random()*3000);
      return Math.round(Math.random()*8000);
    })(),
    debt: 0,
    occupation: age >= 18 && age < 60 ? pick(['工人','职员','服务员','技术员','个体户','农民','无业']) : (age < 18 ? '学生' : '退休'),
    workplace: null,
    industry: null,
    maritalStatus: age >= 22 && Math.random() < 0.6 ? '已婚' : '未婚',
    spouse: null,
    children: [],
    parents: [],
    socialClass: '工薪阶层',
    skills: { 技术: randInt(1, 5), 管理: randInt(1, 3), 沟通: randInt(1, 4) },
    isAlive: true,
    retired: age >= 60,
    unemployed: age >= 18 && age < 60 && Math.random() < 0.08,
    monthsUnemployed: 0,
    medicalExpense: 0,
    lifeEvents: [],
    needs: {survival:0.7,economic:0.5,social:0.3,esteem:0.2,selfActual:0.1},
    behaviorLog: []
  };
}
